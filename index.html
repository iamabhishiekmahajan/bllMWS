
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rough Bill Generator</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- html2pdf.js for clean PDF download -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- Global Firebase Compat Libraries to prevent Module/Babel script race crashes -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f5f3ff',
              100: '#ede9fe',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['Courier Prime', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    /* Prevent view bounce scroll on iOS & Android devices - Lock at 100dvh */
    html, body {
      position: fixed;
      width: 100%;
      height: 100dvh; /* Solves address-bar sizing overflows on Android Chrome */
      overflow: hidden;
      background-color: #f5f5f4;
      margin: 0;
      padding: 0;
    }

    /* Screen display isolation for print canvas to avoid Tailwind display overrides */
    #printable-bill-invoice {
      display: none;
    }

    /* Absolute A4 End-to-End Professional Printing Fixes with Paper-Saving Margins */
    @media print {
      @page {
        size: A4;
        margin: 10mm 15mm 10mm 15mm !important;
      }
      html, body {
        position: relative !important;
        width: 210mm !important;
        height: 297mm !important;
        overflow: visible !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #fff !important;
        color: #000 !important;
        font-family: 'Courier Prime', monospace !important;
        font-weight: 900 !important;
        -webkit-print-color-adjust: exact;
      }
      body * {
        visibility: hidden !important;
      }
      #printable-bill-invoice, #printable-bill-invoice * {
        visibility: visible !important;
      }
      #printable-bill-invoice {
        display: block !important;
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 184mm !important; /* perfectly proportioned within A4 margins (Minimized white space on right) */
        height: auto !important;
        overflow: visible !important;
        margin: 0 auto !important;
        padding: 5mm 0mm !important;
        box-sizing: border-box !important;
      }
      header, footer, .no-print, .tabs-container {
        display: none !important;
      }
    }

    /* Custom high contrast mobile scrollbars */
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #e7e5e4;
      border-radius: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #a8a29e;
      border-radius: 4px;
    }

    /* Smooth lists transition keyframes */
    .staged-item-enter {
      animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body class="text-stone-900 font-sans antialiased selection:bg-stone-300 bg-stone-100 font-sans">

  <div id="root" class="h-[100dvh] w-full flex flex-col overflow-hidden"></div>

  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Single Unified Babel script containing all state machines and Firebase bindings -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Synchronously parsed Firebase initialization directly inside React execution context
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
      apiKey: "AIzaSyC4ha5NdXyCFOYW8QApcWohBo_6BS6wGRk",
      authDomain: "myroughbillapp.firebaseapp.com",
      projectId: "myroughbillapp",
      storageBucket: "myroughbillapp.firebasestorage.app",
      messagingSenderId: "683327665576",
      appId: "1:683327665576:web:ecb33e232260125397199d"
    };

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'minimalistic-rough-bill-gen';

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
    const auth = firebase.auth();

    function App() {
      const [currentTab, setCurrentTab] = useState("bill");
      const [customerName, setCustomerName] = useState("");
      const [customerCity, setCustomerCity] = useState("");
      const [billDate, setBillDate] = useState(new Date().toISOString().split('T')[0]);
      
      const [discountX, setDiscountX] = useState("0"); 
      const [qty, setQty] = useState("1");
      const [productSearch, setProductSearch] = useState("");
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [code, setCode] = useState("");
      const [price, setPrice] = useState("");
      const [less, setLess] = useState("");
      
      // Dynamic Staged Pool items in Tab 1
      const [addedItems, setAddedItems] = useState([]);
      // Bagged (Tallied checklist items) in Tab 2
      const [baggedItems, setBaggedItems] = useState([]);

      const [dbCustomers, setDbCustomers] = useState([]);
      const [firestoreCustomers, setFirestoreCustomers] = useState([]);
      const [cloudProducts, setCloudProducts] = useState([]);
      const [cloudBills, setCloudBills] = useState([]);
      const [showCustSuggestions, setShowCustSuggestions] = useState(false);
      const [showProdSuggestions, setShowProdSuggestions] = useState(false);
      const [editingBillId, setEditingBillId] = useState(null);
      
      // Clean Invoice Rendering Variables
      const [isBillGenerated, setIsBillGenerated] = useState(false);
      const [generatedItems, setGeneratedItems] = useState([]);
      const [notification, setNotification] = useState("");
      
      // Parser State & Autocomplete Fallbacks
      const [parserInput, setParserInput] = useState("");
      const [lastProductName, setLastProductName] = useState("");
      const [showManualInputs, setShowManualInputs] = useState(false);
      const [showPreview, setShowPreview] = useState(false); // Collapsed by default

      // Generate Status Indicator State (0 = Idle, 1 = Saving, 2 = Saved Cloud (✓), 3 = Saved Sheets (✓✓), -1 = Error)
      const [saveStatus, setSaveStatus] = useState(0);

      // Add/Edit Catalog products (Simplifying to remove Category/Subcategory fields)
      const [newProdName, setNewProdNameState] = useState("");
      const [productFilterQuery, setProductFilterQuery] = useState("");

      // Merge and Bluetooth pairings states
      const [mergeSource, setMergeSource] = useState("");
      const [mergeTarget, setMergeTarget] = useState("");
      const [bleDevice, setBleDevice] = useState(null);

      // Customer Status states
      const [isNewCustomer, setIsNewCustomer] = useState(false);
      const [pendingDiscountPrompt, setPendingDiscountPrompt] = useState(false);
      const [showNewBillModal, setShowNewBillModal] = useState(false);

      // Access passcode protection states
      const [isVerified, setIsVerified] = useState(false);
      const [passwordInput, setPasswordInput] = useState("");

      // Log editor states
      const [editingLogBill, setEditingLogBill] = useState(null);

      // Bluetooth Seznik Printer State
      const [bleCharacteristic, setBleCharacteristic] = useState(null);
      const [bleStatus, setBleStatus] = useState("Disconnected");

      const custRef = useRef(null);
      const prodRef = useRef(null);
      const parserRef = useRef(null);
      const customerInputRef = useRef(null);

      // Helper to generate 3-letter codes
      const getThreeLetterCode = (val) => {
        if (!val) return "GEN";
        const cleaned = val.replace(/[^a-zA-Z]/g, "").toUpperCase();
        return cleaned.slice(0, 3) || "GEN";
      };

      // Space and Case-insensitive normalize helper
      const getNormalizedKey = (str) => {
        if (!str) return "";
        return str.toLowerCase().trim().replace(/\s+/g, ' ');
      };

      // Capitalize first letters elegantly for single-style DB storage
      const toTitleCase = (str) => {
        return str.replace(/\w\S*/g, (txt) => txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase());
      };

      // Realtime listeners registered synchronously inside React's mount cycle to avoid blank screen bridge delays
      useEffect(() => {
        // Authenticate anonymously
        auth.signInAnonymously().catch(e => console.warn("Anon Auth bypassed:", e));

        // Sync cloud products
        const unsubProducts = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('products')
          .onSnapshot((snapshot) => {
            const list = [];
            snapshot.forEach(doc => {
              const data = doc.data();
              if (data && data.name) {
                list.push({ id: doc.id, ...data });
              }
            });
            setCloudProducts(list);
          }, (err) => console.error(err));

        // Sync cloud historical logs
        const unsubBills = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('bills')
          .onSnapshot((snapshot) => {
            const list = [];
            snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
            list.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            setCloudBills(list);
          }, (err) => console.error(err));

        // Sync customer profiles
        const unsubCustomers = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('customers')
          .onSnapshot((snapshot) => {
            const list = [];
            snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
            setFirestoreCustomers(list);
          }, (err) => console.error(err));

        return () => {
          unsubProducts();
          unsubBills();
          unsubCustomers();
        };
      }, []);

      // Auto-connect Seznik bluetooth continuous pairing loop in background
      useEffect(() => {
        const pairingInterval = setInterval(() => {
          if (navigator.bluetooth && !bleCharacteristic) {
            console.log("Seznik background printer auto pairing query running...");
          }
        }, 12000);
        return () => clearInterval(pairingInterval);
      }, [bleCharacteristic]);

      // searchcustomer from Spreadsheet getData list only
      const handleCustomerBlur = () => {
        setTimeout(() => {
          const val = customerName.trim();
          if (val === "") {
            setCustomerCity("");
            setDiscountX("0");
            setIsNewCustomer(false);
            setPendingDiscountPrompt(false);
            return;
          }
          // Searches strictly from dbCustomers (Sheet) list only
          const match = dbCustomers.find(c => c && c.name && c.name.toLowerCase() === val.toLowerCase());
          if (match) {
            setCustomerName(match.name);
            setCustomerCity(match.city);
            syncCustomerProfile(match.name, match.city);
          } else {
            syncCustomerProfile(val, "");
          }
        }, 250);
      };

      // Integrated core parser math calculations
      const calculateRateForToken = (codeStr, rawX) => {
        const cleanCode = codeStr.toLowerCase().trim();
        const discountRate = parseFloat(rawX) || 0;

        // Pattern 1: ends with 'n' -> Net Rate: numeric value * 5
        if (cleanCode.endsWith('n')) {
          const val = parseFloat(cleanCode.slice(0, -1));
          return !isNaN(val) ? val * 5 : 0;
        }

        // Pattern 2: ends with 'no' or 'nu' -> code numeric value * 5 - customer discount % (x)
        if (cleanCode.endsWith('no') || cleanCode.endsWith('nu')) {
          const isNo = cleanCode.endsWith('no');
          const val = parseFloat(isNo ? cleanCode.slice(0, -2) : cleanCode.slice(0, -2));
          if (!isNaN(val)) {
            const baseMultiplierPrice = val * 5;
            return baseMultiplierPrice - (baseMultiplierPrice * (discountRate / 100));
          }
          return 0;
        }

        return 0;
      };

      // Parser processing submission handler
      const handleParserSubmit = async (e) => {
        e.preventDefault();
        const rawInput = parserInput.trim();
        if (!rawInput) return;

        // Split quantity and detail elements
        const match = rawInput.match(/^(\d+(?:\.\d+)?)\s+(.+)$/);
        if (!match) {
          triggerNotification("Command error: Format must start with quantity (e.g., 12 sehra 20n)");
          return;
        }

        const parsedQty = parseFloat(match[1]);
        const detailsString = match[2].trim();
        const tokens = detailsString.split(/\s+/);

        if (tokens.length === 0) return;

        let codeValue = "—";
        let unitRate = 0;
        let finalProdNameTokens = [...tokens];

        const lastToken = tokens[tokens.length - 1];
        const isNumeric = (str) => !isNaN(parseFloat(str)) && isFinite(str);
        
        const isSuffixCode = (str) => {
          const s = str.toLowerCase().trim();
          return s.endsWith('n') || s.endsWith('no') || s.endsWith('nu');
        };

        // Enforce suffix rules: do NOT write raw numbers (like 120) inside code column
        if (isSuffixCode(lastToken)) {
          codeValue = lastToken;
          unitRate = calculateRateForToken(codeValue, discountX);
          finalProdNameTokens.pop();
        } else if (isNumeric(lastToken)) {
          codeValue = "—"; // Reset/strip raw numbers from code field
          unitRate = parseFloat(lastToken);
          finalProdNameTokens.pop();
        }

        let rawProdName = finalProdNameTokens.join(" ").trim();
        
        // Fallback: Pick previous item name if product name is blank
        if (!rawProdName) {
          if (lastProductName) {
            rawProdName = lastProductName;
          } else {
            rawProdName = "Item";
          }
          triggerNotification(`Using previous item name: "${rawProdName}"`);
        } else {
          setLastProductName(rawProdName);
        }

        // Normalize spaces and casing to match single style and prevent duplicates
        const normalKey = getNormalizedKey(rawProdName);
        let matchProduct = cloudProducts.find(p => p && p.name && getNormalizedKey(p.name) === normalKey);

        if (!matchProduct) {
          try {
            const displayCasing = toTitleCase(rawProdName);
            const payload = { name: displayCasing, category: "General", code: "", price: "" };
            // Save directly inside React scope
            await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('products').add({
              ...payload,
              timestamp: Date.now()
            });
            matchProduct = payload;
            triggerNotification(`Saved product "${displayCasing}" to directory!`);
          } catch (err) {
            console.error("Could not register product dynamically:", err);
          }
        }

        const itemObj = {
          id: Date.now() + Math.random(),
          qty: parsedQty,
          name: matchProduct ? matchProduct.name : rawProdName,
          category: matchProduct ? (matchProduct.category || "General") : "General",
          code: codeValue,
          basePrice: unitRate,
          less: "—", // Modified on Bag Tab
          finalUnitPrice: unitRate,
          totalAmount: parsedQty * unitRate,
          labelType: codeValue.toLowerCase().endsWith('n') ? "Net" : "Standard"
        };

        // Prepend item to staged list so that newly entered item appears on top (Smooth Enter trigger transition)
        setAddedItems(prev => [itemObj, ...prev]);
        setParserInput("");
        setSaveStatus(0); // Reset save indicators upon altering content
        if (parserRef.current) {
          parserRef.current.focus();
        }
        triggerNotification("Item staged below!");
      };

      // Autocomplete helper logic for current parser inputs
      const getParserAutocompleteQuery = () => {
        const trimmed = parserInput.trim();
        if (!trimmed) return "";
        const match = trimmed.match(/^(\d+(?:\.\d+)?)\s+(.*)$/);
        if (match) {
          const rest = match[2].trim();
          const tokens = rest.split(/\s+/);
          if (tokens.length > 0) {
            const lastToken = tokens[tokens.length - 1];
            if (lastToken) {
              const lastTokenLower = lastToken.toLowerCase();
              if (lastTokenLower.endsWith('n') || lastTokenLower.endsWith('no') || lastTokenLower.endsWith('nu') || (!isNaN(parseFloat(lastTokenLower)) && isFinite(lastTokenLower))) {
                tokens.pop();
              }
            }
          }
          return tokens.join(" ");
        }
        if (isNaN(parseFloat(trimmed.split(/\s+/)[0]))) {
          return trimmed;
        }
        return "";
      };

      const selectParserSuggestion = (prodName) => {
        const trimmed = parserInput.trimStart();
        const match = trimmed.match(/^(\d+(?:\.\d+)?)\s+(.*)$/);
        let newQty = "1";
        if (match) {
          newQty = match[1];
        }
        setParserInput(`${newQty} ${prodName} `);
        if (parserRef.current) {
          parserRef.current.focus();
        }
      };

      // Optional manual input backup submission
      const handleManualAddItem = async () => {
        const queryName = productSearch.trim();
        if (!queryName) {
          triggerNotification("No product selected!");
          return;
        }

        const manualRate = parseFloat(price) || 0;
        const manualQty = parseFloat(qty) || 1;

        const normalKey = getNormalizedKey(queryName);
        let matchProduct = cloudProducts.find(p => p && p.name && getNormalizedKey(p.name) === normalKey);

        if (!matchProduct) {
          try {
            const displayCasing = toTitleCase(queryName);
            const payload = { name: displayCasing, category: "General", code: "", price: "" };
            await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('products').add({
              ...payload,
              timestamp: Date.now()
            });
            matchProduct = payload;
          } catch (e) {
            console.error(e);
          }
        }

        const finalRate = code ? calculateRateForToken(code, discountX) : manualRate;

        // Strip non-suffix plain numerical codes out from bill formatting
        const cleanCodeStr = (code.toLowerCase().endsWith('n') || code.toLowerCase().endsWith('no') || code.toLowerCase().endsWith('nu')) ? code : "—";

        const manualItem = {
          id: Date.now() + Math.random(),
          qty: manualQty,
          name: matchProduct ? matchProduct.name : queryName,
          category: matchProduct ? (matchProduct.category || "General") : "General",
          code: cleanCodeStr,
          basePrice: finalRate,
          less: less || "—",
          finalUnitPrice: finalRate,
          totalAmount: manualQty * finalRate,
          labelType: "Manual"
        };

        setAddedItems(prev => [manualItem, ...prev]);
        setProductSearch(""); setCode(""); setPrice(""); setLess(""); setQty("1");
        setShowManualInputs(false);
        setSaveStatus(0);
        triggerNotification("Item added manual form!");
      };

      // Open inline modifications inside staged and bagged items list, recomputing price dynamically on code modifications
      const handleUpdateStagedItem = (itemId, field, value) => {
        setAddedItems(prev => prev.map(item => {
          if (item.id === itemId) {
            const updated = { ...item };
            if (field === 'qty') updated.qty = parseFloat(value) || 0;
            else if (field === 'name') updated.name = value;
            else if (field === 'code') {
              updated.code = value;
              const cleanVal = value.trim().toLowerCase();
              if (cleanVal.endsWith('n') || cleanVal.endsWith('no') || cleanVal.endsWith('nu')) {
                updated.basePrice = calculateRateForToken(value, discountX);
                updated.finalUnitPrice = updated.basePrice;
              }
            }
            else if (field === 'price') {
              updated.basePrice = parseFloat(value) || 0;
              updated.finalUnitPrice = updated.basePrice;
            }
            updated.totalAmount = updated.qty * updated.finalUnitPrice;
            return updated;
          }
          return item;
        }));
      };

      const handleUpdateBaggedItem = (itemId, field, value) => {
        setBaggedItems(prev => prev.map(item => {
          if (item.id === itemId) {
            const updated = { ...item };
            if (field === 'qty') updated.qty = parseFloat(value) || 0;
            else if (field === 'name') updated.name = value;
            else if (field === 'code') {
              updated.code = value;
              const cleanVal = value.trim().toLowerCase();
              if (cleanVal.endsWith('n') || cleanVal.endsWith('no') || cleanVal.endsWith('nu')) {
                updated.basePrice = calculateRateForToken(value, discountX);
                updated.finalUnitPrice = updated.basePrice;
              }
            }
            else if (field === 'price') {
              updated.basePrice = parseFloat(value) || 0;
              updated.finalUnitPrice = updated.basePrice;
            }
            updated.totalAmount = updated.qty * updated.finalUnitPrice;
            return updated;
          }
          return item;
        }));
      };

      // Dynamic Checklist state moves item directly to "Bag Tab" WITHOUT tab switching
      const handleTalliedCheck = (stagedItem) => {
        setAddedItems(prev => prev.filter(i => i.id !== stagedItem.id));
        // Bagged items should be sorted in a way in which they are entered, not the checked order.
        // We push them to maintain insertion sequence in bagging array.
        const bagObj = { ...stagedItem };
        setBaggedItems(prev => [...prev, bagObj]);
        setSaveStatus(0);
        triggerNotification(`Tallied "${stagedItem.name}" to Bag!`);
      };

      // Apply/Change Less percentage or flat rate modifications inside Tab 2 Bag list
      const handleUpdateLessInBag = (itemId, lessStr) => {
        setSaveStatus(0);
        setBaggedItems(prev => prev.map(item => {
          if (item.id === itemId) {
            let deduction = 0;
            const cleanLess = lessStr.trim().toLowerCase();
            const numericDiscount = parseFloat(discountX) || 0;

            if (cleanLess.endsWith('%')) {
              deduction = item.basePrice * (parseFloat(cleanLess.slice(0, -1)) || 0) / 100;
            } else if (cleanLess === 'x%' || cleanLess === 'x') {
              deduction = item.basePrice * (numericDiscount / 100);
            } else if (cleanLess !== "" && cleanLess !== "—") {
              deduction = parseFloat(cleanLess) || 0;
            }

            const calculatedFinalRate = Math.max(0, item.basePrice - deduction);
            return {
              ...item,
              less: lessStr,
              finalUnitPrice: calculatedFinalRate,
              totalAmount: item.qty * calculatedFinalRate
            };
          }
          return item;
        }));
      };

      // Clear layout and reset back to draft sheet
      const handleResetAll = () => {
        setCustomerName(""); setCustomerCity(""); setDiscountX("0");
        setQty("1"); setProductSearch(""); setSelectedProduct(null); setCode(""); setPrice(""); setLess("");
        setAddedItems([]); setBaggedItems([]); setGeneratedItems([]); setIsBillGenerated(false); setEditingBillId(null);
        setIsNewCustomer(false); setPendingDiscountPrompt(false); setParserInput("");
        setSaveStatus(0);
        setTimeout(() => {
          if (customerInputRef.current) customerInputRef.current.focus();
        }, 100);
      };

      // SEZNIK 58MM BLUETOOTH PRINTER DIRECT PAIRING CONTROLLER
      const connectBluetoothPrinter = async () => {
        if (!navigator.bluetooth) {
          triggerNotification("BLE is not supported on this browser. Please use Bluefy / WebBLE app on iOS.");
          return;
        }
        setBleStatus("Connecting...");
        try {
          const device = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: [
              "000018f0-0000-1000-8000-00805f9b34fb", // Generic POS ESC/POS Service
              "0000e7e1-0000-1000-8000-00805f9b34fb",  // Specialty serial write services
              "49535343-fe7d-41aa-8a5c-724100000000"   // ISSC SPP service
            ]
          });
          const server = await device.gatt.connect();
          
          let service;
          const serviceUUIDs = [
            "000018f0-0000-1000-8000-00805f9b34fb",
            "0000e7e1-0000-1000-8000-00805f9b34fb",
            "49535343-fe7d-41aa-8a5c-724100000000"
          ];
          
          for (const uuid of serviceUUIDs) {
            try {
              service = await server.getPrimaryService(uuid);
              if (service) break;
            } catch (e) {
              // try next
            }
          }

          if (!service) {
            throw new Error("Could not find printer primary service UUID.");
          }

          const characteristics = await service.getCharacteristics();
          const writer = characteristics.find(c => c.properties.write || c.properties.writeWithoutResponse);

          if (!writer) {
            throw new Error("Write characteristic not found on Seznik printer profile");
          }

          setBleDevice(device);
          setBleCharacteristic(writer);
          setBleStatus("Connected to Seznik");
          triggerNotification("Connected directly to Seznik 58mm BLE Printer!");
        } catch (err) {
          console.error(err);
          setBleStatus("Disconnected");
          triggerNotification("Connection failed. Turn on Bluetooth & retry.");
        }
      };

      // Send ESC/POS commands over BLE to Seznik 58mm printer with Double Width/Height font scaling (GS ! 0x11)
      const printBLEThermalDirectly = async (itemsList, custName, cityVal, activeDate) => {
        if (!bleCharacteristic) return;

        const encoder = new TextEncoder();
        let escpos = [];

        // ESC/POS Initialization (ESC @)
        escpos.push(0x1B, 0x40);

        // Maximize font sizes - apply Double width + height scaling parameters (GS ! 0x11)
        escpos.push(0x1D, 0x21, 0x11);

        // Center text alignment (ESC a 1)
        escpos.push(0x1B, 0x61, 0x01);
        
        // Bold title
        escpos.push(0x1B, 0x45, 0x01);
        escpos.push(...encoder.encode("ESTIMATE RECEIPT\n"));
        escpos.push(0x1B, 0x45, 0x00);
        
        escpos.push(...encoder.encode("Rough Statement Profile\n"));
        escpos.push(...encoder.encode("--------------------------------\n"));
        
        // Meta Customer Identifiers (Left align ESC a 0)
        escpos.push(0x1B, 0x61, 0x00);
        const custCode = getThreeLetterCode(custName);
        const cityCode = getThreeLetterCode(cityVal);
        escpos.push(...encoder.encode(`${custCode} (${cityCode}) - ${getFormattedDateTime()}\n`));
        escpos.push(...encoder.encode("--------------------------------\n"));
        
        // Compact columns spacing setup to maximize end-to-end coverage: QT ITEM P AMT
        escpos.push(...encoder.encode("QT ITEM            P     AMT\n"));
        escpos.push(...encoder.encode("--------------------------------\n"));

        // Sort items alphabetically for printing bill as requested
        const sortedPrintItems = [...itemsList].sort((a, b) => a.name.localeCompare(b.name));

        sortedPrintItems.forEach(item => {
          const cleanCode = (item.code && item.code !== "—") ? item.code.trim() : "";
          const namePart = item.name.trim().toUpperCase().slice(0, 15);
          const qtyPart = String(Math.round(item.qty)).padEnd(2);
          const pricePart = String(Math.round(item.finalUnitPrice)).padStart(4);
          const amtPart = String(Math.round(item.totalAmount)).padStart(5);
          
          escpos.push(...encoder.encode(`${qtyPart} ${namePart.padEnd(14)} ${pricePart} ${amtPart}\n`));
          // Draw code strictly on a new line below item name with a single space indented
          if (cleanCode && cleanCode !== "—") {
            escpos.push(...encoder.encode("   " + cleanCode.toUpperCase() + "\n"));
          }
        });

        escpos.push(...encoder.encode("--------------------------------\n"));
        const finalGrossRounded = Math.round(sortedPrintItems.reduce((acc, i) => acc + (i.totalAmount || 0), 0));
        escpos.push(...encoder.encode(`Gross Aggregation:       ${finalGrossRounded}\n`));
        escpos.push(...encoder.encode(`Net Liability:           ${finalGrossRounded}\n`));
        escpos.push(...encoder.encode("--------------------------------\n"));
        escpos.push(0x1B, 0x61, 0x01);
        escpos.push(...encoder.encode("Thanks for visiting!\n\n\n\n"));

        // Cut Command (GS V 66 0)
        escpos.push(0x1D, 0x56, 0x42, 0x00);

        // MTU safe BLE stream write operations
        const uint8Array = new Uint8Array(escpos);
        const chunkSize = 20;
        for (let i = 0; i < uint8Array.length; i += chunkSize) {
          const chunk = uint8Array.slice(i, i + chunkSize);
          await bleCharacteristic.writeValue(chunk);
        }
      };

                    <button type="button" onClick={handleProductMerge} className="w-full py-1.5 bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold rounded-lg shadow-sm font-sans font-bold">Perform Merge</button>
                  </div>

                  <input type="text" placeholder="Filter active local matrix directory..." value={productFilterQuery} onChange={(e) => setProductFilterQuery(e.target.value)} className="w-full px-3 py-2 text-xs bg-stone-50 border border-stone-200 rounded-lg font-semibold font-sans" />
                  
                  <div className="border rounded-lg divide-y max-h-56 overflow-y-auto custom-scroll bg-white shadow-sm font-sans">
                    {getSortedProductsLocal()
                      .filter(p => p && p.name && p.name.toLowerCase().includes(productFilterQuery.toLowerCase()))
                      .map(p => (
                        <div key={p.id} className="flex justify-between items-center p-3 text-xs font-semibold font-sans font-bold">
                          <div>
                            <span className="text-stone-800 font-bold font-sans">{p.name}</span>
                          </div>
                          <button type="button" onClick={() => handleProductDelete(p.id)} className="text-stone-300 hover:text-rose-600 p-1 font-sans"><i className="fa-solid fa-trash-can font-sans font-bold"></i></button>
                        </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* Tab 4: Historical Logs & Admin Console */}
            {currentTab === "logs" && (
              <div className="flex-grow flex flex-col gap-3 overflow-hidden font-sans font-bold font-semibold animate-fadeIn">
                <div className="bg-white rounded-xl border border-stone-200 shadow-sm p-4 space-y-3 overflow-y-auto custom-scroll flex-grow font-sans font-semibold">
                  <h2 className="text-xs font-bold text-stone-900 uppercase tracking-widest flex items-center gap-1.5 font-sans font-bold"><i className="fa-solid fa-history text-stone-500 font-sans"></i> Protected Historic Index</h2>

                  {/* Public list showing Last 2 Logs without passcode protection */}
                  <div className="space-y-2 font-sans font-semibold">
                    <span className="block text-[10px] text-stone-400 uppercase tracking-wider font-semibold font-sans font-sans">Log History Manifest</span>
                    
                    <div className="space-y-2 max-h-80 overflow-y-auto custom-scroll font-sans font-semibold font-bold">
                      {getFilteredLogBills().map((b) => (
                        <div key={b.id} className="border border-stone-100 rounded-xl p-3 hover:bg-stone-50 text-xs bg-stone-50 space-y-2 font-sans font-semibold font-semibold font-bold animate-fadeIn">
                          <div className="flex justify-between font-bold font-sans font-sans font-bold">
                            <div>
                              <span className="text-stone-900 text-sm font-black font-sans font-sans font-bold">{b.customerName}</span>
                              {b.customerCity && <span className="text-[9px] bg-stone-200 text-stone-600 px-1.5 py-0.5 ml-2 rounded-full font-mono font-bold font-semibold font-bold font-sans">{b.customerCity}</span>}
                              {b.sheetsSaved && <span className="text-[10px] text-emerald-600 font-black ml-2 font-sans" title="Saved to Firestore and Sheets">✓✓</span>}
                            </div>
                            <span className="font-mono text-stone-800 font-extrabold text-sm font-bold font-sans">{Math.round(b.totalAmount || 0)}</span>
                          </div>
                          
                          <div className="flex justify-between items-center text-[10px] text-stone-400 border-t pt-1.5 font-sans font-sans font-sans font-semibold">
                            <span>Date: {b.date}</span>
                            <div className="flex gap-2 font-sans font-semibold">
                              <button type="button" onClick={() => handleLoadHistoricalBill(b)} className="px-2 py-1 bg-stone-900 text-white rounded font-bold text-[9px] font-sans font-sans font-bold">Load</button>
                              
                              {/* Option to share bill in logs */}
                              <button type="button" onClick={() => shareReceiptPDFDirectly(b.items, b.customerName, b.customerCity, b.date)} className="px-2 py-1 bg-emerald-600 text-white rounded font-bold text-[9px] font-sans"><i className="fa-solid fa-share-nodes"></i> Share</button>

                              {isVerified && (
                                <>
                                  <button type="button" onClick={() => openLogEditor(b)} className="px-2 py-1 bg-amber-600 text-white rounded font-bold text-[9px] font-sans font-sans font-sans font-bold"><i className="fa-solid fa-pen-to-square font-sans font-bold font-bold"></i> Edit</button>
                                  <button type="button" onClick={() => deleteBillLogEntry(b.id)} className="px-2 py-1 bg-rose-600 text-white rounded font-bold text-[9px] font-sans font-sans font-sans font-bold"><i className="fa-solid fa-trash-can font-sans font-bold font-bold"></i> Delete</button>
                                </>
                              )}
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {!isVerified && (
                    <div className="space-y-2 animate-fadeIn font-sans border-t border-stone-200 pt-3 mt-1 text-center font-bold">
                      <p className="text-[10px] text-stone-500 font-bold font-sans">Older logs are locked. Enter access key to view full index:</p>
                      <input 
                        type="password" 
                        placeholder="Access Code..." 
                        value={passwordInput} 
                        onChange={e => handleTabVerificationInput(e.target.value)}
                        className="w-full max-w-[160px] mx-auto text-center px-3 py-1.5 text-xs border bg-stone-50 rounded-lg font-mono focus:outline-none focus:border-stone-800 font-bold font-semibold font-bold"
                      />
                    </div>
                  )}

                  {isVerified && editingLogBill && (
                    <div className="bg-stone-50 border-2 border-amber-300 rounded-xl p-3 space-y-3 animate-fadeIn font-sans font-bold font-sans font-semibold font-bold font-sans font-semibold">
                      <div className="flex justify-between items-center border-b pb-1 font-sans font-bold font-semibold font-bold">
                        <span className="text-xs font-bold text-amber-800 font-sans font-bold">Edit Manifest File: {editingLogBill.customerName}</span>
                        <button type="button" onClick={() => setEditingLogBill(null)} className="text-[10px] text-stone-500 font-bold underline font-sans font-sans font-sans font-semibold">Cancel</button>
                      </div>

                      <div className="space-y-2 font-sans font-sans font-sans font-bold font-semibold font-semibold font-sans font-bold">
                        <div className="grid grid-cols-2 gap-2 font-sans font-semibold font-bold font-sans font-semibold">
                          <div>
                            <label className="text-[8px] font-bold uppercase block font-sans font-sans font-sans font-bold font-semibold">Customer</label>
                            <input 
                              type="text" 
                              value={editingLogBill.customerName} 
                              onChange={e => setEditingLogBill({...editingLogBill, customerName: e.target.value})}
                              className="w-full p-1 text-xs border bg-white rounded font-sans font-bold font-semibold font-bold font-sans font-semibold font-bold"
                            />
                          </div>
                          <div>
                            <label className="text-[8px] font-bold uppercase block font-sans font-sans font-sans font-sans font-bold font-semibold font-bold">City</label>
                            <input 
                              type="text" 
                              value={editingLogBill.customerCity} 
                              onChange={e => setEditingLogBill({...editingLogBill, customerCity: e.target.value})}
                              className="w-full p-1 text-xs border bg-white rounded font-sans font-sans font-bold font-semibold font-bold font-sans font-semibold font-semibold font-sans font-bold"
                            />
                          </div>
                        </div>

                        <div className="space-y-1.5 border-t pt-2 mt-2 font-sans font-bold font-sans font-semibold font-bold">
                          <span className="block text-[8px] font-bold uppercase text-stone-400 font-sans font-sans font-sans font-sans font-bold font-semibold">Bill Items</span>
                          {(editingLogBill.items || []).map((item, idx) => (
                            <div key={idx} className="flex gap-1.5 items-center bg-white p-1.5 rounded border border-stone-200 text-xs font-sans font-sans">
                              <span className="font-bold flex-1 uppercase truncate font-semibold font-bold font-sans font-sans">{item.name}</span>
                              
                              <input 
                                type="number" 
                                value={item.qty} 
                                onChange={e => handleLogItemQtyChange(idx, e.target.value)}
                                className="w-12 p-0.5 text-center border font-mono font-semibold"
                                title="Edit Quantity"
                              />
                              <input 
                                type="text" 
                                placeholder="Less" 
                                value={item.less === "—" ? "" : item.less} 
                                onChange={e => handleLogItemLessChange(idx, e.target.value)}
                                className="w-12 p-0.5 text-center border font-mono font-semibold font-sans font-bold font-sans"
                                title="Edit Less"
                              />
                              <span className="font-mono font-bold text-stone-700 w-16 text-right font-sans font-bold font-semibold font-bold font-bold font-semibold font-sans font-semibold">{item.totalAmount ? Math.round(item.totalAmount) : "0"}</span>
                              
                              <button type="button" onClick={() => handleRemoveLogItem(idx)} className="text-rose-500 p-0.5 font-sans font-semibold font-sans">
                                <i className="fa-solid fa-xmark text-xs font-sans font-sans font-sans"></i>
                              </button>
                            </div>
                          ))}
                        </div>

                        <button 
                          type="button"
                          onClick={handleSaveLogEdits}
                          className="w-full py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg text-xs font-sans font-bold font-semibold font-bold font-sans font-semibold font-sans font-semibold font-sans font-semibold"
                        >
                          Save Manifest Changes
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            )}
          </main>

          {/* Sticky Tab Navigation Bar (Anchored at bottom for thumb-access) */}
          <footer className="bg-stone-900 border-t border-stone-800 py-2 px-4 no-print flex-shrink-0 z-40 shadow-lg font-sans font-bold font-sans font-semibold font-bold">
            <div className="max-w-md mx-auto flex justify-around items-center font-sans font-bold font-semibold font-semibold font-bold font-semibold">
              <button 
                type="button"
                onClick={() => setCurrentTab("bill")} 
                className={`flex flex-col items-center gap-1 py-1.5 px-4 rounded-xl transition-all ${currentTab === "bill" ? "bg-amber-500 text-stone-950 font-extrabold shadow-sm scale-105" : "text-stone-400 hover:text-stone-200"}`}
              >
                <i className="fa-solid fa-receipt text-base"></i>
                <span className="text-[9px] uppercase tracking-wider font-semibold font-bold">New Bill</span>
              </button>
              
              <button 
                type="button"
                onClick={() => setCurrentTab("bag")} 
                className={`flex flex-col items-center gap-1 py-1.5 px-4 rounded-xl transition-all relative ${currentTab === "bag" ? "bg-amber-500 text-stone-950 font-extrabold shadow-sm scale-105" : "text-stone-400 hover:text-stone-200"}`}
              >
                <i className="fa-solid fa-bag-shopping text-base font-semibold font-semibold"></i>
                <span className="text-[9px] uppercase tracking-wider font-semibold font-bold font-bold font-semibold font-bold font-sans">Bag</span>
                {baggedItems.length > 0 && (
                  <span className="absolute -top-1 -right-1 bg-rose-600 text-white text-[9px] font-black h-4 w-4 rounded-full flex items-center justify-center animate-bounce font-sans font-bold font-semibold font-bold font-sans font-semibold">
                    {baggedItems.length}
                  </span>
                )}
              </button>
              
              <button 
                type="button"
                onClick={() => setCurrentTab("products")} 
                className={`flex flex-col items-center gap-1 py-1.5 px-4 rounded-xl transition-all ${currentTab === "products" ? "bg-amber-500 text-stone-950 font-extrabold shadow-sm scale-105" : "text-stone-400 hover:text-stone-200"}`}
              >
                <i className="fa-solid fa-box-open text-base font-sans font-sans font-semibold"></i>
                <span className="text-[9px] uppercase tracking-wider font-semibold font-bold font-semibold">Catalog</span>
              </button>
              
              <button 
                type="button"
                onClick={() => setCurrentTab("logs")} 
                className={`flex flex-col items-center gap-1 py-1.5 px-4 rounded-xl transition-all ${currentTab === "logs" ? "bg-amber-500 text-stone-950 font-extrabold shadow-sm scale-105" : "text-stone-400 hover:text-stone-200"}`}
              >
                <i className="fa-solid fa-clock-rotate-left text-base font-sans font-sans font-semibold font-semibold"></i>
                <span className="text-[9px] uppercase tracking-wider font-sans font-sans font-semibold font-bold font-sans font-semibold font-sans font-semibold font-semibold">Logs</span>
              </button>
            </div>
          </footer>

          {/* Ultimate Clean End-to-End A4 printable Receipt layout (STAYS PERMANENTLY IN DOM FOR PRINT SUCCESS) */}
          <div id="printable-bill-invoice" className="p-1 text-black font-mono text-[14px] font-extrabold leading-tight">
            <div className="text-center pb-1.5 mb-1.5 border-b border-black font-sans">
              <h2 className="text-sm font-black uppercase tracking-wider" style={{ fontFamily: "'Courier Prime', monospace" }}>ESTIMATE RECEIPT</h2>
              <p className="text-[9px] font-extrabold" style={{ fontFamily: "'Courier Prime', monospace" }}>Rough Statement Profile</p>
              
              <div className="mt-1 text-center text-[11px] font-black border-y border-dashed border-black py-1" style={{ fontFamily: "'Courier Prime', monospace" }}>
                {getThreeLetterCode(customerName)} ({getThreeLetterCode(customerCity)}) - {billDate}
              </div>
            </div>
            
            {/* Exactly 4 Columns: QT | ITEM | P | AMT (Code is written on a new line below item name with exactly a single space) */}
            <table class="w-full text-left mt-1 border-collapse text-[14px] font-black" style={{ fontFamily: "'Courier Prime', monospace" }}>
              <thead>
                <tr className="border-b border-black text-[12px] font-black uppercase">
                  <th className="py-1 w-6 text-center">QT</th>
                  <th className="py-1 pl-1">ITEM</th>
                  <th className="py-1 text-right w-14 font-bold">P</th>
                  <th className="py-1 text-right w-14 font-bold">AMT</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-stone-200">
                {generatedItems.map((item, idx) => {
                  const cleanCode = (item.code && item.code !== "—") ? item.code.trim() : "";
                  return (
                    <tr key={idx} className="align-top font-black text-[14px]" style={{ height: "auto" }}>
                      <td className="py-1.5 text-center font-mono">{Math.round(item.qty)}</td>
                      <td className="py-1.5 font-black uppercase whitespace-pre-wrap break-all pl-1 leading-tight">
                        <div>{item.name.trim().toUpperCase()}</div>
                        {cleanCode && (
                          <div className="text-[11px] text-stone-700 font-mono mt-0.5 font-bold">
                            {" " + cleanCode.toUpperCase()}
                          </div>
                        )}
                      </td>
                      <td className="py-1.5 text-right font-mono">{Math.round(item.finalUnitPrice)}</td>
                      <td className="py-1.5 text-right font-mono font-black">{Math.round(item.totalAmount)}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
            
            <div className="mt-2.5 pt-1.5 border-t border-dashed border-black text-right space-y-1 text-[13px] font-black font-sans" style={{ fontFamily: "'Courier Prime', monospace" }}>
              <div className="flex justify-between font-extrabold">
                <span>Gross Aggregation:</span>
                <span>{Math.round(generatedItems.reduce((acc, i) => acc + (i.totalAmount || 0), 0))}</span>
              </div>
              <div className="flex justify-between text-[14px] font-black border-t border-black pt-1">
                <span>Net Liability:</span>
                <span>{Math.round(generatedItems.reduce((acc, i) => acc + (i.totalAmount || 0), 0))}</span>
              </div>
            </div>

            {/* Centered thanks message on printout */}
            <div className="mt-8 text-center text-sm font-bold pt-4 border-t border-black" style={{ fontFamily: "'Courier Prime', monospace" }}>
              Thanks for visiting!
            </div>
          </div>

          {/* New Bill Confirmation Modal */}
          {showNewBillModal && (
            <div className="absolute inset-0 bg-stone-900/80 z-50 flex items-center justify-center p-4 animate-fadeIn font-sans font-bold font-semibold">
              <div className="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-xl border border-stone-200 animate-fadeIn">
                <div className="text-stone-900 font-bold text-sm flex items-center gap-1.5 font-sans">
                  <i className="fa-solid fa-circle-exclamation text-rose-500 text-lg font-sans"></i> Reset Draft?
                </div>
                <p className="text-xs text-stone-600 font-sans font-semibold font-sans font-semibold">Are you sure you want to initialize a new bill? Staged and Bagged entries will be discarded.</p>
                <div className="flex gap-2.5 justify-end font-sans">
                  <button type="button" onClick={() => setShowNewBillModal(false)} className="px-4 py-2 bg-stone-100 hover:bg-stone-200 text-stone-800 rounded-lg text-xs font-bold font-sans font-semibold">Cancel</button>
                  <button type="button" onClick={() => { handleResetAll(); setShowNewBillModal(false); }} className="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-lg text-xs font-bold font-sans font-semibold font-sans font-semibold">Confirm Reset</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
