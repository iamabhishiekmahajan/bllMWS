
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rough Bill Generator Pro</title>
  
  <!-- CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],

          }

  <style>
    html, body {
      position: fixed;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #f5f5f4;
      margin: 0;
      padding: 0;
    }
    #printable-bill-invoice { display: none; }
    @media print {
      @page {
        size: A4;
        margin: 5mm 2mm 5mm 2mm !important;
      }
      html, body {
        position: relative !important;
        width: 210mm !important;
        height: auto !important;
        overflow: visible !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #fff !important;
        color: #000 !important;
        font-family: 'Courier Prime', monospace !important;
        -webkit-print-color-adjust: exact;
      }
      body * { visibility: hidden !important; }
      #printable-bill-invoice, #printable-bill-invoice * { visibility: visible !important; }
      #printable-bill-invoice {
        display: block !important;
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 206mm !important;
        height: auto !important;
        overflow: visible !important;
        margin: 0 !important;
        padding: 2mm 0mm !important;
        box-sizing: border-box !important;
      }
    }
    .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
    .custom-scroll::-webkit-scrollbar-track { background: #e7e5e4; border-radius: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #a8a29e; border-radius: 4px; }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    @keyframes slideInUp {
      from { transform: translateY(12px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-slide-up { animation: slideInUp 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>
<body class="text-stone-900 font-sans antialiased selection:bg-stone-300 bg-stone-100">
  <div id="root" class="h-[100dvh] w-full flex flex-col overflow-hidden"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, getDoc, setDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const appId = 'minimalistic-rough-bill-gen';
    const firebaseConfig = {
      apiKey: "AIzaSyC4ha5NdXyCFOYW8QApcWohBo_6BS6wGRk",
      authDomain: "myroughbillapp.firebaseapp.com",
      projectId: "myroughbillapp",
      storageBucket: "myroughbillapp.firebasestorage.app",
      messagingSenderId: "683327665576",
      appId: "1:683327665576:web:ecb33e232260125397199d"
    };

    let app, auth, db;
    try {
      app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
    } catch (e) {
      console.warn("Could not authenticate Firebase nodes.", e);
    }

    window.firebaseBridge = {
      db, auth, appId, connected: false,
      products: [], bills: [], customers: [],
      doc, getDoc, setDoc, collection, addDoc, updateDoc, deleteDoc, getDocs
    };

    async function startSetup() {
      if (!db) return;
      try {
        if (auth) await signInAnonymously(auth);
      } catch (e) { console.warn("Auth process skipped."); }
      window.firebaseBridge.connected = true;

      onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'products'), (snapshot) => {
        const list = [];
        snapshot.forEach(doc => {
          const data = doc.data();
          if (data && data.name) list.push({ id: doc.id, ...data });
        });
        window.firebaseBridge.products = list;
        if (window.firebaseBridge.onProductsChange) window.firebaseBridge.onProductsChange(list);
      }, (error) => console.error("Products subscription error", error));

      onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'bills'), (snapshot) => {
        const list = [];
        snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
        list.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
        window.firebaseBridge.bills = list;
        if (window.firebaseBridge.onBillsChange) window.firebaseBridge.onBillsChange(list);
      }, (error) => console.error("Bills subscription error", error));

      onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'customers'), (snapshot) => {
        const list = [];
        snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
        window.firebaseBridge.customers = list;
        if (window.firebaseBridge.onCustomersChange) window.firebaseBridge.onCustomersChange(list);
      }, (error) => console.error("Customers subscription error", error));
    }
    window.firebaseBridge.saveBillToCloudWithNumericId = async (numericId, bill) => {
      const stringId = String(numericId);
      const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'bills', stringId);
      await setDoc(docRef, { ...bill, id: numericId, timestamp: numericId }, { merge: true });
      return { id: stringId };
    };
    window.firebaseBridge.updateBillInCloud = async (id, bill) => {
      await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'bills', String(id)), { ...bill, timestamp: Date.now() });
    };
    window.firebaseBridge.addProductToCloud = async (prod) => {
      const list = window.firebaseBridge.products;
      const cleanName = prod.name.trim().toLowerCase().replace(/\s+/g, ' ');
      const isDuplicate = list.some(p => p && p.name && p.name.trim().toLowerCase().replace(/\s+/g, ' ') === cleanName);
      if (isDuplicate) return;
      return await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'products'), { name: prod.name, timestamp: Date.now() });
    };
    window.firebaseBridge.deleteProductFromCloud = async (id) => await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', id));
    startSetup();
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [currentTab, setCurrentTab] = useState("bill");
      const [customerName, setCustomerName] = useState("");
      const [customerCity, setCustomerCity] = useState("");
      const [billDate, setBillDate] = useState(new Date().toISOString().split('T')[0]);
      const [discountX, setDiscountX] = useState("0"); 
      const [qty, setQty] = useState("1");
      const [productSearch, setProductSearch] = useState("");
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [code, setCode] = useState("");
      const [price, setPrice] = useState("");
      const [less, setLess] = useState("");
      const [addedItems, setAddedItems] = useState([]);
      const [baggedItems, setBaggedItems] = useState([]);
      const [dbCustomers, setDbCustomers] = useState([]);
      const [cloudProducts, setCloudProducts] = useState([]);
      const [cloudBills, setCloudBills] = useState([]);
      const [showCustSuggestions, setShowCustSuggestions] = useState(false);
      const [showProdSuggestions, setShowProdSuggestions] = useState(false);
      const [editingBillId, setEditingBillId] = useState(null);
      const [isBillGenerated, setIsBillGenerated] = useState(false);
      const [generatedItems, setGeneratedItems] = useState([]);
      const [notification, setNotification] = useState("");
      const [parserInput, setParserInput] = useState("");
      const [lastProductName, setLastProductName] = useState("");
      const [showManualInputs, setShowManualInputs] = useState(false);
      const [showPreview, setShowPreview] = useState(false);
      const [saveStatus, setSaveStatus] = useState(0);
      const [newProdName, setNewProdNameState] = useState("");
      const [productFilterQuery, setProductFilterQuery] = useState("");
      const [showFastDraftConfirmModal, setShowFastDraftConfirmModal] = useState(false);
      const [bleDevice, setBleDevice] = useState(null);
      const [bleCharacteristic, setBleCharacteristic] = useState(null);
      const [bleStatus, setBleStatus] = useState("Disconnected");

      // Group selection/less features inside bag
      const [globalBagLess, setGlobalBagLess] = useState("");

      // Embedded collapsible previews for historic log rows
      const [visibleLogPreviews, setVisibleLogPreviews] = useState({});

      // Catalog merging fields
      const [selectedCatalogProduct, setSelectedCatalogProduct] = useState(null);
      const [mergeTargetSearch, setMergeTargetSearch] = useState("");
      const [showMergeSuggestions, setShowMergeTargetSuggestions] = useState(false);

      const custRef = useRef(null);
      const prodRef = useRef(null);
      const parserRef = useRef(null);

      useEffect(() => {
        const interval = setInterval(() => {
          if (window.firebaseBridge) {
            setCloudProducts(window.firebaseBridge.products || []);
            setCloudBills(window.firebaseBridge.bills || []);
            setDbCustomers(window.firebaseBridge.customers || []);
          }
          if (bleDevice && !bleCharacteristic) {
            reconnectBLEPrinterQuietly();
          }
        }, 1000);
        return () => clearInterval(interval);
      }, [bleDevice, bleCharacteristic]);

      useEffect(() => {
        if (currentTab === "bill" && custRef.current) {
          const input = custRef.current.querySelector('input');
          if (input) input.focus();
        }
      }, [currentTab]);

      const triggerNotification = (msg) => {
        setNotification(msg);
        setTimeout(() => setNotification(""), 3500);
      };

      const getThreeLetterCode = (val) => {
        if (!val) return "GEN";
        const cleaned = val.replace(/[^a-zA-Z]/g, "").toUpperCase();
        return cleaned.slice(0, 3) || "GEN";
      };

      const getNormalizedKey = (str) => str ? str.toLowerCase().trim().replace(/\s+/g, ' ') : "";
      const toTitleCase = (str) => str.replace(/\w\S*/g, (txt) => txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase());

      const formatInvoiceDateTime = (dateStr) => {
        const baseDate = dateStr ? new Date(dateStr) : new Date();
        const currentRealTime = new Date();
        baseDate.setHours(currentRealTime.getHours(), currentRealTime.getMinutes());
        const day = String(baseDate.getDate()).padStart(2, '0');
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        return `${day},${months[baseDate.getMonth()]} ${String(baseDate.getHours()).padStart(2, '0')}:${String(baseDate.getMinutes()).padStart(2, '0')}`;
      };

      const handleCustomerSearchAndSelect = async (nameVal) => {
        setCustomerName(nameVal);
        setShowCustSuggestions(false);
        const match = dbCustomers.find(c => c && c.name && c.name.toLowerCase().trim() === nameVal.toLowerCase().trim());
        if (match) {
          setCustomerCity(match.city || "");
          setDiscountX(String(match.discount || 0));
        } else {
          const { db, appId, doc, getDoc } = window.firebaseBridge;
          if (db) {
            try {
              const docSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'customers', nameVal.trim()));
              if (docSnap.exists()) {
                const data = docSnap.data();
                setDiscountX(String(data.discount || 0));
                setCustomerCity(data.city || "");
              }
            } catch (err) { console.warn(err); }
          }
        }
      };

      const handleResetAll = () => {
        setCustomerName(""); setCustomerCity(""); setDiscountX("0");
        setQty("1"); setProductSearch(""); setSelectedProduct(null); setCode(""); setPrice(""); setLess("");
        setAddedItems([]); setBaggedItems([]); setGeneratedItems([]); setIsBillGenerated(false); setEditingBillId(null);
        setParserInput("");
        setSaveStatus(0);
        setGlobalBagLess("");
        setTimeout(() => {
          if (custRef.current) {
            const input = custRef.current.querySelector('input');
            if (input) input.focus();
          }
        }, 100);
      };

      const handleLoadHistoricalBill = (historicalBillObj) => {
        setCustomerName(historicalBillObj.customerName || "");
        setCustomerCity(historicalBillObj.customerCity || "");
        setDiscountX(String(historicalBillObj.discountRate || 0));
        setBillDate(historicalBillObj.date || new Date().toISOString().split('T')[0]);
        setBaggedItems(historicalBillObj.items || []);
        setEditingBillId(String(historicalBillObj.id) || null);
        setCurrentTab("bag");
        triggerNotification("Loaded historical bill!");
      };

      const syncSheetsCustomersToFirestore = async () => {
        triggerNotification("Syncing Sheets Customers...");
        try {
          const res = await fetch("https://script.google.com/macros/s/AKfycbzHDEi_3-0oaLvlPqM3tJdDcMLCdOvr3DNRdl-DDOcAJu_oCJrLCrukhRycnN6nBcwY/exec?action=getCustomers");
          const list = await res.json();
          if (Array.isArray(list)) {
            const { db, appId, doc, setDoc } = window.firebaseBridge;
            if (db) {
              for (const c of list) {
                if (c && c.name) {
                  const cleanName = c.name.trim();
                  await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'customers', cleanName), {
                    name: cleanName,
                    city: c.city || "Local",
                    discount: parseFloat(c.discount) || 0,
                    timestamp: Date.now()
                  });
                }
              }
              triggerNotification("✓ Customer Sync Complete!");
            }
          }
        } catch (e) {
          console.warn("Sheet retrieve bypass:", e.message);
          triggerNotification("Sync Complete locally");
        }
      };

      const calculateRateForToken = (codeStr, rawX) => {
        const cleanCode = codeStr.toLowerCase().trim();
        const discountRate = parseFloat(rawX) || 0;
        if (cleanCode.endsWith('n')) {
          const val = parseFloat(cleanCode.slice(0, -1));
          return !isNaN(val) ? val * 5 : 0;
        }
        if (cleanCode.endsWith('no') || cleanCode.endsWith('nu')) {
          const val = parseFloat(cleanCode.replace(/(no|nu)$/, ''));
          if (!isNaN(val)) {
            const baseMultiplierPrice = val * 5;
            return baseMultiplierPrice - (baseMultiplierPrice * (discountRate / 100));
          }
          return 0;
        }
        return !isNaN(parseFloat(cleanCode)) ? parseFloat(cleanCode) : 0;
      };

      const handleParserSubmit = async (e) => {
        e.preventDefault();
        const rawInput = parserInput.trim();
        if (!rawInput) return;
        const match = rawInput.match(/^(\d+(?:\.\d+)?)\s+(.+)$/);
        if (!match) {
          triggerNotification("Format: Qty Item [Code] (e.g. 5 sehra 20n)");
          return;
        }
        const parsedQty = parseFloat(match[1]);
        const tokens = match[2].trim().split(/\s+/);
        if (tokens.length === 0) return;

        let codeValue = "—";
        let unitPrice = 0;
        let finalTokens = [...tokens];
        const lastToken = tokens[tokens.length - 1];
        const isSuffixCode = (str) => {
          const s = str.toLowerCase().trim();
          return s.endsWith('n') || s.endsWith('no') || s.endsWith('nu');
        };

        if (isSuffixCode(lastToken)) {
          codeValue = lastToken;
          unitPrice = calculateRateForToken(codeValue, discountX);
          finalTokens.pop();
        } else if (!isNaN(parseFloat(lastToken)) && isFinite(lastToken)) {
          codeValue = "—";
          unitPrice = parseFloat(lastToken);
          finalTokens.pop();
        }

        let rawProdName = finalTokens.join(" ").trim();
        if (!rawProdName) {
          rawProdName = lastProductName ? lastProductName : "Item";
        } else {
          setLastProductName(rawProdName);
        }

        const displayCasing = toTitleCase(rawProdName);
        const itemObj = {
          id: Date.now() + Math.random(), qty: parsedQty, name: displayCasing, code: codeValue,
          basePrice: unitPrice, less: "—", finalUnitPrice: unitPrice, totalAmount: parsedQty * unitPrice
        };
        setAddedItems(prev => [itemObj, ...prev]);
        setParserInput(""); setSaveStatus(0);
        if (parserRef.current) parserRef.current.focus();
        triggerNotification("Staged!");
      };

      const handleEditStagedItem = (id, field, value) => {
        setAddedItems(prev => prev.map(item => {
          if (item.id === id) {
            const updated = { ...item };
            if (field === 'qty') updated.qty = parseFloat(value) || 0;
            if (field === 'name') updated.name = value;
            if (field === 'code') updated.code = value;
            if (field === 'basePrice') updated.basePrice = parseFloat(value) || 0;
            if (updated.code !== "—" && updated.code !== "") updated.basePrice = calculateRateForToken(updated.code, discountX);
            updated.finalUnitPrice = updated.basePrice;
            updated.totalAmount = updated.qty * updated.finalUnitPrice;
            return updated;
          }
          return item;
        }));
      };

      const handleTalliedCheck = (stagedItem) => {
        setAddedItems(prev => prev.filter(i => i.id !== stagedItem.id));
        setBaggedItems(prev => [...prev, { ...stagedItem }]);
        setSaveStatus(0);
        triggerNotification("Tallied!");
      };

      const handleEditBaggedItem = (id, field, value) => {
        setBaggedItems(prev => prev.map(item => {
          if (item.id === id) {
            const updated = { ...item };
            if (field === 'qty') updated.qty = parseFloat(value) || 0;
            if (field === 'name') updated.name = value;
            if (field === 'code') updated.code = value;
            if (field === 'basePrice') updated.basePrice = parseFloat(value) || 0;
            if (field === 'less') updated.less = value;

            if (updated.code !== "—" && updated.code !== "") updated.basePrice = calculateRateForToken(updated.code, discountX);

            let deduction = 0;
            const cleanLess = String(updated.less).trim();
            if (cleanLess !== "" && cleanLess !== "—") {
              deduction = parseFloat(cleanLess) || 0;
            }

            updated.finalUnitPrice = Math.max(0, updated.basePrice - deduction);
            updated.totalAmount = updated.qty * updated.finalUnitPrice;
            return updated;
          }
          return item;
        }));
      };

      // Bulk Discount applicator for all items inside tally bag
      const applyGlobalBagLessDiscount = (lessAmountStr) => {
        const amt = parseFloat(lessAmountStr) || 0;
        setBaggedItems(prev => prev.map(item => {
          const updated = { ...item, less: lessAmountStr };
          updated.finalUnitPrice = Math.max(0, updated.basePrice - amt);
          updated.totalAmount = updated.qty * updated.finalUnitPrice;
          return updated;
        }));
        triggerNotification(`Applied flat ₹${amt} discount to all items!`);
      };

      const renderReceiptForSpool = (itemsList, custName, cityVal, dateTimeStr) => {
        const sortedItems = [...itemsList].sort((a,b) => a.name.localeCompare(b.name));
        const total = itemsList.reduce((acc, i) => acc + i.totalAmount, 0);
        
        let receiptHTML = `
          <div class="text-center pb-4 mb-4 border-b-8 border-black">
            <h2 class="text-[52px] font-black uppercase tracking-widest leading-none">ESTIMATE RECEIPT</h2>
            <p class="text-[28px] font-black mt-1">Rough Statement Profile</p>
            <div class="mt-3.5 text-center text-[32px] font-black border-y-4 border-dashed border-black py-2.5">
              ${getThreeLetterCode(custName)} (${getThreeLetterCode(cityVal)}) - ${dateTimeStr}
            </div>
          </div>
          <table class="w-full text-left mt-4 border-collapse text-[38px] font-black">
            <thead>
              <tr class="border-b-8 border-black text-[30px] font-black uppercase">
                <th class="py-3.5 w-20 text-center">QT</th>
                <th class="py-3.5 pl-1">ITEM</th>
                <th class="py-3.5 text-right w-40">P</th>
                <th class="py-3.5 text-right w-48">AMT</th>
              </tr>
            </thead>
            <tbody>
        `;

        sortedItems.forEach((item, index) => {
          receiptHTML += `
            <tr class="align-top border-b-2 border-stone-250 py-7">
              <td class="py-4 text-center font-mono font-black text-[38px]">${Math.round(item.qty)}</td>
              <td class="py-4 font-black uppercase whitespace-pre-wrap break-all pl-1 leading-tight text-[38px]">
                <div class="font-black leading-tight">${item.name.trim().toUpperCase()}</div>
                ${item.code && item.code !== "—" ? `
                  <div class="text-[26px] text-stone-600 font-mono mt-0.5 font-medium tracking-wide leading-none">
                    ${item.code.toUpperCase()}
                  </div>
                ` : ""}
              </td>
              <td class="py-4 text-right font-mono font-black text-[38px]">${Math.round(item.finalUnitPrice)}</td>
              <td class="py-4 text-right font-mono font-black text-[38px]">${Math.round(item.totalAmount)}</td>
            </tr>
          `;

          if ((index + 1) % 5 === 0 && index !== sortedItems.length - 1) {
            receiptHTML += `
              <tr>
                <td colspan="4" class="py-2 border-b-4 border-dashed border-black"></td>
              </tr>
            `;
          }
        });

        receiptHTML += `
            </tbody>
          </table>
          <div class="mt-10 pt-5 border-t-8 border-dashed border-black text-right space-y-3 text-[38px] font-black">
            <div class="flex justify-between font-black">
              <span>Gross Liability:</span>
              <span>${Math.round(total)}</span>
            </div>
            <div class="flex justify-between text-[48px] font-black border-t-8 border-black pt-4 mt-1">
              <span>Net Total:</span>
              <span>${Math.round(total)}</span>
            </div>
          </div>
          <div class="mt-16 text-center text-[38px] font-black pt-6 border-t-4 border-black">
            Thank You For Your Visit<br/>
            Please Visit Again
          </div>
        `;

        return receiptHTML;
      };

      // FIXED: Dispatches synchronised target save flags preventing duplication edits
      const handleGenerateAndPrintBill = async () => {
        if (baggedItems.length === 0) return;
        
        // Use active editing ID synchronously if present
        const synchronousIsEdit = !!editingBillId;
        const uniqueNumericId = editingBillId ? Number(editingBillId) : Date.now();
        
        if (!editingBillId) {
          setEditingBillId(String(uniqueNumericId));
        }

        setGeneratedItems(baggedItems);
        setIsBillGenerated(true);
        const printDateFormatted = formatInvoiceDateTime(billDate);

        if (!bleCharacteristic || bleStatus !== "Connected to Seznik") {
          triggerNotification("Warning: Bluetooth printer is not connected. Printing A4/System invoice only.");
        }

        const printBody = document.getElementById("printable-bill-invoice");
        if (printBody) {
          const finalClientName = customerName.trim() || "Walk-In Customer";
          printBody.innerHTML = renderReceiptForSpool(baggedItems, finalClientName, customerCity, printDateFormatted);
        }
        
        window.print();
        setSaveStatus(1);

        const finalClientName = customerName.trim() || "Walk-In Customer";
        const computedTotalSum = baggedItems.reduce((acc, i) => acc + i.totalAmount, 0);

        const billDataObject = {
          id: uniqueNumericId, customerName: finalClientName, customerCity: customerCity || "Local",
          date: billDate, items: baggedItems, totalAmount: computedTotalSum, discountRate: parseFloat(discountX) || 0,
          timestamp: uniqueNumericId, syncStatusFirestore: false, syncStatusSheets: false, formattedDateTime: printDateFormatted
        };

        let sheetsSucceeded = false;
        if (finalClientName !== "Walk-In Customer") {
          try {
            // FIXED: we pass explicit synchronous edit-intent flags to Google Sheets to override rows properly
            await saveTransactionToGoogleSheet(uniqueNumericId, finalClientName, computedTotalSum, synchronousIsEdit);
            sheetsSucceeded = true;
            billDataObject.syncStatusSheets = true;
          } catch (err) { console.warn("Sheet save bypass triggered."); }
        } else {
          sheetsSucceeded = true;
          billDataObject.syncStatusSheets = true;
        }

        const { db, saveBillToCloudWithNumericId } = window.firebaseBridge;
        if (db && window.firebaseBridge.connected) {
          try {
            await saveBillToCloudWithNumericId(uniqueNumericId, billDataObject);
            billDataObject.syncStatusFirestore = true;
            setSaveStatus(sheetsSucceeded ? 3 : 2);
          } catch (e) { setSaveStatus(-1); }
        } else { setSaveStatus(-1); }

        if (bleCharacteristic) {
          try {
            await printBLEThermalDirectly(baggedItems, finalClientName, customerCity, printDateFormatted);
          } catch (e) { console.warn("BLE print dispatch bypassed.", e); }
        }

        setTimeout(() => {
          handleResetAll();
        }, 500);
      };

      const saveTransactionToGoogleSheet = async (numericId, clientName, amountValue, explicitIsEdit) => {
        // Synchronously evaluate target edit operation to eliminate duplications inside Google Sheets (Rule 1)
        const targetAction = explicitIsEdit ? "updateTxn" : "addTxn";
        const scriptEndpoint = "https://script.google.com/macros/s/AKfycbzHDEi_3-0oaLvlPqM3tJdDcMLCdOvr3DNRdl-DDOcAJu_oCJrLCrukhRycnN6nBcwY/exec";
        await fetch(scriptEndpoint, {
          method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({
            action: targetAction,
            txn: { id: numericId, name: clientName, amount: Math.round(amountValue), date: billDate, type: "bill" },
            customer: { name: clientName, joined: billDate, city: customerCity || "Local" }
          })
        });
      };

      // FIXED: Sharing PDF Receipt with native browser share integration
      const sharePDFReceipt = (items, custName, cityVal, activeDate) => {
        const element = document.getElementById("printable-bill-invoice");
        if (!element) return;
        const printDateFormatted = formatInvoiceDateTime(activeDate);
        element.innerHTML = renderReceiptForSpool(items, custName, cityVal, printDateFormatted);
        
        const fileName = `Invoice_${getThreeLetterCode(custName)}_${activeDate}.pdf`;
        const options = {
          margin: [4, 4, 4, 4],
          filename: fileName,
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2 },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        triggerNotification("Generating PDF shareable receipt...");
        
        html2pdf().set(options).from(element).toPdf().output('blob').then(async (blob) => {
          const file = new File([blob], fileName, { type: 'application/pdf' });
          
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
              await navigator.share({
                files: [file],
                title: `Rough Bill - ${custName}`,
                text: `PDF Receipt for ${custName} (${cityVal})`
              });
              triggerNotification("✓ Shared successfully!");
              return;
            } catch (shareErr) {
              console.warn("Share failed, falling back to direct download:", shareErr);
            }
          }
          
          const link = document.createElement("a");
          link.href = URL.createObjectURL(blob);
          link.download = fileName;
          link.click();
          triggerNotification("✓ PDF downloaded!");
        }).catch(err => {
          console.error("PDF generation fail:", err);
          triggerNotification("✗ PDF compile error");
        });
      };

      const connectBluetoothPrinter = async () => {
        if (!navigator.bluetooth) {
          triggerNotification("Web BLE is unsupported on this browser.");
          return;
        }
        setBleStatus("Scanning...");
        try {
          const device = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: ["000018f0-0000-1000-8000-00805f9b34fb", "0000e7e1-0000-1000-8000-00805f9b34fb"]
          });
          setBleStatus("Connecting...");
          const server = await device.gatt.connect();
          let service;
          try {
            service = await server.getPrimaryService("000018f0-0000-1000-8000-00805f9b34fb");
          } catch(e) {
            service = await server.getPrimaryService("0000e7e1-0000-1000-8000-00805f9b34fb");
          }
          const characteristics = await service.getCharacteristics();
          const writer = characteristics.find(c => c.properties.write || c.properties.writeWithoutResponse);
          setBleDevice(device);
          setBleCharacteristic(writer);
          setBleStatus("Connected to Seznik");
          triggerNotification("BLE Printer Connected!");
        } catch (err) {
          setBleStatus("Disconnected");
          triggerNotification("BLE connection failed.");
        }
      };

        const trimmed = parserInput.trim();
        if (!trimmed) return "";
        const match = trimmed.match(/^(\d+(?:\.\d+)?)\s+(.*)$/);
        if (match) {
          const rest = match[2].trim();
          const tokens = rest.split(/\s+/);
          if (tokens.length > 0) {
            const lastToken = tokens[tokens.length - 1];
            if (lastToken.toLowerCase().endsWith('n') || lastToken.toLowerCase().endsWith('no') || lastToken.toLowerCase().endsWith('nu') || (!isNaN(parseFloat(lastToken)) && isFinite(lastToken))) {
              tokens.pop();
            }
          }
          return tokens.join(" ");
        }
        if (isNaN(parseFloat(trimmed.split(/\s+/)[0]))) return trimmed;
        return "";

      const printBLEThermalDirectly = async (itemsList, custName, cityVal, activeDate) => {

        const encoder = new TextEncoder();
        let esc = [];

        esc.push(0x1B, 0x40); // Init
        esc.push(0x1B, 0x61, 0x01); // Center
        esc.push(...encoder.encode("ESTIMATE RECEIPT\n"));
        esc.push(...encoder.encode(`${custName.toUpperCase()} - ${activeDate}\n`));
        esc.push(...encoder.encode("--------------------------------\n"));
        
        esc.push(0x1B, 0x61, 0x00); // Left align
        const sortedItems = [...itemsList].sort((a,b) => a.name.localeCompare(b.name));
        sortedItems.forEach(item => {
          const nameStr = item.name.trim().toUpperCase().slice(0, 15);

          const pStr = String(Math.round(item.finalUnitPrice)).padStart(4);
          const totalStr = String(Math.round(item.totalAmount)).padStart(6);
          esc.push(...encoder.encode(`${qStr} ${nameStr.padEnd(15)} ${pStr} ${totalStr}\n`));
        });

        esc.push(...encoder.encode("--------------------------------\n"));
        const sumTotal = Math.round(itemsList.reduce((acc, i) => acc + i.totalAmount, 0));
        esc.push(...encoder.encode(`TOTAL LIABILITY:         ${sumTotal}\n\n\n`));
        esc.push(0x1D, 0x56, 0x42, 0x00); // Cut

        const bytes = new Uint8Array(esc);
        for (let i = 0; i < bytes.length; i += 20) {
          await bleCharacteristic.writeValue(bytes.slice(i, i + 20));
        }
      };

                              autocomplete="new-password"
                              value={Math.round(item.basePrice)} 
                              onChange={e => handleEditBaggedItem(item.id, 'basePrice', e.target.value)} 
                              className="col-span-3 text-center border h-8 bg-white rounded-md font-bold focus:outline-none focus:border-stone-500"
                            />
                            <input 
                              type="text" 
                              name={`random_bagless_${item.id}`}
                              autocomplete="new-password"
                              placeholder="Less" 
                              value={item.less === "—" ? "" : item.less} 
                              onChange={e => handleEditBaggedItem(item.id, 'less', e.target.value)} 
                              className="col-span-3 text-center border h-8 bg-white rounded-md font-bold text-rose-700 focus:outline-none focus:border-stone-500"
                            />
                            <div className="col-span-3 text-right font-black flex items-center justify-end text-xs">₹{Math.round(item.totalAmount)}</div>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                  {baggedItems.length > 0 && (
                    <div className="bg-white p-3 border rounded-xl flex justify-between text-xs font-bold shadow-xs">
                      <span>Grand Liability Summary:</span>
                      <span className="font-mono text-sm text-amber-600 font-black">₹{Math.round(baggedItems.reduce((acc,i) => acc + i.totalAmount, 0))}</span>
                    </div>
                  )}

                  {/* Collapsible Bill Preview Accordion (+ Sign for Toggle) */}
                  {baggedItems.length > 0 && (
                    <div className="space-y-1.5 no-print">
                      <button 
                        type="button" 
                        onClick={() => setShowPreview(!showPreview)} 
                        className="w-full bg-stone-200 hover:bg-stone-300 p-2.5 rounded-lg border border-stone-350 flex justify-between items-center text-xs font-black text-stone-700"
                      >
                        <span><i className="fa-solid fa-receipt mr-1.5"></i> Collapsible Receipt Preview</span>
                        <span className="text-xs font-bold">{showPreview ? '- Close Preview' : '+ Preview Bill'}</span>
                      </button>

                      {showPreview && (
                        <div className="bg-white border border-stone-300 p-4 rounded-xl shadow-inner max-w-sm mx-auto font-mono text-xs text-black">
                          <div className="text-center pb-2 mb-2 border-b border-dashed border-black">
                            <h2 className="text-sm font-bold uppercase leading-none">ESTIMATE RECEIPT</h2>
                            <p className="text-[9px]">Rough Statement Profile</p>
                            <p className="text-[10px] font-bold mt-1">{formatInvoiceDateTime(billDate)}</p>
                            <p className="text-[10px] font-bold mt-1">{getThreeLetterCode(customerName)} ({getThreeLetterCode(customerCity)})</p>
                          </div>
                          
                          <table className="w-full text-left text-[10px]">
                            <thead>
                              <tr class="border-b border-black">
                                <th className="w-6 text-center">QT</th>
                                <th>ITEM</th>
                                <th className="text-right w-10">P</th>
                                <th className="text-right w-12">AMT</th>
                              </tr>
                            </thead>
                            <tbody>
                              {[...baggedItems].sort((a,b) => a.name.localeCompare(b.name)).map((item, idx) => (
                                <tr key={idx} className="align-top border-b border-stone-100">
                                  <td className="text-center font-bold">{Math.round(item.qty)}</td>
                                  <td className="uppercase font-bold">
                                    {item.name}
                                    {item.code !== "—" && <span className="block text-[8px] text-stone-500 font-mono"> {item.code.toUpperCase()}</span>}
                                  </td>
                                  <td className="text-right">{Math.round(item.finalUnitPrice)}</td>
                                  <td className="text-right font-bold">{Math.round(item.totalAmount)}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>

                          <div className="mt-3 pt-2 border-t border-dashed border-black text-right text-[11px] font-bold">
                            Total Due: {Math.round(baggedItems.reduce((acc, i) => acc + i.totalAmount, 0))}
                          </div>
                          <div className="mt-4 text-center text-[10px] font-bold border-t pt-2 border-dashed border-black">
                            Thank You For Your Visit<br/>Please Visit Again
                          </div>
                        </div>
                      )}
                    </div>
                  )}

                </div>
                {baggedItems.length > 0 && (
                  <div className="space-y-1">
                    <button type="button" onClick={handleGenerateAndPrintBill} className="w-full py-3.5 bg-stone-900 text-white rounded-xl text-xs uppercase tracking-wider font-extrabold flex justify-center items-center gap-1.5 h-12 shadow-sm">
                      <i className="fa-solid fa-print"></i> {saveStatus === 1 ? "Saving...": "Print Bill"}
                    </button>
                    {isBillGenerated && <button type="button" onClick={() => sharePDFReceipt(baggedItems, customerName, customerCity, billDate)} className="w-full py-2 bg-emerald-600 text-white rounded-lg text-xs font-bold uppercase tracking-wider flex justify-center items-center gap-1 h-9"><i className="fa-solid fa-share-nodes"></i> Share Receipt</button>}
                  </div>
                )}
              </div>
            )}

            {/* Tab 3: Catalog Management */}
            {currentTab === "products" && (
              <div className="flex-grow p-2.5 bg-stone-50 overflow-y-auto custom-scroll space-y-2">
                <form onSubmit={handleProductAddSubmit} className="bg-white p-2.5 border rounded-xl space-y-1.5 flex-shrink-0 shadow-xs">
                  <input 
                    type="text" 
                    name={`random_newprod_${Math.random()}`}
                    autocomplete="new-password"
                    required 
                    placeholder="Product Identification Name..." 
                    value={newProdName} 
                    onChange={e => setNewProdNameState(e.target.value)} 
                    className="w-full px-3 h-10 text-xs border rounded-lg font-bold focus:outline-none"
                  />
                  <button type="submit" className="w-full py-2 h-10 bg-stone-900 text-white text-xs font-bold rounded-lg transition-colors">Add Product Entry</button>
                </form>

                {/* Search-Based Product Merging Sub-Console */}
                {selectedCatalogProduct && (
                  <div className="bg-amber-50 p-3 rounded-xl border border-amber-200 space-y-2 animate-slide-up text-xs shadow-xs">
                    <div className="flex justify-between items-center">
                      <span className="font-extrabold text-amber-900">Merge Product: <span className="uppercase text-stone-900">{selectedCatalogProduct.name}</span></span>
                      <button type="button" onClick={() => { setSelectedCatalogProduct(null); setMergeTargetSearch(""); }} className="text-[10px] text-stone-500 underline font-bold">Cancel</button>
                    </div>
                    <p className="text-[10px] text-amber-800 leading-tight font-medium">All staged & bagged instances of this product will be renamed to the correct target product below.</p>
                    <div className="relative">
                      <input 
                        type="text"
                        autocomplete="new-password"
                        placeholder="Search target product name..."
                        value={mergeTargetSearch}
                        onChange={(e) => { setMergeTargetSearch(e.target.value); setShowMergeTargetSuggestions(true); }}
                        onFocus={() => setShowMergeTargetSuggestions(true)}
                        className="w-full px-2.5 py-2 bg-white border border-amber-300 rounded-lg font-bold text-stone-800 focus:outline-none"
                      />
                      {showMergeSuggestions && mergeTargetSearch.trim() !== "" && (
                        <div className="absolute top-full left-0 right-0 max-h-36 overflow-y-auto bg-white border border-stone-200 rounded-lg shadow-lg z-50 divide-y divide-stone-100 mt-1">
                          {cloudProducts
                            .filter(p => p.id !== selectedCatalogProduct.id && p.name.toLowerCase().includes(mergeTargetSearch.toLowerCase()))
                            .slice(0, 5)
                            .map(p => (
                              <div 
                                key={p.id}
                                onMouseDown={() => {
                                  setMergeTargetSearch(p.name);
                                  setShowMergeTargetSuggestions(false);
                                }}
                                className="px-2.5 py-1.5 hover:bg-stone-100 cursor-pointer font-bold uppercase text-[11px] text-stone-800"
                              >
                                {p.name}
                              </div>
                            ))}
                        </div>
                      )}
                    </div>
                    <button 
                      type="button"
                      onClick={async () => {
                        const target = mergeTargetSearch.trim();
                        if (!target) {
                          triggerNotification("Please select/search a target product.");
                          return;
                        }
                        const targetItem = cloudProducts.find(p => getNormalizedKey(p.name) === getNormalizedKey(target));
                        if (!targetItem) {
                          triggerNotification("Target product must exist in catalog directory.");
                          return;
                        }
                        if (targetItem.id === selectedCatalogProduct.id) {
                          triggerNotification("Cannot merge a product into itself.");
                          return;
                        }
                        try {
                          await window.firebaseBridge.addProductToCloud({ name: targetItem.name });
                          await window.firebaseBridge.deleteProductFromCloud(selectedCatalogProduct.id);
                          
                          setAddedItems(prev => prev.map(item => getNormalizedKey(item.name) === getNormalizedKey(selectedCatalogProduct.name) ? { ...item, name: targetItem.name } : item));
                          setBaggedItems(prev => prev.map(item => getNormalizedKey(item.name) === getNormalizedKey(selectedCatalogProduct.name) ? { ...item, name: targetItem.name } : item));
                          
                          setSelectedCatalogProduct(null);
                          setMergeTargetSearch("");
                          triggerNotification(`Merged "${selectedCatalogProduct.name}" into "${targetItem.name}"!`);
                        } catch(e) {
                          console.error(e);
                          triggerNotification("Merge operation failed.");
                        }
                      }}
                      className="w-full py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-lg font-bold text-xs shadow-xs"
                    >
                      Perform Search & Merge
                    </button>
                  </div>
                )}

                {/* Search / Filter bar for products catalog */}
                <div className="bg-white p-2 border rounded-xl space-y-1 shadow-xs">
                  <span className="block text-[8px] font-black text-stone-400 uppercase tracking-wider">Search Catalog Directory</span>
                  <input 
                    type="text" 
                    name={`random_catfilter_${Math.random()}`}
                    autocomplete="new-password"
                    placeholder="Filter products list..." 
                    value={productFilterQuery} 
                    onChange={e => setProductFilterQuery(e.target.value)} 
                    className="w-full px-2.5 py-1.5 text-xs bg-stone-50 border rounded-lg font-semibold focus:outline-none" 
                  />
                </div>

                {/* Alphabetical Product List Rendering */}
                <div className="bg-white p-2 border rounded-xl divide-y max-h-60 overflow-y-auto custom-scroll shadow-xs">
                  {cloudProducts
                    .filter(p => p && p.name && p.name.toLowerCase().includes(productFilterQuery.toLowerCase()))
                    .sort((a, b) => a.name.localeCompare(b.name))
                    .map(p => (
                      <div 
                        key={p.id} 
                        className={`flex justify-between items-center py-1.5 px-2 text-xs font-bold rounded cursor-pointer ${selectedCatalogProduct?.id === p.id ? 'bg-amber-100 text-stone-900' : 'hover:bg-stone-50'}`}
                        onClick={() => setSelectedCatalogProduct(p)}
                      >
                        <span className="uppercase text-stone-800">{p.name}</span>
                        <div className="flex gap-2">
                          <button 
                            type="button" 
                            onClick={(e) => { e.stopPropagation(); setSelectedCatalogProduct(p); }} 
                            className="text-indigo-500 hover:text-indigo-700 font-extrabold uppercase text-[10px]"
                          >
                            Merge
                          </button>
                          <button 
                            type="button" 
                            onClick={(e) => { e.stopPropagation(); handleCatalogDelete(p.id); }} 
                            className="text-stone-300 hover:text-rose-600 transition-colors"
                          >
                            <i className="fa-solid fa-trash-can"></i>
                          </button>
                        </div>
                      </div>
                  ))}
                </div>
              </div>
            )}

            {/* Tab 4: Logs & Historic Audit Ledger */}
            {currentTab === "logs" && (
              <div className="flex-grow p-2.5 bg-stone-50 overflow-y-auto custom-scroll space-y-3 flex flex-col min-h-0">
                <div className="flex-grow overflow-y-auto custom-scroll space-y-2 min-h-0">
                  <div className="flex justify-between items-center border-b pb-1">
                    <span className="text-[10px] font-black uppercase text-stone-400 tracking-wider">Audit Ledger Log Entries</span>
                    <span className="text-[9px] text-stone-400 font-mono">Synced bills: {cloudBills.length}</span>
                  </div>

                  <div className="space-y-1.5">
                    {getSecureLogBills().map(b => (
                      <div key={b.id} className="border bg-white rounded-lg p-2.5 text-xs space-y-1 animate-slide-up shadow-xs">
                        <div className="flex justify-between font-bold">
                          <span className="uppercase text-stone-950 truncate max-w-[200px]">{b.customerName} ({b.customerCity})</span>
                          <span className="font-mono text-stone-800">₹{Math.round(b.totalAmount || 0)}</span>
                        </div>
                        <div className="flex justify-between items-center text-[9px] text-stone-400 font-mono border-t pt-1.5 mt-1">
                          <span>{b.formattedDateTime || b.date}</span>
                          <div className="flex items-center gap-1 flex-wrap">
                            <span className="text-emerald-600 font-sans mr-1">{b.syncStatusSheets && b.syncStatusFirestore ? "✓✓ Logged" : "✓ Saved"}</span>
                            
                            {/* FIXED: Collapsible Receipt Preview (+ Sign Toggle) inside each Historic Log Entry row */}
                            <button 
                              type="button"
                              onClick={() => toggleLogItemPreview(b.id)}
                              className="px-2 py-0.5 bg-amber-100 hover:bg-amber-200 border border-amber-300 rounded text-[9px] font-extrabold text-amber-900"
                            >
                              {visibleLogPreviews[b.id] ? '- Close Preview' : '+ Preview Bill'}
                            </button>

                            <button 
                              type="button" 
                              onClick={() => handleLogsItemPrint(b)} 
                              className="px-1.5 py-0.5 bg-stone-100 hover:bg-stone-200 border rounded text-[9px] uppercase font-bold"
                            >
                              Print
                            </button>
                            <button 
                              type="button" 
                              onClick={() => sharePDFReceipt(b.items, b.customerName, b.customerCity, b.date)} 
                              className="px-1.5 py-0.5 bg-emerald-50 text-emerald-800 hover:bg-emerald-100 border rounded text-[9px] uppercase font-bold"
                            >
                              Share
                            </button>
                            <button 
                              type="button" 
                              onClick={() => handleLoadHistoricalBill(b)} 
                              className="px-1.5 py-0.5 bg-stone-900 text-white rounded text-[9px] uppercase font-bold"
                            >
                              Load
                            </button>
                          </div>
                        </div>

                        {/* Collapsible log preview block rendering nested inside Historic log card */}
                        {visibleLogPreviews[b.id] && (
                          <div className="mt-2.5 p-3.5 bg-stone-50 border border-stone-200 rounded-lg text-left font-mono text-[11px] leading-tight text-stone-850 animate-slide-up shadow-inner">
                            <div className="text-center border-b border-dashed border-stone-400 pb-1.5 mb-1.5">
                              <span className="font-extrabold uppercase">PREVIEW RECEIPT MANIFEST</span>
                              <div className="text-[9px] mt-0.5 text-stone-500">ID: {b.id}</div>
                            </div>
                            <table className="w-full text-left text-[10px]">
                              <thead>
                                <tr className="border-b border-stone-400 text-stone-500">
                                  <th className="w-6 text-center">QT</th>
                                  <th>ITEM</th>
                                  <th className="text-right w-10">P</th>
                                  <th className="text-right w-12">AMT</th>
                                </tr>
                              </thead>
                              <tbody>
                                {(b.items || []).map((item, index) => (
                                  <tr key={index} className="border-b border-stone-200/50">
                                    <td className="text-center font-bold text-stone-900">{Math.round(item.qty)}</td>
                                    <td className="uppercase truncate max-w-[110px] font-sans font-bold">{item.name}</td>
                                    <td className="text-right">{Math.round(item.finalUnitPrice)}</td>
                                    <td className="text-right font-bold text-stone-900">{Math.round(item.totalAmount)}</td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                            <div className="text-right font-black border-t border-dashed border-stone-400 pt-1.5 mt-1.5 text-stone-950">
                              Grand Total: ₹{Math.round(b.totalAmount || 0)}
                            </div>
                          </div>
                        )}

                      </div>
                    ))}
                  </div>

                  {!isVerified && (
                    <div className="pt-2 text-center">
                      <input 
                        type="password" 
                        name={`random_pass_${Math.random()}`}
                        autocomplete="new-password"
                        placeholder="Passcode..." 
                        value={passwordInput}
                        onChange={(e) => {
                          setPasswordInput(e.target.value);
                          if (e.target.value === "ab") setIsVerified(true);
                        }}
                        className="w-28 text-center p-1.5 border rounded-lg text-xs font-mono focus:outline-none focus:border-stone-800 font-bold bg-white"
                      />
                    </div>
                  )}
                </div>
              </div>
            )}

          </main>

          {/* Clean App-Style Tab Navigation Bar: Icon and label sizing amplified */}
          <footer className="bg-stone-900 border-t py-3 px-4 no-print flex-shrink-0 z-40 shadow-lg">
            <div className="max-w-md mx-auto flex justify-around items-center">
              
              <button 
                type="button" 
                onClick={handleFastDraftTabClick} 
                className={`flex flex-col items-center gap-1.5 py-1.5 px-4 rounded-xl transition-all ${currentTab === "bill" ? "text-amber-400 bg-stone-850" : "text-stone-400"}`}
              >
                <i className="fa-solid fa-receipt text-xl"></i>
                <span className="text-[11px] font-bold uppercase tracking-wider">Fast Draft</span>
              </button>

              <button 
                type="button" 
                onClick={() => setCurrentTab("bag")} 
                className={`flex flex-col items-center gap-1.5 py-1.5 px-4 rounded-xl transition-all relative ${currentTab === "bag" ? "text-amber-400 bg-stone-850" : "text-stone-400"}`}
              >
                <i className="fa-solid fa-bag-shopping text-xl"></i>
                <span className="text-[11px] font-bold uppercase tracking-wider">Tally Bag</span>
                {baggedItems.length > 0 && <span className="absolute -top-1 right-2 bg-rose-600 text-white text-[8px] font-black h-4 w-4 rounded-full flex items-center justify-center animate-bounce">{baggedItems.length}</span>}
              </button>

              <button 
                type="button" 
                onClick={() => setCurrentTab("products")} 
                className={`flex flex-col items-center gap-1.5 py-1.5 px-4 rounded-xl transition-all ${currentTab === "products" ? "text-amber-400 bg-stone-850" : "text-stone-400"}`}
              >
                <i className="fa-solid fa-box-open text-xl"></i>
                <span className="text-[11px] font-bold uppercase tracking-wider">Products</span>
              </button>

              <button 
                type="button" 
                onClick={() => setCurrentTab("logs")} 
                className={`flex flex-col items-center gap-1.5 py-1.5 px-4 rounded-xl transition-all ${currentTab === "logs" ? "text-amber-400 bg-stone-850" : "text-stone-400"}`}
              >
                <i className="fa-solid fa-clock-rotate-left text-xl"></i>
                <span className="text-[11px] font-bold uppercase tracking-wider">Historic</span>
              </button>

            </div>
          </footer>

          <div id="printable-bill-invoice"></div>

          {showFastDraftConfirmModal && (
            <div className="absolute inset-0 bg-stone-900/80 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-4 space-y-3 shadow-2xl border">
                <div className="text-stone-900 font-extrabold text-xs flex items-center gap-1 font-sans"><i className="fa-solid fa-circle-question text-amber-500"></i> Fast Draft Selection</div>
                <p className="text-xs text-stone-600 font-semibold leading-relaxed font-sans">Do you want to clear current draft values or add items to old bill?</p>
                <div className="flex flex-col gap-1.5 pt-1 font-sans">
                  <button type="button" onClick={() => { handleResetAll(); setShowFastDraftConfirmModal(false); setCurrentTab("bill"); }} className="w-full py-2 bg-rose-600 text-white rounded text-xs font-extrabold">New Bill (Clear Everything)</button>
                  <button type="button" onClick={() => { setShowFastDraftConfirmModal(false); setCurrentTab("bill"); }} className="w-full py-2 bg-stone-900 text-white rounded text-xs font-extrabold">Add Items to Old Bill</button>
                  <button type="button" onClick={() => setShowFastDraftConfirmModal(false)} className="w-full py-1.5 bg-stone-100 text-stone-800 rounded text-xs font-bold border">Cancel</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
