  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, getDoc, setDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const appId = 'minimalistic-rough-bill-gen';
    const firebaseConfig = {
      apiKey: "AIzaSyC4ha5NdXyCFOYW8QApcWohBo_6BS6wGRk",
      authDomain: "myroughbillapp.firebaseapp.com",
      projectId: "myroughbillapp",
      storageBucket: "myroughbillapp.firebasestorage.app",
      messagingSenderId: "683327665576",
      appId: "1:683327665576:web:ecb33e232260125397199d"
    };

    let app, auth, db;
    try {
      app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
    } catch (e) {
      console.warn("Could not authenticate Firebase nodes.", e);
    }

    window.firebaseBridge = {
      db, auth, appId, connected: false,
      products: [], bills: [], customers: [],
      doc, getDoc, setDoc, collection, addDoc, updateDoc, deleteDoc, getDocs
    };

    async function startSetup() {
      if (!db) return;
      try {
        if (auth) await signInAnonymously(auth);
      } catch (e) { console.warn("Auth process skipped."); }
      window.firebaseBridge.connected = true;

      onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'products'), (snapshot) => {
        const list = [];
        snapshot.forEach(doc => {
          const data = doc.data();
          if (data && data.name) list.push({ id: doc.id, ...data });
        });
        window.firebaseBridge.products = list;
        if (window.firebaseBridge.onProductsChange) window.firebaseBridge.onProductsChange(list);
      }, (error) => console.error("Products subscription error", error));

      onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'bills'), (snapshot) => {
        const list = [];
        snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
        list.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
        window.firebaseBridge.bills = list;
        if (window.firebaseBridge.onBillsChange) window.firebaseBridge.onBillsChange(list);
      }, (error) => console.error("Bills subscription error", error));

      onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'customers'), (snapshot) => {
        const list = [];
        snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
        window.firebaseBridge.customers = list;
        if (window.firebaseBridge.onCustomersChange) window.firebaseBridge.onCustomersChange(list);
      }, (error) => console.error("Customers subscription error", error));
    }
    
    // Updates existing bill in firestore directly instead of creating duplicates
    window.firebaseBridge.saveBillToCloudWithNumericId = async (numericId, bill) => {
      const stringId = String(numericId);
      const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'bills', stringId);
      await setDoc(docRef, { ...bill, id: numericId, timestamp: numericId }, { merge: true });
      return { id: stringId };
    };
    window.firebaseBridge.updateBillInCloud = async (id, bill) => {
      await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'bills', String(id)), { ...bill, timestamp: Date.now() });
    };
    window.firebaseBridge.addProductToCloud = async (prod) => {
      const list = window.firebaseBridge.products;
      const cleanName = prod.name.trim().toLowerCase().replace(/\s+/g, ' ');
      const isDuplicate = list.some(p => p && p.name && p.name.trim().toLowerCase().replace(/\s+/g, ' ') === cleanName);

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Suggestion 1: IndexedDB Setup for local database offline operation
    const openOfflineDB = () => {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open("RoughBillOfflineStore", 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains("bills")) db.createObjectStore("bills", { keyPath: "id" });
          if (!db.objectStoreNames.contains("syncQueue")) db.createObjectStore("syncQueue", { keyPath: "id", autoIncrement: true });
        };
        req.onsuccess = (e) => resolve(e.target.result);
        req.onerror = (e) => reject(e.target.error);
      });
    };

    function App() {
      const [currentTab, setCurrentTab] = useState("bill");
      const [customerName, setCustomerName] = useState("");
      const [customerCity, setCustomerCity] = useState("");
      const [billDate, setBillDate] = useState(new Date().toISOString().split('T')[0]);
      const [discountX, setDiscountX] = useState("0"); 
      const [qty, setQty] = useState("1");
      const [productSearch, setProductSearch] = useState("");
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [code, setCode] = useState("");
      const [price, setPrice] = useState("");
      const [less, setLess] = useState("");
      const [addedItems, setAddedItems] = useState([]);
      const [baggedItems, setBaggedItems] = useState([]);
      const [dbCustomers, setDbCustomers] = useState([]);
      const [cloudProducts, setCloudProducts] = useState([]);
      const [cloudBills, setCloudBills] = useState([]);
      const [showCustSuggestions, setShowCustSuggestions] = useState(false);
      const [showProdSuggestions, setShowProdSuggestions] = useState(false);
      const [editingBillId, setEditingBillId] = useState(null);
      const [isBillGenerated, setIsBillGenerated] = useState(false);
      const [generatedItems, setGeneratedItems] = useState([]);
      const [notification, setNotification] = useState("");
      const [parserInput, setParserInput] = useState("");
      const [lastProductName, setLastProductName] = useState("");
      const [showManualInputs, setShowManualInputs] = useState(false);
      const [showPreview, setShowPreview] = useState(false);
      const [saveStatus, setSaveStatus] = useState(0);
      const [newProdName, setNewProdNameState] = useState("");
      const [productFilterQuery, setProductFilterQuery] = useState("");
      const [showFastDraftConfirmModal, setShowFastDraftConfirmModal] = useState(false);
      const [isVerified, setIsVerified] = useState(false);
      const [passwordInput, setPasswordInput] = useState("");
      const [editingLogBill, setEditingLogBill] = useState(null);
      const [bleDevice, setBleDevice] = useState(null);
      const [bleCharacteristic, setBleCharacteristic] = useState(null);
      const [bleStatus, setBleStatus] = useState("Disconnected");

      // Product Merges
      const [selectedCatalogProduct, setSelectedCatalogProduct] = useState(null);
      const [mergeTargetSearch, setMergeTargetSearch] = useState("");
      const [showMergeSuggestions, setShowMergeTargetSuggestions] = useState(false);

      const custRef = useRef(null);
      const prodRef = useRef(null);
      const parserRef = useRef(null);

      // Trigger automatic sync interval
      useEffect(() => {
        const interval = setInterval(() => {
          if (window.firebaseBridge) {
            setCloudProducts(window.firebaseBridge.products || []);
            setCloudBills(window.firebaseBridge.bills || []);
            setDbCustomers(window.firebaseBridge.customers || []);
          }
          // Suggestion 7: Auto reconnect polling loop
          if (bleDevice && !bleCharacteristic) {
            reconnectBLEPrinterQuietly();
          }
          // Suggestion 1: Trigger offline sync runner
          syncOfflineTaskQueue();
        }, 1000);
        return () => clearInterval(interval);
      }, [bleDevice, bleCharacteristic]);

      useEffect(() => {
        if (currentTab === "bill" && custRef.current) {
          const input = custRef.current.querySelector('input');
          if (input) input.focus();
        }
      }, [currentTab]);

      const triggerNotification = (msg) => {
        setNotification(msg);
        setTimeout(() => setNotification(""), 3500);
      };

      const getThreeLetterCode = (val) => {
        if (!val) return "GEN";
        const cleaned = val.replace(/[^a-zA-Z]/g, "").toUpperCase();
        return cleaned.slice(0, 3) || "GEN";
      };

      const getNormalizedKey = (str) => str ? str.toLowerCase().trim().replace(/\s+/g, ' ') : "";
      const toTitleCase = (str) => str.replace(/\w\S*/g, (txt) => txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase());

      const formatInvoiceDateTime = (dateStr) => {
        const baseDate = dateStr ? new Date(dateStr) : new Date();
        const currentRealTime = new Date();
        baseDate.setHours(currentRealTime.getHours(), currentRealTime.getMinutes());
        const day = String(baseDate.getDate()).padStart(2, '0');
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        return `${day},${months[baseDate.getMonth()]} ${String(baseDate.getHours()).padStart(2, '0')}:${String(baseDate.getMinutes()).padStart(2, '0')}`;
      };

      const handleCustomerSearchAndSelect = async (nameVal) => {
        setCustomerName(nameVal);
        setShowCustSuggestions(false); // Close dropdown immediately (Item 5)
        const match = dbCustomers.find(c => c && c.name && c.name.toLowerCase().trim() === nameVal.toLowerCase().trim());
        if (match) {
          setCustomerCity(match.city || "");
          setDiscountX(String(match.discount || 0));
        } else {
          const { db, appId, doc, getDoc } = window.firebaseBridge;
          if (db) {
            try {
              const docSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'customers', nameVal.trim()));
              if (docSnap.exists()) {
                const data = docSnap.data();
                setDiscountX(String(data.discount || 0));
                setCustomerCity(data.city || "");
              }
            } catch (err) { console.warn(err); }
          }
        }
      };

      const handleResetAll = () => {
        setCustomerName(""); setCustomerCity(""); setDiscountX("0");
        setQty("1"); setProductSearch(""); setSelectedProduct(null); setCode(""); setPrice(""); setLess("");
        setAddedItems([]); setBaggedItems([]); setGeneratedItems([]); setIsBillGenerated(false); setEditingBillId(null);
        setParserInput("");
        setSaveStatus(0);
        setTimeout(() => {
          if (custRef.current) {
            const input = custRef.current.querySelector('input');
            if (input) input.focus();
          }
        }, 100);
      };

      const handleLoadHistoricalBill = (historicalBillObj) => {
        setCustomerName(historicalBillObj.customerName || "");
        setCustomerCity(historicalBillObj.customerCity || "");
        setDiscountX(String(historicalBillObj.discountRate || 0));
        setBillDate(historicalBillObj.date || new Date().toISOString().split('T')[0]);
        setBaggedItems(historicalBillObj.items || []);
        setEditingBillId(String(historicalBillObj.id) || null);
        setCurrentTab("bag");
        triggerNotification("Loaded historical bill!");
      };

      const syncSheetsCustomersToFirestore = async () => {
        triggerNotification("Syncing Sheets Customers...");
        try {
          const res = await fetch("https://script.google.com/macros/s/AKfycbzHDEi_3-0oaLvlPqM3tJdDcMLCdOvr3DNRdl-DDOcAJu_oCJrLCrukhRycnN6nBcwY/exec?action=getCustomers");
          const list = await res.json();
          if (Array.isArray(list)) {
            const { db, appId, doc, setDoc } = window.firebaseBridge;
            if (db) {
              for (const c of list) {
                if (c && c.name) {
                  const cleanName = c.name.trim();
                  await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'customers', cleanName), {
                    name: cleanName,
                    city: c.city || "Local",
                    discount: parseFloat(c.discount) || 0,
                    timestamp: Date.now()
                  });
                }
              }
              triggerNotification("✓ Customer Sync Complete!");
            }
          }
        } catch (e) {
          console.warn("Sheet retrieve bypass:", e.message);
          triggerNotification("Sync Complete locally");
        }
      };

      const clearFirestoreHistoricBills = async () => {
        if (!window.confirm("Are you absolutely sure you want to clear ALL historic bills in Firestore?")) return;
        triggerNotification("Clearing historic bills...");
        const { db, appId, deleteDoc, doc } = window.firebaseBridge;
        if (db) {
          try {
            for (const b of cloudBills) {
              await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'bills', String(b.id)));
            }
            triggerNotification("✓ All Firestore historic bills cleared!");
          } catch (e) {
            console.error(e);
            triggerNotification("Failed to clear bills.");
          }
        }
      };

      // Suggestion 1: Offline syncer task queue processor
      const syncOfflineTaskQueue = async () => {
        if (!navigator.onLine || !window.firebaseBridge?.connected) return;
        try {
          const dbObj = await openOfflineDB();
          const tx = dbObj.transaction("syncQueue", "readonly");
          const store = tx.objectStore("syncQueue");
          const req = store.getAll();
          req.onsuccess = async () => {
            const tasks = req.result;
            if (tasks.length === 0) return;
            for (const task of tasks) {
              // Update/Write transaction
              const { db: fsDb, appId, setDoc, doc: fsDoc } = window.firebaseBridge;
              if (fsDb) {
                await setDoc(fsDoc(fsDb, 'artifacts', appId, 'public', 'data', 'bills', String(task.id)), task.billData, { merge: true });
                if (task.billData.customerName !== "Walk-In Customer") {
                  await saveTransactionToGoogleSheet(task.id, task.billData.customerName, task.billData.totalAmount);
                }
                const delTx = dbObj.transaction("syncQueue", "readwrite");
                delTx.objectStore("syncQueue").delete(task.id);
              }
            }
            triggerNotification("✓ Offline queued sales synchronized!");
          };
        } catch (e) {
          console.warn("Offline syncer skipped:", e);
        }
      };

      // Suggestion 3: Custom SVG Revenue Performance Charts
      const renderSVGPerformanceChart = () => {
        if (cloudBills.length === 0) return <div className="text-[10px] text-stone-400 italic">No sales log history recorded to compile visual charts.</div>;
        
        // Group by month
        const monthlyTotals = {};
        cloudBills.forEach(b => {
          const d = new Date(Number(b.id) || Date.now());
          const monthKey = d.toLocaleString('default', { month: 'short', year: '2-digit' });
          monthlyTotals[monthKey] = (monthlyTotals[monthKey] || 0) + (b.totalAmount || 0);
        });

        const dataPoints = Object.entries(monthlyTotals).map(([label, value]) => ({ label, value })).reverse().slice(-5);
        if (dataPoints.length === 0) return null;

        const maxVal = Math.max(...dataPoints.map(d => d.value), 1);
        const w = 340;
        const h = 130;
        const barWidth = 32;
        const spacing = 18;

        return (
          <div className="bg-stone-850 p-2.5 rounded-lg border border-stone-800 space-y-1.5">
            <span className="block text-[8px] text-stone-400 uppercase font-black tracking-wider">SVG Monthly Performance Run-rate</span>
            <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`} className="bg-stone-950 p-1.5 rounded">
              <line x1="30" y1="15" x2={w - 10} y2="15" stroke="#2c2a29" strokeDasharray="3,3" />
              <line x1="30" y1="50" x2={w - 10} y2="50" stroke="#2c2a29" strokeDasharray="3,3" />
              <line x1="30" y1="90" x2={w - 10} y2="90" stroke="#2c2a29" strokeDasharray="3,3" />
              <line x1="30" y1="110" x2={w - 10} y2="110" stroke="#444" />
              {dataPoints.map((d, i) => {
                const x = 38 + i * (barWidth + spacing);
                const barHeight = (d.value / maxVal) * 85;
                const y = 110 - barHeight;
                return (
                  <g key={i}>
                    <rect x={x} y={y} width={barWidth} height={barHeight} fill="#f59e0b" rx="2" className="transition-all hover:fill-amber-400" />
                    <text x={x + barWidth / 2} y="122" fill="#888" fontSize="8.5" textAnchor="middle">{d.label}</text>
                    <text x={x + barWidth / 2} y={y - 4} fill="#fff" fontSize="8" fontWeight="bold" textAnchor="middle">₹{Math.round(d.value)}</text>
                  </g>
                );
              })}
            </svg>
          </div>
        );
      };

      const computeAbhiMetrics = () => {
        const productStats = {};
        const customerStats = {};
        const now = Date.now();
        const oneWeek = 7 * 24 * 60 * 60 * 1000;
        const oneMonth = 30 * 24 * 60 * 60 * 1000;
        const oneQuarter = 90 * 24 * 60 * 60 * 1000;

        cloudBills.forEach(bill => {
          const billTime = Number(bill.timestamp) || now;
          const custName = bill.customerName || "Walk-In Customer";
          const items = bill.items || [];

          items.forEach(item => {
            const pName = String(item.name).toUpperCase().trim();
            const qty = Number(item.qty) || 0;
            const amt = Number(item.totalAmount) || 0;

            if (!productStats[pName]) {
              productStats[pName] = {
                name: pName, totalQty: 0, totalRevenue: 0,
                weeklyQty: 0, monthlyQty: 0, quarterlyQty: 0,
                history: []
              };
            }
            productStats[pName].totalQty += qty;
            productStats[pName].totalRevenue += amt;
            productStats[pName].history.push({ time: billTime, qty, amt });

            const age = now - billTime;
            if (age <= oneWeek) productStats[pName].weeklyQty += qty;
            if (age <= oneMonth) productStats[pName].monthlyQty += qty;
            if (age <= oneQuarter) productStats[pName].quarterlyQty += qty;

            if (!customerStats[custName]) customerStats[custName] = {};
            if (!customerStats[custName][pName]) {
              customerStats[custName][pName] = { name: pName, totalQty: 0, weeklyQty: 0, monthlyQty: 0, quarterlyQty: 0 };
            }
            customerStats[custName][pName].totalQty += qty;
            if (age <= oneWeek) customerStats[custName][pName].weeklyQty += qty;
            if (age <= oneMonth) customerStats[custName][pName].monthlyQty += qty;
            if (age <= oneQuarter) customerStats[custName][pName].quarterlyQty += qty;
          });
        });

        const productList = Object.values(productStats);
        let maxAmountProduct = null;
        let maxQtyProduct = null;

        productList.forEach(p => {
          if (!maxAmountProduct || p.totalRevenue > maxAmountProduct.totalRevenue) maxAmountProduct = p;
          if (!maxQtyProduct || p.totalQty > maxQtyProduct.totalQty) maxQtyProduct = p;
        });

        const predictions = productList.map(p => {
          const thisWeekQty = p.weeklyQty;
          let prevWeekQty = 0;
          p.history.forEach(h => {
            const age = now - h.time;
            if (age > oneWeek && age <= 2 * oneWeek) prevWeekQty += h.qty;
          });

          let trendFactor = 1.0;
          if (prevWeekQty > 0) trendFactor = Math.max(0.6, Math.min(1.8, thisWeekQty / prevWeekQty));

          return {
            name: p.name,
            nextWeek: Math.round(thisWeekQty * trendFactor) || Math.round(p.totalQty / 12) || 0,
            nextMonth: Math.round(p.monthlyQty * trendFactor) || Math.round(p.totalQty / 3) || 0,
            nextQuarter: Math.round(p.quarterlyQty * trendFactor) || Math.round(p.totalQty) || 0,
            currentRate: p.monthlyQty,
            revenue: p.totalRevenue,
            totalQty: p.totalQty
          };
        }).sort((a,b) => b.nextMonth - a.nextMonth);

        const customerSegmentList = [];
        Object.entries(customerStats).forEach(([cName, prods]) => {
          const items = Object.values(prods);
          let topWeekly = null, topMonthly = null, topQuarterly = null;
          items.forEach(it => {
            if (!topWeekly || it.weeklyQty > topWeekly.weeklyQty) topWeekly = it;
            if (!topMonthly || it.monthlyQty > topMonthly.monthlyQty) topMonthly = it;
            if (!topQuarterly || it.quarterlyQty > topQuarterly.quarterlyQty) topQuarterly = it;
          });
          customerSegmentList.push({
            customer: cName,
            weekly: topWeekly && topWeekly.weeklyQty > 0 ? topWeekly.name : "None",
            monthly: topMonthly && topMonthly.monthlyQty > 0 ? topMonthly.name : "None",
            quarterly: topQuarterly && topQuarterly.quarterlyQty > 0 ? topQuarterly.name : "None"
          });
        });

        const bundlesFreq = {};
        cloudBills.forEach(b => {
          const items = (b.items || []).map(i => String(i.name).toUpperCase().trim());
          for (let i = 0; i < items.length; i++) {
            for (let j = i + 1; j < items.length; j++) {
              const pair = [items[i], items[j]].sort().join(" + ");
              bundlesFreq[pair] = (bundlesFreq[pair] || 0) + 1;
            }
          }
        });
        const bundles = Object.entries(bundlesFreq).map(([pair, count]) => ({ pair, count })).sort((a,b) => b.count - a.count).slice(0, 3);

        const catalogProductsSet = new Set(cloudProducts.map(p => p.name.toUpperCase().trim()));
        const soldProductsSet = new Set(productList.map(p => p.name.toUpperCase().trim()));
        const deadStock = Array.from(catalogProductsSet).filter(p => !soldProductsSet.has(p));

        return { maxAmountProduct, maxQtyProduct, predictions, customerSegmentList, bundles, deadStock };
      };

      const calculateRateForToken = (codeStr, rawX) => {
        const cleanCode = codeStr.toLowerCase().trim();
        const discountRate = parseFloat(rawX) || 0;
        if (cleanCode.endsWith('n')) {
          const val = parseFloat(cleanCode.slice(0, -1));
          return !isNaN(val) ? val * 5 : 0;
        }
        if (cleanCode.endsWith('no') || cleanCode.endsWith('nu')) {
          const val = parseFloat(cleanCode.replace(/(no|nu)$/, ''));
          if (!isNaN(val)) {
            const baseMultiplierPrice = val * 5;
            return baseMultiplierPrice - (baseMultiplierPrice * (discountRate / 100));
          }
          return 0;
        }
        return !isNaN(parseFloat(cleanCode)) ? parseFloat(cleanCode) : 0;
      };

      const handleParserSubmit = async (e) => {
        e.preventDefault();
        const rawInput = parserInput.trim();
        if (!rawInput) return;
        const match = rawInput.match(/^(\d+(?:\.\d+)?)\s+(.+)$/);
        if (!match) {
          triggerNotification("Format: Qty Item [Code] (e.g. 5 sehra 20n)");
          return;
        }
        const parsedQty = parseFloat(match[1]);
        const tokens = match[2].trim().split(/\s+/);
        if (tokens.length === 0) return;

        let codeValue = "—";
        let unitPrice = 0;
        let finalTokens = [...tokens];
        const lastToken = tokens[tokens.length - 1];
        const isSuffixCode = (str) => {
          const s = str.toLowerCase().trim();
          return s.endsWith('n') || s.endsWith('no') || s.endsWith('nu');
        };

        if (isSuffixCode(lastToken)) {
          codeValue = lastToken;
          unitPrice = calculateRateForToken(codeValue, discountX);
          finalTokens.pop();
        } else if (!isNaN(parseFloat(lastToken)) && isFinite(lastToken)) {
          codeValue = "—";
          unitPrice = parseFloat(lastToken);
          finalTokens.pop();
        }

        let rawProdName = finalTokens.join(" ").trim();
        if (!rawProdName) {
          rawProdName = lastProductName ? lastProductName : "Item";

          setLastProductName(rawProdName);

        const displayCasing = toTitleCase(rawProdName);
        const itemObj = {
          id: Date.now() + Math.random(), qty: parsedQty, name: displayCasing, code: codeValue,
          basePrice: unitPrice, less: "—", finalUnitPrice: unitPrice, totalAmount: parsedQty * unitPrice
        };
        setAddedItems(prev => [itemObj, ...prev]);
        setParserInput(""); setSaveStatus(0);
        if (parserRef.current) parserRef.current.focus();
        triggerNotification("Staged!");
      };

      // Item 2: Price has been made fully editable inside staged draft view

            if (field === 'name') updated.name = value;
            if (field === 'code') updated.code = value;
            if (field === 'basePrice') updated.basePrice = parseFloat(value) || 0;
            if (updated.code !== "—" && updated.code !== "") updated.basePrice = calculateRateForToken(updated.code, discountX);
            updated.finalUnitPrice = updated.basePrice;
            updated.totalAmount = updated.qty * updated.finalUnitPrice;
            return updated;
          }
          return item;
        }));
      };

      const handleTalliedCheck = (stagedItem) => {

            if (updated.code !== "—" && updated.code !== "") updated.basePrice = calculateRateForToken(updated.code, discountX);

            // Item 3: Fix discount logic - Flat Rupee subtraction instead of Percentage

      const handleGenerateAndPrintBill = async () => {

        const billDataObject = {

          timestamp: uniqueNumericId, syncStatusFirestore: false, syncStatusSheets: false, formattedDateTime: printDateFormatted
        };

        // Suggestion 1: Write to local DB in-memory instantly first
        try {
          const dbObj = await openOfflineDB();
          const tx = dbObj.transaction("bills", "readwrite");
          tx.objectStore("bills").put(billDataObject);
        } catch (e) { console.warn("Local DB write skipped", e); }

        let sheetsSucceeded = false;
        if (finalClientName !== "Walk-In Customer") {
          try {
            await saveTransactionToGoogleSheet(uniqueNumericId, finalClientName, computedTotalSum);
            sheetsSucceeded = true;
            billDataObject.syncStatusSheets = true;
          } catch (err) { 
            console.warn("Sheet save bypass triggered. Queueing task.");
            // Queue task to IndexedDB syncQueue
            const dbObj = await openOfflineDB();
            const tx = dbObj.transaction("syncQueue", "readwrite");
            tx.objectStore("syncQueue").put({ id: uniqueNumericId, billData: billDataObject });
          }
        } else {
          sheetsSucceeded = true;
          billDataObject.syncStatusSheets = true;
        }

        const { db, saveBillToCloudWithNumericId } = window.firebaseBridge;
        if (db && window.firebaseBridge.connected) {
          try {
            await saveBillToCloudWithNumericId(uniqueNumericId, billDataObject);
            billDataObject.syncStatusFirestore = true;
            setSaveStatus(sheetsSucceeded ? 3 : 2);
          } catch (e) { setSaveStatus(-1); }

        // AUTO-TRIGGER BLE direct printing if paired & active

        await fetch(scriptEndpoint, {
          method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({
            action: targetAction,
            txn: { id: numericId, name: clientName, amount: Math.round(amountValue), date: billDate, type: "bill" },

          printBody.innerHTML = renderReceiptForSpool(logItem.items || [], logItem.customerName, logItem.customerCity, printDateFormatted);

          } catch (e) { console.warn("BLE print logs bypassed.", e); }

      const connectBluetoothPrinter = async () => {
        if (!navigator.bluetooth) {
          triggerNotification("Web BLE is unsupported on this browser.");
          return;
        }
        setBleStatus("Scanning...");
        try {
          const device = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: ["000018f0-0000-1000-8000-00805f9b34fb", "0000e7e1-0000-1000-8000-00805f9b34fb"]
          });
          setBleStatus("Connecting...");
          const server = await device.gatt.connect();
          let service;
          try {
            service = await server.getPrimaryService("000018f0-0000-1000-8000-00805f9b34fb");
          } catch(e) {
            service = await server.getPrimaryService("0000e7e1-0000-1000-8000-00805f9b34fb");
          }
          const characteristics = await service.getCharacteristics();
          const writer = characteristics.find(c => c.properties.write || c.properties.writeWithoutResponse);
          setBleDevice(device);
          setBleCharacteristic(writer);
          setBleStatus("Connected to Seznik");
          triggerNotification("BLE Printer Connected!");

          triggerNotification("BLE connection failed.");

          if (tokens.length > 0) {

            if (lastToken.toLowerCase().endsWith('n') || lastToken.toLowerCase().endsWith('no') || lastToken.toLowerCase().endsWith('nu') || (!isNaN(parseFloat(lastToken)) && isFinite(lastToken))) {

      const printBLEThermalDirectly = async (itemsList, custName, cityVal, activeDate) => {
        if (!bleCharacteristic) return;
        const encoder = new TextEncoder();
        let esc = [];

        esc.push(0x1B, 0x40); // Init
        esc.push(0x1B, 0x61, 0x01); // Center
        esc.push(...encoder.encode("ESTIMATE RECEIPT\n"));
        esc.push(...encoder.encode(`${custName.toUpperCase()} - ${activeDate}\n`));
        esc.push(...encoder.encode("--------------------------------\n"));
        
        esc.push(0x1B, 0x61, 0x00); // Left align
        const sortedItems = [...itemsList].sort((a,b) => a.name.localeCompare(b.name));
        sortedItems.forEach(item => {
          const nameStr = item.name.trim().toUpperCase().slice(0, 15);
          const qStr = String(Math.round(item.qty)).padEnd(3);
          const pStr = String(Math.round(item.finalUnitPrice)).padStart(4);
          const totalStr = String(Math.round(item.totalAmount)).padStart(6);
          esc.push(...encoder.encode(`${qStr} ${nameStr.padEnd(15)} ${pStr} ${totalStr}\n`));
        });

        esc.push(...encoder.encode("--------------------------------\n"));
        const sumTotal = Math.round(itemsList.reduce((acc, i) => acc + i.totalAmount, 0));
        esc.push(...encoder.encode(`TOTAL LIABILITY:         ${sumTotal}\n\n\n`));
        esc.push(0x1D, 0x56, 0x42, 0x00); // Cut

        const bytes = new Uint8Array(esc);
        for (let i = 0; i < bytes.length; i += 20) {
          await bleCharacteristic.writeValue(bytes.slice(i, i + 20));
        }

                          <span>{b.formattedDateTime || b.date}</span>
                          <div className="flex items-center gap-1">
                            <span className="text-emerald-600 font-sans mr-1">{b.syncStatusSheets && b.syncStatusFirestore ? "✓✓ Logged" : "✓ Saved"}</span>
                            <button 
                              type="button" 
                              onClick={() => handleLogsItemPrint(b)} 
                              className="px-1.5 py-0.5 bg-stone-100 hover:bg-stone-200 border rounded text-[9px] uppercase font-bold"
                            >
                              Print
                            </button>
                            <button 
                              type="button" 
                              onClick={() => sharePDFReceipt(b.items, b.customerName, b.customerCity, b.date)} 
                              className="px-1.5 py-0.5 bg-emerald-50 text-emerald-800 hover:bg-emerald-100 border rounded text-[9px] uppercase font-bold"
                            >
                              Share
                            </button>
                            <button 
                              type="button" 
                              onClick={() => handleLoadHistoricalBill(b)} 
                              className="px-1.5 py-0.5 bg-stone-900 text-white rounded text-[9px] uppercase font-bold"
                            >
                              Load
                            </button>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>

                  {/* Clean Password block accepting "ab" as verification passcode */}
                  {!isVerified && (
                    <div className="pt-2 text-center">
                      <input 
                        type="password" 
                        name={`random_pass_${Math.random()}`}
                        autocomplete="new-password"
                        placeholder="Passcode..." 
                        value={passwordInput}
                        onChange={(e) => {
                          setPasswordInput(e.target.value);
                          if (e.target.value === "ab") setIsVerified(true);
                        }}
                        className="w-28 text-center p-1.5 border rounded-lg text-xs font-mono focus:outline-none focus:border-stone-800 font-bold bg-white"
                      />
                    </div>
                  )}
                </div>

              </div>
            )}

          </main>

          {/* Clean App-Style Tab Navigation Bar */}
          <footer className="bg-stone-900 border-t py-2 px-4 no-print flex-shrink-0 z-40 shadow-lg">
            <div className="max-w-md mx-auto flex justify-around items-center">
              <button type="button" onClick={handleFastDraftTabClick} className={`flex flex-col items-center gap-0.5 py-1 px-3 rounded-xl transition-all ${currentTab === "bill" ? "text-amber-400 bg-stone-850" : "text-stone-400"}`}>
                <i className="fa-solid fa-receipt text-sm"></i>
                <span className="text-[8px] font-bold uppercase tracking-wider">Fast Draft</span>
              </button>
              <button type="button" onClick={() => setCurrentTab("bag")} className={`flex flex-col items-center gap-0.5 py-1 px-3 rounded-xl transition-all relative ${currentTab === "bag" ? "text-amber-400 bg-stone-850" : "text-stone-400"}`}>
                <i className="fa-solid fa-bag-shopping text-sm"></i>
                <span className="text-[8px] font-bold uppercase tracking-wider">Tally Bag</span>
                {baggedItems.length > 0 && <span className="absolute -top-1 right-2 bg-rose-600 text-white text-[8px] font-black h-4 w-4 rounded-full flex items-center justify-center animate-bounce">{baggedItems.length}</span>}
              </button>
              <button type="button" onClick={() => setCurrentTab("products")} className={`flex flex-col items-center gap-0.5 py-1 px-3 rounded-xl transition-all ${currentTab === "products" ? "text-amber-400 bg-stone-850" : "text-stone-400"}`}>
                <i className="fa-solid fa-box-open text-sm"></i>
                <span className="text-[8px] font-bold uppercase tracking-wider">Products</span>
              </button>
              <button type="button" onClick={() => setCurrentTab("logs")} className={`flex flex-col items-center gap-0.5 py-1 px-3 rounded-xl transition-all ${currentTab === "logs" ? "text-amber-400 bg-stone-850" : "text-stone-400"}`}>
                <i className="fa-solid fa-clock-rotate-left text-sm"></i>
                <span className="text-[8px] font-bold uppercase tracking-wider">Historic</span>
              </button>
            </div>
          </footer>

          {/* Printable container isolating A4 hardware spooling overrides */}
          <div id="printable-bill-invoice"></div>

          {/* Confirmation Modals */}
          {showFastDraftConfirmModal && (
            <div className="absolute inset-0 bg-stone-900/80 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-4 space-y-3 shadow-2xl border">
                <div className="text-stone-900 font-extrabold text-xs flex items-center gap-1 font-sans"><i className="fa-solid fa-circle-question text-amber-500"></i> Fast Draft Selection</div>
                <p className="text-xs text-stone-600 font-semibold leading-relaxed font-sans">Do you want to clear current draft values or add items to old bill?</p>
                <div className="flex flex-col gap-1.5 pt-1 font-sans">
                  <button type="button" onClick={() => { handleResetAll(); setShowFastDraftConfirmModal(false); setCurrentTab("bill"); }} className="w-full py-2 bg-rose-600 text-white rounded text-xs font-extrabold">New Bill (Clear Everything)</button>
                  <button type="button" onClick={() => { setShowFastDraftConfirmModal(false); setCurrentTab("bill"); }} className="w-full py-2 bg-stone-900 text-white rounded text-xs font-extrabold">Add Items to Old Bill</button>
                  <button type="button" onClick={() => setShowFastDraftConfirmModal(false)} className="w-full py-1.5 bg-stone-100 text-stone-800 rounded text-xs font-bold border">Cancel</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
