  <!-- React & Babel CDNs -->

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, getDoc, setDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const appId = 'minimalistic-rough-bill-gen';
    const firebaseConfig = {
      apiKey: "AIzaSyC4ha5NdXyCFOYW8QApcWohBo_6BS6wGRk",
      authDomain: "myroughbillapp.firebaseapp.com",
      projectId: "myroughbillapp",
      storageBucket: "myroughbillapp.firebasestorage.app",
      messagingSenderId: "683327665576",
      appId: "1:683327665576:web:ecb33e232260125397199d"
    };

    let app, auth, db;
    try {
      app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
    } catch (e) {
      console.warn("Could not authenticate Firebase nodes.", e);
    }

    window.firebaseBridge = {
      db, auth, appId, connected: false,
      products: [], bills: [], customers: [],
      doc, getDoc, setDoc, collection, addDoc, updateDoc, deleteDoc, getDocs
    };

    async function startSetup() {
      if (!db) return;
      try {
        if (auth) await signInAnonymously(auth);
      } catch (e) {
        console.warn("Auth process skipped.");
      }

      window.firebaseBridge.connected = true;

      // Synchronize Products - Strict Product Name Schema
      onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'products'), (snapshot) => {
        const list = [];
        snapshot.forEach(doc => {
          const data = doc.data();
          if (data && data.name) {
            list.push({ id: doc.id, ...data });
          }
        });
        window.firebaseBridge.products = list;
        if (window.firebaseBridge.onProductsChange) window.firebaseBridge.onProductsChange(list);
      }, (error) => console.error("Products subscription error", error));

      // Synchronize Bills
      onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'bills'), (snapshot) => {
        const list = [];
        snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
        list.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
        window.firebaseBridge.bills = list;
        if (window.firebaseBridge.onBillsChange) window.firebaseBridge.onBillsChange(list);
      }, (error) => console.error("Bills subscription error", error));

      // Realtime Customers Sync
      onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'customers'), (snapshot) => {
        const list = [];
        snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
        window.firebaseBridge.customers = list;
        if (window.firebaseBridge.onCustomersChange) window.firebaseBridge.onCustomersChange(list);
      }, (error) => console.error("Customers subscription error", error));
    }

    // Fixed ID format: Pure timestamp numeric ID
    window.firebaseBridge.saveBillToCloudWithNumericId = async (numericId, bill) => {
      const stringId = String(numericId);
      const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'bills', stringId);
      await setDoc(docRef, { ...bill, id: numericId, timestamp: numericId });
      return { id: stringId };
    };

    window.firebaseBridge.updateBillInCloud = async (id, bill) => {
      await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'bills', String(id)), { ...bill, timestamp: Date.now() });
    };
    
    window.firebaseBridge.addProductToCloud = async (prod) => {
      const list = window.firebaseBridge.products;
      const cleanName = prod.name.trim().toLowerCase().replace(/\s+/g, ' ');
      const isDuplicate = list.some(p => p && p.name && p.name.trim().toLowerCase().replace(/\s+/g, ' ') === cleanName);
      if (isDuplicate) return;
      return await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'products'), { name: prod.name, timestamp: Date.now() });
    };

    window.firebaseBridge.deleteProductFromCloud = async (id) => await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', id));

    startSetup();
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [currentTab, setCurrentTab] = useState("bill");
      const [customerName, setCustomerName] = useState("");
      const [customerCity, setCustomerCity] = useState("");
      const [billDate, setBillDate] = useState(new Date().toISOString().split('T')[0]);
      
      const [discountX, setDiscountX] = useState("0"); 
      const [qty, setQty] = useState("1");
      const [productSearch, setProductSearch] = useState("");
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [code, setCode] = useState("");
      const [price, setPrice] = useState("");
      const [less, setLess] = useState("");
      
      const [addedItems, setAddedItems] = useState([]); // Staged items - Newest appears on top
      const [baggedItems, setBaggedItems] = useState([]); // Bagged items - Maintains chronological order

      const [dbCustomers, setDbCustomers] = useState([]);
      const [cloudProducts, setCloudProducts] = useState([]);
      const [cloudBills, setCloudBills] = useState([]);
      const [showCustSuggestions, setShowCustSuggestions] = useState(false);
      const [showProdSuggestions, setShowProdSuggestions] = useState(false);
      const [editingBillId, setEditingBillId] = useState(null);
      
      const [isBillGenerated, setIsBillGenerated] = useState(false);
      const [generatedItems, setGeneratedItems] = useState([]);
      const [notification, setNotification] = useState("");
      
      const [parserInput, setParserInput] = useState("");
      const [lastProductName, setLastProductName] = useState("");
      const [showManualInputs, setShowManualInputs] = useState(false);
      const [showPreview, setShowPreview] = useState(false);

      // Save Status States: 
      // 0 = Idle, 1 = Saving, 2 = Saved Firestore (✓), 3 = Saved Both Firestore + Sheets (✓✓), -1 = Error
      const [saveStatus, setSaveStatus] = useState(0);

      const [newProdName, setNewProdNameState] = useState("");
      const [productFilterQuery, setProductFilterQuery] = useState("");

      const [isNewCustomer, setIsNewCustomer] = useState(false);
      const [pendingDiscountPrompt, setPendingDiscountPrompt] = useState(false);
      const [showNewBillModal, setShowNewBillModal] = useState(false);
      const [showFastDraftConfirmModal, setShowFastDraftConfirmModal] = useState(false);

      // Protected Admin panel authentication
      const [isVerified, setIsVerified] = useState(false);
      const [passwordInput, setPasswordInput] = useState("");

      // Historic log modifiers
      const [editingLogBill, setEditingLogBill] = useState(null);

      // Dynamic Product catalog merges
      const [mergeSource, setMergeSource] = useState("");
      const [mergeTarget, setMergeTarget] = useState("");

      // Bluetooth 58mm Printer Settings
      const [bleDevice, setBleDevice] = useState(null);
      const [bleCharacteristic, setBleCharacteristic] = useState(null);
      const [bleStatus, setBleStatus] = useState("Disconnected");

      const custRef = useRef(null);
      const prodRef = useRef(null);
      const parserRef = useRef(null);

      // Hook Firebase Live Updates to React States
      useEffect(() => {
        const interval = setInterval(() => {
          if (window.firebaseBridge) {
            setCloudProducts(window.firebaseBridge.products || []);
            setCloudBills(window.firebaseBridge.bills || []);
            setDbCustomers(window.firebaseBridge.customers || []);
          }
        }, 800);
        return () => clearInterval(interval);
      }, []);

      // Auto-reconnect to paired printer in the background
      useEffect(() => {
        if (bleDevice && !bleCharacteristic && bleStatus === "Disconnected") {
          reconnectBLEPrinterQuietly();
        }
      }, [currentTab]);

      // Focus Search Customer Field immediately upon opening billing dashboard
      useEffect(() => {
        if (currentTab === "bill" && custRef.current) {
          const input = custRef.current.querySelector('input');
          if (input) input.focus();
        }
      }, [currentTab]);

      const triggerNotification = (msg) => {
        setNotification(msg);
        setTimeout(() => setNotification(""), 3500);
      };

      const getThreeLetterCode = (val) => {
        if (!val) return "GEN";
        const cleaned = val.replace(/[^a-zA-Z]/g, "").toUpperCase();
        return cleaned.slice(0, 3) || "GEN";
      };

      const getNormalizedKey = (str) => {
        if (!str) return "";
        return str.toLowerCase().trim().replace(/\s+/g, ' ');
      };

      const toTitleCase = (str) => {
        return str.replace(/\w\S*/g, (txt) => txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase());
      };

      // Formatted Date-Time Display Generator: "DD,MMM HH:MM (24-hour)"
      const formatInvoiceDateTime = (dateStr) => {
        const baseDate = dateStr ? new Date(dateStr) : new Date();
        const currentRealTime = new Date();
        // Overlay actual system clock time over selected input date
        baseDate.setHours(currentRealTime.getHours(), currentRealTime.getMinutes());
        
        const day = String(baseDate.getDate()).padStart(2, '0');
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const month = months[baseDate.getMonth()];
        const hours = String(baseDate.getHours()).padStart(2, '0');
        const minutes = String(baseDate.getMinutes()).padStart(2, '0');
        return `${day},${month} ${hours}:${minutes}`;
      };

      // Search Google Sheets customers index with faster response
      const handleCustomerSearchAndSelect = async (nameVal) => {
        setCustomerName(nameVal);
        const match = dbCustomers.find(c => c && c.name && c.name.toLowerCase().trim() === nameVal.toLowerCase().trim());
        if (match) {
          setCustomerCity(match.city || "");
          setDiscountX(String(match.discount || 0));
          setIsNewCustomer(false);
          setPendingDiscountPrompt(false);
        } else {
          // Check locally synchronized firestore customer records
          const { db, appId, doc, getDoc } = window.firebaseBridge;
          if (db) {
            try {
              const docSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'customers', nameVal.trim()));
              if (docSnap.exists()) {
                const data = docSnap.data();
                setDiscountX(String(data.discount || 0));
                setCustomerCity(data.city || "");
                setIsNewCustomer(false);
                setPendingDiscountPrompt(false);
              } else {
                setIsNewCustomer(true);
                setPendingDiscountPrompt(true);
                setDiscountX("");
              }
            } catch (err) {
              console.warn(err);
            }
          }
        }
      };

      const handleSaveNewCustomerDiscount = async (enteredDiscount) => {
        const { db, appId, doc, setDoc } = window.firebaseBridge;
        const cleanName = customerName.trim();
        if (!db || !cleanName) return;

        const numDisc = parseFloat(enteredDiscount) || 0;
        try {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'customers', cleanName);
          await setDoc(docRef, {
            name: cleanName,
            city: customerCity || "Local",
            discount: numDisc,
            timestamp: Date.now()
          });
          setDiscountX(String(numDisc));
          setPendingDiscountPrompt(false);
          setIsNewCustomer(false);
          triggerNotification(`Saved client "${cleanName}" in database!`);
        } catch (e) {
          console.error("Failed saving customer info:", e);
        }
      };

      // Token multiplier math formula parsing
      const calculateRateForToken = (codeStr, rawX) => {
        const cleanCode = codeStr.toLowerCase().trim();
        const discountRate = parseFloat(rawX) || 0;

        if (cleanCode.endsWith('n')) {
          const val = parseFloat(cleanCode.slice(0, -1));
          return !isNaN(val) ? val * 5 : 0;
        }

        if (cleanCode.endsWith('no') || cleanCode.endsWith('nu')) {
          const val = parseFloat(cleanCode.replace(/(no|nu)$/, ''));
          if (!isNaN(val)) {
            const baseMultiplierPrice = val * 5;
            return baseMultiplierPrice - (baseMultiplierPrice * (discountRate / 100));
          }
          return 0;
        }

        const plainVal = parseFloat(cleanCode);
        return !isNaN(plainVal) ? plainVal : 0;
      };

      // Space trigger processing logic
      const handleParserKeyDown = (e) => {
        // Kept minimal to preserve existing space triggers
      };

      // Command Parser Processing Submit
      const handleParserSubmit = async (e) => {
        e.preventDefault();
        const rawInput = parserInput.trim();
        if (!rawInput) return;

        const match = rawInput.match(/^(\d+(?:\.\d+)?)\s+(.+)$/);
        if (!match) {
          triggerNotification("Format error: Enter starting quantity first (e.g., 2 sehra 40n)");
          return;
        }

        const parsedQty = parseFloat(match[1]);
        const detailsString = match[2].trim();
        const tokens = detailsString.split(/\s+/);

        if (tokens.length === 0) return;

        let codeValue = "—";
        let unitPrice = 0;
        let finalProdNameTokens = [...tokens];

        const lastToken = tokens[tokens.length - 1];
        const isNumeric = (str) => !isNaN(parseFloat(str)) && isFinite(str);
        
        const isSuffixCode = (str) => {
          const s = str.toLowerCase().trim();
          return s.endsWith('n') || s.endsWith('no') || s.endsWith('nu');
        };

        if (isSuffixCode(lastToken)) {
          codeValue = lastToken;
          unitPrice = calculateRateForToken(codeValue, discountX);
          finalProdNameTokens.pop();
        } else if (isNumeric(lastToken)) {
          codeValue = "—"; 
          unitPrice = parseFloat(lastToken);
          finalProdNameTokens.pop();
        }

        let rawProdName = finalProdNameTokens.join(" ").trim();
        
        if (!rawProdName) {
          if (lastProductName) {
            rawProdName = lastProductName;
          } else {
            rawProdName = "Standard Item";
          }
        } else {
          setLastProductName(rawProdName);
        }

        const normalKey = getNormalizedKey(rawProdName);
        let matchProduct = cloudProducts.find(p => p && p.name && getNormalizedKey(p.name) === normalKey);

        if (!matchProduct) {
          try {
            const displayCasing = toTitleCase(rawProdName);
            const payload = { name: displayCasing };
            await window.firebaseBridge.addProductToCloud(payload);
            matchProduct = payload;
          } catch (err) {
            console.error(err);
          }
        }

        const itemObj = {
          id: Date.now() + Math.random(),
          qty: parsedQty,
          name: matchProduct ? matchProduct.name : rawProdName,
          code: codeValue,
          basePrice: unitPrice,
          less: "—",
          finalUnitPrice: unitPrice,
          totalAmount: parsedQty * unitPrice
        };

        // NEW ITEMS APPEAR AT THE TOP OF THE STAGED ITEMS LIST
        setAddedItems(prev => [itemObj, ...prev]);
        setParserInput("");
        setSaveStatus(0);
        if (parserRef.current) {
          parserRef.current.focus();
        }
        triggerNotification("Staged!");
      };

      // Inline editor hooks inside Staged list UI
      const handleEditStagedItem = (id, field, value) => {
        setAddedItems(prev => prev.map(item => {
          if (item.id === id) {
            const updated = { ...item };
            if (field === 'qty') updated.qty = parseFloat(value) || 0;
            if (field === 'name') updated.name = value;
            if (field === 'code') updated.code = value;
            if (field === 'basePrice') updated.basePrice = parseFloat(value) || 0;
            
            // Recompute pricing bounds
            if (updated.code !== "—" && updated.code !== "") {
              updated.basePrice = calculateRateForToken(updated.code, discountX);
            }
            updated.finalUnitPrice = updated.basePrice;
            updated.totalAmount = updated.qty * updated.finalUnitPrice;
            return updated;
          }
          return item;
        }));
      };

      // Move item to bag while maintaining insertion order
      const handleTalliedCheck = (stagedItem) => {
        setAddedItems(prev => prev.filter(i => i.id !== stagedItem.id));
        // Maintaining sequential insertion order on bagged arrays
        setBaggedItems(prev => [...prev, { ...stagedItem }]);
        setSaveStatus(0);
        triggerNotification(`Tallied to Bag!`);
      };

      // Inline edits inside Bagged tab lists
      const handleEditBaggedItem = (id, field, value) => {
        setBaggedItems(prev => prev.map(item => {
          if (item.id === id) {
            const updated = { ...item };
            if (field === 'qty') updated.qty = parseFloat(value) || 0;
            if (field === 'name') updated.name = value;
            if (field === 'code') updated.code = value;
            if (field === 'basePrice') updated.basePrice = parseFloat(value) || 0;
            if (field === 'less') updated.less = value;

            if (updated.code !== "—" && updated.code !== "") {
              updated.basePrice = calculateRateForToken(updated.code, discountX);
            }

            let deduction = 0;
            const cleanLess = String(updated.less).trim().toLowerCase();
            const numericDiscount = parseFloat(discountX) || 0;

            if (cleanLess.endsWith('%')) {
              deduction = updated.basePrice * (parseFloat(cleanLess.slice(0, -1)) || 0) / 100;
            } else if (cleanLess === 'x%' || cleanLess === 'x') {
              deduction = updated.basePrice * (numericDiscount / 100);
            } else if (cleanLess !== "" && cleanLess !== "—") {
              deduction = parseFloat(cleanLess) || 0;
            }

            updated.finalUnitPrice = Math.max(0, updated.basePrice - deduction);
            updated.totalAmount = updated.qty * updated.finalUnitPrice;
            return updated;
          }
          return item;
        }));
      };

      const handleResetAll = () => {
        setCustomerName(""); setCustomerCity(""); setDiscountX("0");
        setQty("1"); setProductSearch(""); setSelectedProduct(null); setCode(""); setPrice(""); setLess("");
        setAddedItems([]); setBaggedItems([]); setGeneratedItems([]); setIsBillGenerated(false); setEditingBillId(null);
        setIsNewCustomer(false); setPendingDiscountPrompt(false); setParserInput("");
        setSaveStatus(0);
        
        // Immediately focus Search Customer field after reset
        setTimeout(() => {
          if (custRef.current) {
            const input = custRef.current.querySelector('input');
            if (input) input.focus();
          }
        }, 100);
      };

      // Intercept navigation tab clicks to ask confirmation if draft contains entries
      const handleFastDraftTabClick = () => {
        if (addedItems.length > 0 || baggedItems.length > 0) {
          setShowFastDraftConfirmModal(true);
        } else {
          setCurrentTab("bill");
        }
      };

      const triggerNewBillConfirmation = () => {
        if (addedItems.length > 0 || baggedItems.length > 0) {
          setShowFastDraftConfirmModal(true);
        } else {
          handleResetAll();
          setCurrentTab("bill");
        }
      };

      // Dynamic receipt generator
      const handleGenerateAndPrintBill = async () => {
        if (baggedItems.length === 0) {
          triggerNotification("Please tally and select items first!");
          return;
        }

        // 1. First trigger system print out immediately
        setGeneratedItems(baggedItems);
        setIsBillGenerated(true);
        setTimeout(() => {
          window.print();
        }, 100);

        // 2. Begin Background Saving Pipeline with purely numeric IDs
        setSaveStatus(1); // Set to "Saving" state
        const uniqueNumericId = Date.now(); // Fully numeric ID

        const finalClientName = customerName.trim() || "Walk-In Customer";
        const computedTotalSum = baggedItems.reduce((acc, i) => acc + i.totalAmount, 0);

        const billDataObject = {
          id: uniqueNumericId,
          customerName: finalClientName,
          customerCity: customerCity || "Local",
          date: billDate,
          items: baggedItems,
          totalAmount: computedTotalSum,
          discountRate: parseFloat(discountX) || 0,
          timestamp: uniqueNumericId,
          syncStatusFirestore: false,
          syncStatusSheets: false
        };

        let sheetsSucceeded = false;
        let firestoreSucceeded = false;

        // Save to Google Sheets (POST txn request with pure numeric ID, no remarks)
        if (finalClientName !== "Walk-In Customer") {
          try {
            await saveTransactionToGoogleSheet(uniqueNumericId, finalClientName, computedTotalSum);
            sheetsSucceeded = true;
            billDataObject.syncStatusSheets = true;
          } catch (err) {
            console.warn("Sheets API Save Error:", err);
          }
        } else {
          // Walk-In customers skip sheets but mark as true to show dual-sync flag
          sheetsSucceeded = true; 
          billDataObject.syncStatusSheets = true;
        }

        // Save to Firestore with matching numeric ID
        const { db, saveBillToCloudWithNumericId } = window.firebaseBridge;
        if (db && window.firebaseBridge.connected) {
          try {

        const trimmed = parserInput.trim();
        if (!trimmed) return "";
        const match = trimmed.match(/^(\d+(?:\.\d+)?)\s+(.*)$/);
        if (match) {
          const rest = match[2].trim();
          const tokens = rest.split(/\s+/);
          if (tokens.length > 0) {
            const lastToken = tokens[tokens.length - 1];
            if (lastToken.toLowerCase().endsWith('n') || lastToken.toLowerCase().endsWith('no') || lastToken.toLowerCase().endsWith('nu') || (!isNaN(parseFloat(lastToken)) && isFinite(lastToken))) {
              tokens.pop();
            }
          }
          return tokens.join(" ");
        }
        if (isNaN(parseFloat(trimmed.split(/\s+/)[0]))) {
          return trimmed;
        }
        return "";

          return;
        }
        setBleStatus("Scanning...");
        try {
          const device = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: [
              "000018f0-0000-1000-8000-00805f9b34fb", 
              "0000e7e1-0000-1000-8000-00805f9b34fb"
            ]
          });
          
          setBleStatus("Connecting...");
          const server = await device.gatt.connect();
          let service;
          try {
            service = await server.getPrimaryService("000018f0-0000-1000-8000-00805f9b34fb");
          } catch(e) {
            service = await server.getPrimaryService("0000e7e1-0000-1000-8000-00805f9b34fb");
          }

          const characteristics = await service.getCharacteristics();
          const writer = characteristics.find(c => c.properties.write || c.properties.writeWithoutResponse);

          setBleDevice(device);
          setBleCharacteristic(writer);
          setBleStatus("Connected to Seznik");
          triggerNotification("Seznik 58mm BLE Printer online!");

      const printBLEThermalDirectly = async (itemsList, custName, cityVal, activeDate) => {
        if (!bleCharacteristic) return;
        const encoder = new TextEncoder();
        let esc = [];

        esc.push(0x1B, 0x40); // Init
        esc.push(0x1B, 0x61, 0x01); // Center
        esc.push(...encoder.encode("ESTIMATE RECEIPT\n"));
        esc.push(...encoder.encode(`${custName.toUpperCase()} - ${activeDate}\n`));
        esc.push(...encoder.encode("--------------------------------\n"));
        
        esc.push(0x1B, 0x61, 0x00); // Left align
        // Sorted items printed
        const sortedItems = [...itemsList].sort((a,b) => a.name.localeCompare(b.name));
        sortedItems.forEach(item => {
          const nameStr = item.name.trim().toUpperCase().slice(0, 15);

          const pStr = String(Math.round(item.finalUnitPrice)).padStart(4);
          const totalStr = String(Math.round(item.totalAmount)).padStart(6);
          esc.push(...encoder.encode(`${qStr} ${nameStr.padEnd(15)} ${pStr} ${totalStr}\n`));
        });

        esc.push(...encoder.encode("--------------------------------\n"));
        const sumTotal = Math.round(itemsList.reduce((acc, i) => acc + i.totalAmount, 0));
        esc.push(...encoder.encode(`TOTAL LIABILITY:         ${sumTotal}\n\n\n`));
        esc.push(0x1D, 0x56, 0x42, 0x00); // Cut

        const bytes = new Uint8Array(esc);
        for (let i = 0; i < bytes.length; i += 20) {
          await bleCharacteristic.writeValue(bytes.slice(i, i + 20));
        }

          )}

          {/* Original Single Option Fallback Modal */}
          {showNewBillModal && (
            <div className="absolute inset-0 bg-stone-900/80 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-xl border border-stone-200">
                <div className="text-stone-900 font-bold text-sm flex items-center gap-1.5">
                  <i className="fa-solid fa-circle-exclamation text-rose-500 text-lg"></i> Confirm New Bill
                </div>
                <p className="text-xs text-stone-600 leading-relaxed font-semibold">Do you want to create a new bill? Draft items and current customer configs will be cleaned.</p>
                <div className="flex gap-2.5 justify-end">
                  <button type="button" onClick={() => setShowNewBillModal(false)} className="px-4 py-2 bg-stone-100 hover:bg-stone-200 text-stone-800 rounded-lg text-xs font-bold">Cancel</button>
                  <button type="button" onClick={() => { handleResetAll(); setShowNewBillModal(false); }} className="px-4 py-2 bg-rose-600 text-white rounded-lg text-xs font-bold">Confirm New Bill</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
