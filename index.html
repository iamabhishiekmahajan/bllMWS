<html lang="en">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rough Bill Generator</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    /* Prevent view bounce scroll on iOS & Android devices - Lock at 100dvh */
    html, body {
      position: fixed;
      width: 100%;
      height: 100dvh; /* Solves address-bar sizing overflows on Android Chrome */
      overflow: hidden;
      background-color: #f5f5f4;
      margin: 0;
      padding: 0;
    }

    /* Screen display isolation for print canvas to avoid Tailwind display overrides */

      display: none;
    }

    /* Absolute A4 End-to-End Professional Printing Fixes with Paper-Saving Margins */
    @media print {
      @page {
        size: A4;
        margin: 5mm 2mm 5mm 5mm !important; /* Decreased right margin to 2mm to give 15% more space */
      }
      html, body {
        position: relative !important;
        width: 210mm !important;
        height: auto !important;
        overflow: visible !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #fff !important;
        color: #000 !important;
        font-family: 'Courier Prime', monospace !important;
        -webkit-print-color-adjust: exact;
      }
      body * {
        visibility: hidden !important;
      }
      #printable-bill-invoice, #printable-bill-invoice * {
        visibility: visible !important;
      }
      #printable-bill-invoice {
        display: block !important;
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 203mm !important; /* Expanded printable region to capture 15% more space on the right side */
        height: auto !important;
        overflow: visible !important;
        margin: 0 !important;
        padding: 2mm 0mm !important;
        box-sizing: border-box !important;
      }
      header, footer, .no-print, .tabs-container {
        display: none !important;
      }
    }

    /* Custom high contrast mobile scrollbars */
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #e7e5e4;
      border-radius: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #a8a29e;
      border-radius: 4px;

<body class="text-stone-900 font-sans antialiased selection:bg-stone-300 bg-stone-100">

  <div id="root" class="h-[100dvh] w-full flex flex-col overflow-hidden"></div>

  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, getDoc, setDoc, writeBatch, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const appId = 'minimalistic-rough-bill-gen';
    const firebaseConfig = {
      apiKey: "AIzaSyC4ha5NdXyCFOYW8QApcWohBo_6BS6wGRk",
      authDomain: "myroughbillapp.firebaseapp.com",
      projectId: "myroughbillapp",
      storageBucket: "myroughbillapp.firebasestorage.app",
      messagingSenderId: "683327665576",
      appId: "1:683327665576:web:ecb33e232260125397199d"
    };

    let app, auth, db;
    try {
      app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
    } catch (e) {
      console.warn("Could not authenticate Firebase nodes.", e);
    }

    window.firebaseBridge = {
      db, auth, appId, connected: false,
      products: [], bills: [], customers: [], sales: [],
      doc, getDoc, setDoc, collection, addDoc, updateDoc, deleteDoc, getDocs
    };

    async function startSetup() {
      if (!db) return;
      try {
        if (auth) await signInAnonymously(auth);
      } catch (e) {
        console.warn("Auth process skipped.");
      }

      window.firebaseBridge.connected = true;

      // Realtime Products Synchronizer
      onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'products'), (snapshot) => {
        const list = [];
        snapshot.forEach(doc => {
          const data = doc.data();
          if (data && data.name) {
            list.push({ id: doc.id, ...data });
          }
        });
        window.firebaseBridge.products = list;
        if (window.firebaseBridge.onProductsChange) window.firebaseBridge.onProductsChange(list);
      });

      // Realtime Bills Synchronizer
      onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'bills'), (snapshot) => {
        const list = [];
        snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
        list.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
        window.firebaseBridge.bills = list;
        if (window.firebaseBridge.onBillsChange) window.firebaseBridge.onBillsChange(list);
      });

      // Realtime Customers Registry Sync
      onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'customers'), (snapshot) => {
        const list = [];
        snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
        window.firebaseBridge.customers = list;
        if (window.firebaseBridge.onCustomersChange) window.firebaseBridge.onCustomersChange(list);
      });
    }

    window.firebaseBridge.saveBillToCloud = async (bill) => await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'bills'), { ...bill, timestamp: Date.now() });
    window.firebaseBridge.updateBillInCloud = async (id, bill) => await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'bills', id), { ...bill, timestamp: Date.now() });
    
    window.firebaseBridge.addProductToCloud = async (prod) => {
      const list = window.firebaseBridge.products;
      const cleanName = prod.name.trim().toLowerCase().replace(/\s+/g, ' ');
      const cleanCategory = (prod.category || "General").trim().toLowerCase().replace(/\s+/g, ' ');
      
      const isDuplicate = list.some(p => 
        p && p.name && p.name.trim().toLowerCase().replace(/\s+/g, ' ') === cleanName && 
        (p.category || "General").trim().toLowerCase().replace(/\s+/g, ' ') === cleanCategory
      );
      if (isDuplicate) return;
      return await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'products'), { ...prod, timestamp: Date.now() });
    };

    window.firebaseBridge.deleteProductFromCloud = async (id) => await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', id));

    startSetup();
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [currentTab, setCurrentTab] = useState("bill");
      const [customerName, setCustomerName] = useState("");
      const [customerCity, setCustomerCity] = useState("");
      const [billDate, setBillDate] = useState(new Date().toISOString().split('T')[0]);
      
      const [discountX, setDiscountX] = useState("0"); 
      const [qty, setQty] = useState("1");
      const [productSearch, setProductSearch] = useState("");
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [code, setCode] = useState("");
      const [price, setPrice] = useState("");
      const [less, setLess] = useState("");
      
      // Dynamic Staged Pool items in Tab 1
      const [addedItems, setAddedItems] = useState([]);
      // Bagged (Tallied checklist items) in Tab 2
      const [baggedItems, setBaggedItems] = useState([]);

      const [dbCustomers, setDbCustomers] = useState([]);
      const [firestoreCustomers, setFirestoreCustomers] = useState([]);
      const [cloudProducts, setCloudProducts] = useState([]);
      const [cloudBills, setCloudBills] = useState([]);
      const [showCustSuggestions, setShowCustSuggestions] = useState(false);
      const [showProdSuggestions, setShowProdSuggestions] = useState(false);
      const [editingBillId, setEditingBillId] = useState(null);
      
      // Clean Invoice Rendering Variables
      const [isBillGenerated, setIsBillGenerated] = useState(false);
      const [generatedItems, setGeneratedItems] = useState([]);
      const [notification, setNotification] = useState("");
      
      // Parser State & Autocomplete Fallbacks
      const [parserInput, setParserInput] = useState("");
      const [lastProductName, setLastProductName] = useState("");
      const [showManualInputs, setShowManualInputs] = useState(false);
      const [showPreview, setShowPreview] = useState(false); // Collapsed by default

      // Generate Status Indicator State (Idle, Saving, SavedFirestore, SavedSheets, Error)
      // 0 = Idle, 1 = Saving, 2 = Saved Cloud (✓), 3 = Saved Sheets (✓✓), -1 = Error
      const [saveStatus, setSaveStatus] = useState(0);

      // Add/Edit Catalog products
      const [newProdName, setNewProdNameState] = useState("");
      const [newProdCategory, setNewProdCategory] = useState("");
      const [productFilterQuery, setProductFilterQuery] = useState("");

      // Customer Status states
      const [isNewCustomer, setIsNewCustomer] = useState(false);
      const [pendingDiscountPrompt, setPendingDiscountPrompt] = useState(false);
      const [showNewBillModal, setShowNewBillModal] = useState(false);

      // Access passcode protection states
      const [isVerified, setIsVerified] = useState(false);
      const [passwordInput, setPasswordInput] = useState("");

      // Log editor states
      const [editingLogBill, setEditingLogBill] = useState(null);

      // Product Merging variables
      const [mergeSource, setMergeSource] = useState("");
      const [mergeTarget, setMergeTarget] = useState("");

      // Bluetooth Seznik Printer State
      const [bleDevice, setBleDevice] = useState(null);
      const [bleCharacteristic, setBleCharacteristic] = useState(null);
      const [bleStatus, setBleStatus] = useState("Disconnected");

      const custRef = useRef(null);
      const prodRef = useRef(null);
      const parserRef = useRef(null);

      // Helper to generate 3-letter codes
      const getThreeLetterCode = (val) => {
        if (!val) return "GEN";
        const cleaned = val.replace(/[^a-zA-Z]/g, "").toUpperCase();
        return cleaned.slice(0, 3) || "GEN";
      };

      // Space and Case-insensitive normalize helper
      const getNormalizedKey = (str) => {
        if (!str) return "";
        return str.toLowerCase().trim().replace(/\s+/g, ' ');
      };

      // Capitalize first letters elegantly for single-style DB storage
      const toTitleCase = (str) => {
        return str.replace(/\w\S*/g, (txt) => txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase());
      };

      // Sync customer details and load saved discount rate (x)
      const syncCustomerProfile = async (targetName, cityFromSheet = "") => {
        const { db, appId, doc, getDoc } = window.firebaseBridge;
        if (!db || !targetName.trim()) return;

        try {
          const cleanName = targetName.trim();
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'customers', cleanName);
          const docSnap = await getDoc(docRef);

          if (docSnap.exists()) {
            const data = docSnap.data();
            setDiscountX(String(data.discount || 0));
            if (data.city) setCustomerCity(data.city);
            setIsNewCustomer(false);
            setPendingDiscountPrompt(false);
          } else {
            setIsNewCustomer(true);
            setPendingDiscountPrompt(true);
            setDiscountX("");
            if (cityFromSheet) setCustomerCity(cityFromSheet);
          }
        } catch (err) {
          console.error("Profile sync exception:", err);
        }
      };

      const handleSaveNewCustomerDiscount = async (enteredDiscount) => {
        const { db, appId, doc, setDoc } = window.firebaseBridge;
        const cleanName = customerName.trim();
        if (!db || !cleanName) return;

        const numDisc = parseFloat(enteredDiscount) || 0;
        try {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'customers', cleanName);
          await setDoc(docRef, {
            name: cleanName,
            city: customerCity || "",
            discount: numDisc,
            timestamp: Date.now()
          });
          setDiscountX(String(numDisc));
          setPendingDiscountPrompt(false);
          setIsNewCustomer(false);
          triggerNotification(`Registered ${cleanName} with ${numDisc}%!`);
        } catch (e) {
          console.error("Failed saving customer info:", e);
        }
      };

      // searchcustomer STRICTLY from Spreadsheet getData list only
      const handleCustomerBlur = () => {
        setTimeout(() => {
          const val = customerName.trim();
          if (val === "") {
            setCustomerCity("");
            setDiscountX("0");
            setIsNewCustomer(false);
            setPendingDiscountPrompt(false);
            return;
          }
          // Strictly searches from dbCustomers (Sheet) list only
          const match = dbCustomers.find(c => c && c.name && c.name.toLowerCase() === val.toLowerCase());
          if (match) {
            setCustomerName(match.name);
            setCustomerCity(match.city);
            syncCustomerProfile(match.name, match.city);
          } else {
            syncCustomerProfile(val, "");
          }
        }, 250);
      };

      const triggerNotification = (msg) => {
        setNotification(msg);
        setTimeout(() => setNotification(""), 4000);
      };

      // Integrated core parser math calculations
      const calculateRateForToken = (codeStr, rawX) => {
        const cleanCode = codeStr.toLowerCase().trim();
        const discountRate = parseFloat(rawX) || 0;

        // Pattern 1: ends with 'n' -> Net Rate: numeric value * 5
        if (cleanCode.endsWith('n')) {
          const val = parseFloat(cleanCode.slice(0, -1));
          return !isNaN(val) ? val * 5 : 0;
        }

        // Pattern 2: ends with 'no' or 'nu' -> code numeric value * 5 - customer discount % (x)
        if (cleanCode.endsWith('no') || cleanCode.endsWith('nu')) {
          const isNo = cleanCode.endsWith('no');
          const val = parseFloat(isNo ? cleanCode.slice(0, -2) : cleanCode.slice(0, -2));
          if (!isNaN(val)) {
            const baseMultiplierPrice = val * 5;
            return baseMultiplierPrice - (baseMultiplierPrice * (discountRate / 100));
          }
          return 0;
        }

        // Pattern 3: plain numerical values represent exact rate entered
        const plainVal = parseFloat(cleanCode);
        return !isNaN(plainVal) ? plainVal : 0;
      };

      // Parser processing submission handler
      const handleParserSubmit = async (e) => {
        e.preventDefault();
        const rawInput = parserInput.trim();
        if (!rawInput) return;

        // Split quantity and detail elements
        const match = rawInput.match(/^(\d+(?:\.\d+)?)\s+(.+)$/);
        if (!match) {
          triggerNotification("Command error: Format must start with quantity (e.g., 12 sehra 20n)");
          return;
        }

        const parsedQty = parseFloat(match[1]);
        const detailsString = match[2].trim();
        const tokens = detailsString.split(/\s+/);

        if (tokens.length === 0) return;

        let codeValue = "—";
        let unitRate = 0;
        let finalProdNameTokens = [...tokens];

        const lastToken = tokens[tokens.length - 1];
        const isNumeric = (str) => !isNaN(parseFloat(str)) && isFinite(str);
        
        const isSuffixCode = (str) => {
          const s = str.toLowerCase().trim();
          return s.endsWith('n') || s.endsWith('no') || s.endsWith('nu');
        };

        // If the code is formatted properly with suffixes n/no/nu, save as codeValue.
        // If it's just a raw number (like 120), do NOT write it as code in the bill.
        if (isSuffixCode(lastToken)) {
          codeValue = lastToken;
          unitRate = calculateRateForToken(codeValue, discountX);
          finalProdNameTokens.pop();
        } else if (isNumeric(lastToken)) {
          codeValue = "—"; // Skip storing just direct numeric code values
          unitRate = parseFloat(lastToken);
          finalProdNameTokens.pop();
        }

        let rawProdName = finalProdNameTokens.join(" ").trim();
        
        // Pick previous item name if product name is blank
        if (!rawProdName) {
          if (lastProductName) {
            rawProdName = lastProductName;
          } else {
            rawProdName = "Item";
          }
          triggerNotification(`Using previous item name: "${rawProdName}"`);
        } else {
          // Store last successfully typed name
          setLastProductName(rawProdName);
        }

        // Normalize spaces and casing to match single style and prevent duplicates
        const normalKey = getNormalizedKey(rawProdName);
        let matchProduct = cloudProducts.find(p => p && p.name && getNormalizedKey(p.name) === normalKey);

        if (!matchProduct) {
          try {
            const displayCasing = toTitleCase(rawProdName);
            const payload = { name: displayCasing, category: "General", code: "", price: "" };
            await window.firebaseBridge.addProductToCloud(payload);
            matchProduct = payload;
            triggerNotification(`Saved product "${displayCasing}" to directory!`);
          } catch (err) {
            console.error("Could not register product dynamically:", err);
          }
        }

        const itemObj = {
          id: Date.now() + Math.random(),
          qty: parsedQty,
          name: matchProduct ? matchProduct.name : rawProdName,
          category: matchProduct ? (matchProduct.category || "General") : "General",
          code: codeValue,
          basePrice: unitRate,
          less: "—", // Modified on Bag Tab
          finalUnitPrice: unitRate,
          totalAmount: parsedQty * unitRate,
          labelType: codeValue.toLowerCase().endsWith('n') ? "Net" : "Standard"
        };

        setAddedItems(prev => [...prev, itemObj]);
        setParserInput("");
        setSaveStatus(0); // Reset save indicators upon altering content
        if (parserRef.current) {
          parserRef.current.focus();
        }
        triggerNotification("Item staged below!");
      };

      // Autocomplete helper logic for current parser inputs
      const getParserAutocompleteQuery = () => {
        const trimmed = parserInput.trim();
        if (!trimmed) return "";
        const match = trimmed.match(/^(\d+(?:\.\d+)?)\s+(.*)$/);
        if (match) {
          const rest = match[2].trim();
          const tokens = rest.split(/\s+/);
          if (tokens.length > 0) {
            const lastToken = tokens[tokens.length - 1];
            if (lastToken) {
              const lastTokenLower = lastToken.toLowerCase();
              if (lastTokenLower.endsWith('n') || lastTokenLower.endsWith('no') || lastTokenLower.endsWith('nu') || (!isNaN(parseFloat(lastTokenLower)) && isFinite(lastTokenLower))) {
                tokens.pop();
              }
            }
          }
          return tokens.join(" ");
        }
        if (isNaN(parseFloat(trimmed.split(/\s+/)[0]))) {
          return trimmed;
        }
        return "";
      };

      const selectParserSuggestion = (prodName) => {
        const trimmed = parserInput.trimStart();
        const match = trimmed.match(/^(\d+(?:\.\d+)?)\s+(.*)$/);
        let newQty = "1";
        if (match) {
          newQty = match[1];
        }
        setParserInput(`${newQty} ${prodName} `);
        if (parserRef.current) {
          parserRef.current.focus();
        }
      };

      // Optional manual input backup submission
      const handleManualAddItem = async () => {
        const queryName = productSearch.trim();
        if (!queryName) {
          triggerNotification("No product selected!");
          return;
        }

        const manualRate = parseFloat(price) || 0;
        const manualQty = parseFloat(qty) || 1;

        const normalKey = getNormalizedKey(queryName);
        let matchProduct = cloudProducts.find(p => p && p.name && getNormalizedKey(p.name) === normalKey);

        if (!matchProduct) {
          try {
            const displayCasing = toTitleCase(queryName);
            const payload = { name: displayCasing, category: "General", code: "", price: "" };
            await window.firebaseBridge.addProductToCloud(payload);
            matchProduct = payload;
          } catch (e) {
            console.error(e);
          }
        }

        const finalRate = code ? calculateRateForToken(code, discountX) : manualRate;

        // Strip non-suffix plain numerical codes out from bill formatting
        const cleanCodeStr = (code.toLowerCase().endsWith('n') || code.toLowerCase().endsWith('no') || code.toLowerCase().endsWith('nu')) ? code : "—";

        const manualItem = {
          id: Date.now() + Math.random(),
          qty: manualQty,
          name: matchProduct ? matchProduct.name : queryName,
          category: matchProduct ? (matchProduct.category || "General") : "General",
          code: cleanCodeStr,
          basePrice: finalRate,
          less: less || "—",
          finalUnitPrice: finalRate,
          totalAmount: manualQty * finalRate,
          labelType: "Manual"
        };

        setAddedItems(prev => [...prev, manualItem]);
        setProductSearch(""); setCode(""); setPrice(""); setLess(""); setQty("1");
        setShowManualInputs(false);
        setSaveStatus(0);
        triggerNotification("Item added manual form!");
      };

      // Dynamic Checklist state moves item directly to "Bag Tab" WITHOUT tab switching
      const handleTalliedCheck = (stagedItem) => {
        setAddedItems(prev => prev.filter(i => i.id !== stagedItem.id));
        const bagObj = { ...stagedItem };
        setBaggedItems(prev => [...prev, bagObj]);
        setSaveStatus(0);
        triggerNotification(`Tallied "${stagedItem.name}" to Bag!`);
      };

      // Apply/Change Less percentage or flat rate modifications inside Tab 2 Bag list
      const handleUpdateLessInBag = (itemId, lessStr) => {
        setSaveStatus(0);
        setBaggedItems(prev => prev.map(item => {
          if (item.id === itemId) {
            let deduction = 0;
            const cleanLess = lessStr.trim().toLowerCase();
            const numericDiscount = parseFloat(discountX) || 0;

            if (cleanLess.endsWith('%')) {
              deduction = item.basePrice * (parseFloat(cleanLess.slice(0, -1)) || 0) / 100;
            } else if (cleanLess === 'x%' || cleanLess === 'x') {
              deduction = item.basePrice * (numericDiscount / 100);
            } else if (cleanLess !== "" && cleanLess !== "—") {
              deduction = parseFloat(cleanLess) || 0;
            }

            const calculatedFinalRate = Math.max(0, item.basePrice - deduction);
            return {
              ...item,
              less: lessStr,
              finalUnitPrice: calculatedFinalRate,
              totalAmount: item.qty * calculatedFinalRate
            };
          }
          return item;
        }));
      };

      // Clear layout and reset back to draft sheet
      const handleResetAll = () => {
        setCustomerName(""); setCustomerCity(""); setDiscountX("0");
        setQty("1"); setProductSearch(""); setSelectedProduct(null); setCode(""); setPrice(""); setLess("");
        setAddedItems([]); setBaggedItems([]); setGeneratedItems([]); setIsBillGenerated(false); setEditingBillId(null);
        setIsNewCustomer(false); setPendingDiscountPrompt(false); setParserInput("");
        setSaveStatus(0);
      };

      // Automated Sales log synchronizer
      const syncSalesEntries = async (billItems, clientName, activeDate) => {
        const { db, appId, collection, addDoc } = window.firebaseBridge;
        if (!db) return;

        try {
          for (const item of billItems) {
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'sales'), {
              productName: item.name,
              category: item.category || "General",
              qty: item.qty,
              price: item.finalUnitPrice,
              total: item.totalAmount,
              customerName: clientName,
              date: activeDate,
              timestamp: Date.now()
            });
          }
        } catch (e) {
          console.error("Sales entry log mismatch:", e);
        }
      };

      // Perform clean database saving operations and progress ticks
      const handleGenerateCleanBill = async () => {
        if (baggedItems.length === 0) {
          triggerNotification("Please tally and checklist staged items first!");
          return;
        }

        const finalClientName = customerName.trim() || "Walk-In Customer";
        const totalCalculatedBill = baggedItems.reduce((acc, i) => acc + i.totalAmount, 0);

        setGeneratedItems(baggedItems);
        setIsBillGenerated(true);
        setSaveStatus(1); // Set to "Saving" state

        const { db, appId, doc, setDoc } = window.firebaseBridge;
        if (db && finalClientName !== "Walk-In Customer") {
          try {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'customers', finalClientName);
            await setDoc(docRef, {
              name: finalClientName,
              city: customerCity || "",
              discount: parseFloat(discountX) || 0,
              timestamp: Date.now()
            }, { merge: true });
          } catch (e) {
            console.error("Client discount configuration update fail:", e);
            setSaveStatus(-1); // Transition to Error
            return;
          }
        }

        // Commit transaction records to Sales
        await syncSalesEntries(baggedItems, finalClientName, billDate);

        // Google Sheets Integration Pipeline: Only triggers logging if customerName is explicitly specified
        const cleanCustVal = customerName.trim();
        let sheetsSucceeded = false;
        if (cleanCustVal && cleanCustVal !== "Walk-In Customer") {
          try {
            await saveLedgerTransactionToSheet(cleanCustVal, totalCalculatedBill);

            console.warn("Sheets logging bypassed or failed.", err);
          }

        if (db && window.firebaseBridge.connected) {
          const rawBillObj = {
            customerName: finalClientName,
            customerCity: customerCity || "",
            date: billDate,
            items: baggedItems,
            totalAmount: totalCalculatedBill,

          };

          try {
            if (editingBillId) {
              await window.firebaseBridge.updateBillInCloud(editingBillId, rawBillObj);

              const docRef = await window.firebaseBridge.saveBillToCloud(rawBillObj);
              if (docRef?.id) setEditingBillId(docRef.id);

            // Success State Toggles: 2 = Cloud Saved (✓), 3 = Cloud + Sheets Saved (✓✓)
            if (cleanCustVal && cleanCustVal !== "Walk-In Customer" && sheetsSucceeded) {

            console.error("Database storage exception:", err);
            setSaveStatus(-1); // Transition to Error
          }

          setSaveStatus(-1);

        if (bleCharacteristic) {

            triggerNotification("BLE Printing interrupted. Trying PDF share fallback...");

        }

        setTimeout(() => {

      const handleQuickSuggestionClick = (prod) => {
        setParserInput(prev => {
          const matchQty = prev.match(/^\d+(\.\d+)?\s+/);
          const currentQtyPrefix = matchQty ? matchQty[0] : "1 ";
          return `${currentQtyPrefix}${prod.name} `;
        });
        if (parserRef.current) {
          parserRef.current.focus();
        }
      };

      // Safeguarded catalog list helper preventing null crash
      const getSortedProducts = () => {
        if (!cloudProducts || !Array.isArray(cloudProducts)) return [];
        return [...cloudProducts]
          .filter(p => p && typeof p === 'object' && p.name)
          .sort((a, b) => {
            const catA = (a.category || "General").trim();
            const catB = (b.category || "General").trim();
            const catComp = catA.localeCompare(catB, undefined, { sensitivity: 'base' });
            if (catComp !== 0) return catComp;
            const nameA = (a.name || "").trim();
            const nameB = (b.name || "").trim();
            return nameA.localeCompare(nameB, undefined, { sensitivity: 'base' });
          });
      };

      const getTopTwentyProducts = () => {
        return getSortedProducts().slice(0, 20);
      };

      const filteredProductsForBilling = query => {
        const sorted = getSortedProducts();
        if (!query.trim()) return sorted.slice(0, 15);
        return sorted.filter(p => 
          p && p.name && p.name.toLowerCase().includes(query.toLowerCase()) ||
          (p && p.category && p.category.toLowerCase().includes(query.toLowerCase()))
        ).slice(0, 15);

      const handleTabVerificationInput = (val) => {

      const handleProductAddSubmit = async (e) => {

          triggerNotification(`Duplicate entry error: "${trimmed}" already cataloged!`);

        const targetDisplayName = toTitleCase(trimmed);

          triggerNotification("Specify both source and target names.");
          return;

        const sourceItem = cloudProducts.find(p => p && p.name && getNormalizedKey(p.name) === getNormalizedKey(source));
        const targetItem = cloudProducts.find(p => p && p.name && getNormalizedKey(p.name) === getNormalizedKey(target));

        if (!sourceItem || !targetItem) {
          triggerNotification("Both catalog products must exist to merge.");
          return;
        }

        try {
          await window.firebaseBridge.deleteProductFromCloud(sourceItem.id);
          
          setAddedItems(prev => prev.map(item => {
            if (item && item.name && getNormalizedKey(item.name) === getNormalizedKey(source)) {
              return { ...item, name: targetItem.name, category: targetItem.category || "General" };
            }
            return item;
          }));

          setBaggedItems(prev => prev.map(item => {
            if (item && item.name && getNormalizedKey(item.name) === getNormalizedKey(source)) {
              return { ...item, name: targetItem.name, category: targetItem.category || "General" };
            }
            return item;
          }));

          setMergeSource("");
          setMergeTarget("");
          triggerNotification(`Merged "${source}" into "${target}" successfully!`);

          const updatedBill = {

          await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'bills', editingLogBill.id), updatedBill);
          setEditingLogBill(null);

      const handleRemoveLogItem = (index) => {
        setEditingLogBill(prev => {

          nextItems.splice(index, 1);
          return { ...prev, items: nextItems };

      const handleLogItemQtyChange = (index, value) => {
        setEditingLogBill(prev => {
          const nextItems = [...(prev.items || [])];
          const qty = parseFloat(value) || 0;
          nextItems[index] = {
            ...nextItems[index],
            qty: qty,
            totalAmount: qty * nextItems[index].finalUnitPrice
          };
          return { ...prev, items: nextItems };
        });
      };

      const handleLogItemLessChange = (index, value) => {
        setEditingLogBill(prev => {
          const nextItems = [...(prev.items || [])];
          const cleanLess = value.trim().toLowerCase();
          const discountRate = parseFloat(prev.discountRate) || 0;
          let deduction = 0;

          if (cleanLess.endsWith('%')) {
            deduction = nextItems[index].basePrice * (parseFloat(cleanLess.slice(0, -1)) || 0) / 100;
          } else if (cleanLess === 'x%' || cleanLess === 'x') {
            deduction = nextItems[index].basePrice * (discountRate / 100);
          } else if (cleanLess !== "" && cleanLess !== "—") {
            deduction = parseFloat(cleanLess) || 0;
          }

          const calculatedFinalRate = Math.max(0, nextItems[index].basePrice - deduction);
          const nextItem = {
            ...nextItems[index],
            less: value,
            finalUnitPrice: calculatedFinalRate,
            totalAmount: nextItems[index].qty * calculatedFinalRate
          };
          nextItems[index] = nextItem;
          return { ...prev, items: nextItem };
        });
      };

      const deleteBillLogEntry = async (id) => {

        }
      };

      // Exact user spreadsheet URL & CORS safe doPost implementation
      const saveLedgerTransactionToSheet = async (clientName, invoiceAmount) => {
        const sheetsScriptUrl = "https://script.google.com/macros/s/AKfycbzHDEi_3-0oaLvlPqM3tJdDcMLCdOvr3DNRdl-DDOcAJu_oCJrLCrukhRycnN6nBcwY/exec";
        try {

          const txnData = {

              amount: finalCleanAmount,
              date: billDate,
              type: "bill",
              remarks: "A4 Estimate Slip"

            customer: {

              joined: billDate,
              city: customerCity || "Local"
            }

          await fetch(sheetsScriptUrl, {
            method: "POST",
            mode: "no-cors",
            headers: {
              "Content-Type": "text/plain"
            },
            body: JSON.stringify(txnData)

        } catch (sheetsErr) {
          console.warn("Sheets API offline or unmapped:", sheetsErr);
          throw sheetsErr; // Propagate up to update Status Indicator correctly
        }
      };

      // SEZNIK 58MM BLUETOOTH PRINTER DIRECT PAIRING CONTROLLER
      const connectBluetoothPrinter = async () => {
        if (!navigator.bluetooth) {
          triggerNotification("BLE is not supported on this browser. Please use Bluefy / WebBLE app on iOS.");
          return;
        }
        setBleStatus("Connecting...");
        try {
          const device = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: [
              "000018f0-0000-1000-8000-00805f9b34fb", // Generic POS ESC/POS Service
              "0000e7e1-0000-1000-8000-00805f9b34fb",  // Specialty serial write services
              "49535343-fe7d-41aa-8a5c-724100000000"   // ISSC SPP service
            ]
          });
          const server = await device.gatt.connect();
          
          let service;
          const serviceUUIDs = [
            "000018f0-0000-1000-8000-00805f9b34fb",
            "0000e7e1-0000-1000-8000-00805f9b34fb",
            "49535343-fe7d-41aa-8a5c-724100000000"
          ];
          
          for (const uuid of serviceUUIDs) {
            try {
              service = await server.getPrimaryService(uuid);
              if (service) break;
            } catch (e) {
              // try next
            }
          }

          if (!service) {
            throw new Error("Could not find printer primary service UUID.");
          }

          const characteristics = await service.getCharacteristics();
          const writer = characteristics.find(c => c.properties.write || c.properties.writeWithoutResponse);

          if (!writer) {
            throw new Error("Write characteristic not found on Seznik printer profile");
          }

          setBleDevice(device);
          setBleCharacteristic(writer);
          setBleStatus("Connected to Seznik");
          triggerNotification("Connected directly to Seznik 58mm BLE Printer!");
        } catch (err) {
          console.error(err);
          setBleStatus("Disconnected");
          triggerNotification("Connection failed. OTG / BLE check required.");
        }
      };

      // Send ESC/POS commands over BLE to Seznik 58mm printer
      const printBLEThermalDirectly = async (itemsList, custName, cityVal, activeDate) => {
        if (!bleCharacteristic) return;

        const encoder = new TextEncoder();
        let escpos = [];

        // ESC/POS Initialization (ESC @)
        escpos.push(0x1B, 0x40);
        // Center text alignment (ESC a 1)
        escpos.push(0x1B, 0x61, 0x01);
        
        // Bold title
        escpos.push(0x1B, 0x45, 0x01);
        escpos.push(...encoder.encode("ESTIMATE RECEIPT\n"));
        escpos.push(0x1B, 0x45, 0x00);
        
        escpos.push(...encoder.encode("Rough Statement Profile\n"));
        escpos.push(...encoder.encode("--------------------------------\n"));
        
        // Meta Customer Identifiers (Left align ESC a 0)
        escpos.push(0x1B, 0x61, 0x00);
        const custCode = getThreeLetterCode(custName);
        const cityCode = getThreeLetterCode(cityVal);
        escpos.push(...encoder.encode(`${custCode} (${cityCode}) - ${activeDate}\n`));
        escpos.push(...encoder.encode("--------------------------------\n"));
        
        // Exact 4 Column Table format fit for 58mm rolls (32 character limit)
        // Format layout: QT ITEM            P   AMT
        escpos.push(...encoder.encode("QT ITEM            P     AMT\n"));
        escpos.push(...encoder.encode("--------------------------------\n"));

        itemsList.forEach(item => {
          const cleanCode = (item.code && item.code !== "—") ? item.code.trim() : "";
          const namePart = item.name.trim().toUpperCase().slice(0, 15);
          const qtyPart = String(Math.round(item.qty)).padEnd(2);
          const pricePart = String(Math.round(item.finalUnitPrice)).padStart(4);
          const amtPart = String(Math.round(item.totalAmount)).padStart(5);
          
          escpos.push(...encoder.encode(`${qtyPart} ${namePart.padEnd(14)} ${pricePart} ${amtPart}\n`));
          // Draw code on next line indented slightly under item name (only if code contains actual suffix)
          if (cleanCode && cleanCode !== "—") {
            escpos.push(...encoder.encode(`   ${cleanCode.toUpperCase()}\n`));
          }
        });

        escpos.push(...encoder.encode("--------------------------------\n"));
        const finalGrossRounded = Math.round(itemsList.reduce((acc, i) => acc + (i.totalAmount || 0), 0));
        escpos.push(...encoder.encode(`Gross Aggregation:       ${finalGrossRounded}\n`));
        escpos.push(...encoder.encode(`Net Liability:           ${finalGrossRounded}\n`));
        escpos.push(...encoder.encode("--------------------------------\n"));
        escpos.push(0x1B, 0x61, 0x01);
        escpos.push(...encoder.encode("Thanks for visiting!\n\n\n\n"));

        // Cut Command (GS V 66 0)
        escpos.push(0x1D, 0x56, 0x42, 0x00);

        // MTU safe BLE stream write operations
        const uint8Array = new Uint8Array(escpos);
        const chunkSize = 20;
        for (let i = 0; i < uint8Array.length; i += chunkSize) {
          const chunk = uint8Array.slice(i, i + chunkSize);
          await bleCharacteristic.writeValue(chunk);
        }
      };

      // Dynamic share pipeline - Sharing PDF Receipts (No image backup share needed)
      const shareReceiptPDFDirectly = (itemsList, custName, cityVal, activeDate) => {
        const originalElement = document.getElementById('printable-bill-invoice');
        if (!originalElement) return;

        const originalDisplayStyle = originalElement.style.display;
        originalElement.style.display = 'block';

        const custCode = getThreeLetterCode(custName);
        const opt = {
          margin:       [5, 5, 5, 5],
          filename:     `Receipt_${custCode || 'WalkIn'}_${activeDate}.pdf`,
          image:        { type: 'jpeg', quality: 0.98 },
          html2canvas:  { scale: 2, useCORS: true, letterRendering: true },
          jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(originalElement).toPdf().output('blob').then(async (pdfBlob) => {
          originalElement.style.display = originalDisplayStyle; // restore
          
          const shareFile = new File([pdfBlob], `Receipt_${custCode || 'WalkIn'}_${activeDate}.pdf`, { type: 'application/pdf' });
          
          try {
            if (navigator.canShare && navigator.canShare({ files: [shareFile] })) {
              await navigator.share({
                files: [shareFile],
                title: 'Estimate Receipt',
                text: `Estimate slip for ${custName || 'Walk-In Customer'}`
              });
              triggerNotification("Shared successfully!");

              throw new Error("Native A4 PDF sharing is unsupported on Safari Chrome webview");

            console.warn("Share fallback downloading:", shareErr);
            try {
              const link = document.createElement("a");
              link.href = URL.createObjectURL(pdfBlob);
              link.download = `Receipt_${custCode || 'WalkIn'}_${activeDate}.pdf`;
              link.click();
              triggerNotification("Downloaded PDF receipt successfully!");
            } catch (dlErr) {
              console.error("Direct fallback download failed:", dlErr);
            }

          triggerNotification("Error compiling PDF receipt.");
        });
      };

      const parserAutocompleteQuery = getParserAutocompleteQuery();
      const parserSuggestions = parserAutocompleteQuery ? filteredProductsForBilling(parserAutocompleteQuery) : [];

      // DYNAMIC CALCULATION STOPS WHITE-SCREEN REFERENCE ERRORS
      const grossCalculatedSum = baggedItems.reduce((acc, i) => acc + (i.totalAmount || 0), 0);

      // PASSWORD-FREE LAST 2 LOGS FILTER METHOD
      const getFilteredLogBills = () => {
        if (isVerified) return cloudBills;
        return cloudBills.slice(0, 2); // Show last 2 logs without access code
      };

      return (
        <div className="h-screen w-full flex flex-col bg-stone-100 overflow-hidden relative">
          
          {/* Top Logo / App Brand Header */}

            <div className="max-w-md mx-auto flex justify-between items-center">

                <h1 className="text-sm font-bold tracking-tight text-white uppercase flex items-center gap-1.5 font-sans">
                  <i className="fa-solid fa-receipt text-amber-500"></i> Rough Bill Studio
                </h1>
                <p className="text-[9px] text-stone-400 font-mono leading-none font-sans font-semibold">Continuous Terminal Control</p>
              </div>
            </div>
          </header>

          {notification && (
            <div className="bg-amber-500 text-stone-950 py-1.5 px-3 text-center text-[10px] font-extrabold border-b border-amber-600 animate-pulse no-print flex-shrink-0">
              <i className="fa-solid fa-circle-info mr-1 font-sans"></i> {notification}
            </div>
          )}

          {/* Primary Mobile Workspace Frame */}
          <main className="flex-grow flex-1 min-h-0 max-w-md w-full mx-auto p-2 flex flex-col gap-2 overflow-hidden bg-stone-50 no-print">
            
            {/* Tab 1: New Bill */}
            {currentTab === "bill" && (
              <div className="flex-grow flex flex-col gap-2 overflow-hidden">
                
                {/* Scrollable controls panel */}
                <div className="flex-grow overflow-y-auto custom-scroll space-y-2 pb-2 pr-1">
                  
                  {editingBillId && (
                    <div className="flex justify-between items-center bg-amber-50 border border-amber-200 rounded-lg p-2 text-xs text-amber-800 no-print">
                      <span className="font-semibold flex items-center gap-1"><i className="fa-solid fa-pen-to-square font-sans"></i> Live Log Edit Mode</span>
                      <button type="button" onClick={handleResetAll} className="px-2 py-0.5 bg-white border border-amber-300 rounded font-bold text-amber-900 text-[10px] font-sans font-semibold font-sans">Cancel</button>
                    </div>
                  )}

                  {/* Customer and Discount Configuration Card */}
                  <div className="bg-white p-3 rounded-xl border border-stone-200 shadow-sm space-y-2.5 no-print font-sans">
                    <div className="grid grid-cols-12 gap-2">
                      <div className="col-span-6 relative" ref={custRef}>
                        <label className="block text-[9px] font-extrabold text-stone-400 uppercase tracking-wide mb-0.5 font-sans">Customer Name (Optional)</label>

                        {showCustSuggestions && dbCustomers.length > 0 && (

                              <div key={i} onMouseDown={() => { setCustomerName(c.name); setCustomerCity(c.city); setShowCustSuggestions(false); syncCustomerProfile(c.name, c.city); }} className="px-3 py-2 text-xs hover:bg-stone-100 cursor-pointer flex justify-between items-center font-bold font-sans">
                                <span>{c.name}</span>
                                {c.city && <span className="text-[9px] bg-stone-100 text-stone-600 px-1.5 rounded-full font-mono">{c.city}</span>}
                              </div>
                            ))}
                          </div>
                        )}
                      </div>

                      <div className="col-span-3">
                        <label className="block text-[9px] font-extrabold text-stone-400 uppercase tracking-wide mb-0.5 font-sans font-semibold">x Discount (%)</label>
                        <input 
                          type="number" 
                          min="0" max="99"
                          placeholder="0"

                        />
                      </div>

                      <div className="col-span-3">
                        <label className="block text-[9px] font-extrabold text-stone-400 uppercase tracking-wide mb-0.5 font-sans font-sans font-semibold">Date</label>
                        <input type="date" value={billDate} onChange={(e) => setBillDate(e.target.value)} className="w-full px-2 py-2 text-xs bg-stone-50 border border-stone-200 rounded-lg font-mono font-semibold" />
                      </div>
                    </div>

                    {/* New Customer Save block */}
                    {pendingDiscountPrompt && (
                      <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-stone-800 space-y-1.5 animate-fadeIn">

                          <i className="fa-solid fa-user-plus text-sm animate-none"></i> Customer Configuration
                        </div>

                        <div className="flex gap-2">

                            type="number" 
                            id="new-customer-x" 
                            placeholder="e.g. 15"

                            onKeyDown={(e) => { if (e.key === 'Enter') handleSaveNewCustomerDiscount(e.target.value); }}
                          />
                          <button 
                            type="button" 
                            onClick={() => {
                              const val = document.getElementById('new-customer-x')?.value;
                              handleSaveNewCustomerDiscount(val);
                            }} 
                            className="px-3 py-1 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-lg text-xs font-sans font-semibold"
                          >
                            Save Client
                          </button>
                        </div>

                            <span className="text-[9px] bg-stone-100 text-stone-500 px-2 py-0.5 ml-2 rounded-full font-mono font-bold font-semibold font-sans font-sans font-semibold">{p.category || "General"}</span>
                          </div>
                          <button type="button" onClick={() => handleProductDelete(p.id)} className="text-stone-300 hover:text-rose-600 p-1 font-sans"><i className="fa-solid fa-trash-can font-sans font-sans font-semibold"></i></button>
                        </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* Tab 4: Historical Logs & Admin Console */}
            {currentTab === "logs" && (
              <div className="flex-grow flex flex-col gap-3 overflow-hidden font-sans font-bold font-semibold font-sans font-semibold font-sans font-semibold">
                <div className="bg-white rounded-xl border border-stone-200 shadow-sm p-4 space-y-3 overflow-y-auto custom-scroll flex-grow font-sans font-semibold font-sans font-semibold">
                  <h2 className="text-xs font-bold text-stone-900 uppercase tracking-widest flex items-center gap-1.5 font-sans font-bold font-sans font-sans font-semibold"><i className="fa-solid fa-history text-stone-500 font-sans font-sans font-sans font-semibold"></i> Protected Historic Index</h2>

                  {/* Public list showing Last 2 Logs without passcode protection */}
                  <div className="space-y-2 font-sans font-semibold font-sans font-semibold">
                    <span className="block text-[10px] text-stone-400 uppercase tracking-wider font-semibold font-sans font-sans font-semibold">Log History Manifest</span>
                    
                    <div className="space-y-2 max-h-80 overflow-y-auto custom-scroll font-sans font-semibold font-bold font-sans font-semibold font-semibold">
                      {getFilteredLogBills().map((b) => (
                        <div key={b.id} className="border border-stone-100 rounded-xl p-3 hover:bg-stone-50 text-xs bg-stone-50 space-y-2 font-sans font-semibold font-semibold font-bold animate-fadeIn">
                          <div className="flex justify-between font-bold font-sans font-sans font-bold font-sans font-semibold font-semibold animate-none">
                            <div>
                              <span className="text-stone-900 text-sm font-black font-sans font-sans font-bold font-sans font-semibold font-semibold">{b.customerName}</span>
                              {b.customerCity && <span className="text-[9px] bg-stone-200 text-stone-600 px-1.5 py-0.5 ml-2 rounded-full font-mono font-bold font-semibold font-bold font-sans font-semibold font-sans font-semibold font-sans font-semibold">{b.customerCity}</span>}
                            </div>
                            <span className="font-mono text-stone-800 font-extrabold text-sm font-bold font-sans font-semibold font-semibold font-semibold">{Math.round(b.totalAmount || 0)}</span>
                          </div>
                          
                          <div className="flex justify-between items-center text-[10px] text-stone-400 border-t pt-1.5 font-sans font-sans font-sans font-semibold font-sans font-semibold font-sans font-semibold">
                            <span>Date: {b.date}</span>
                            <div className="flex gap-2 font-sans font-semibold font-bold font-sans font-semibold">
                              <button type="button" onClick={() => handleLoadHistoricalBill(b)} className="px-2 py-1 bg-stone-900 text-white rounded font-bold text-[9px] font-sans font-sans font-bold font-semibold">Load Manifest</button>
                              {isVerified && (
                                <>
                                  <button type="button" onClick={() => openLogEditor(b)} className="px-2 py-1 bg-amber-600 text-white rounded font-bold text-[9px] font-sans font-sans font-sans font-bold"><i className="fa-solid fa-pen-to-square font-sans font-bold font-sans font-semibold font-semibold"></i> Edit</button>
                                  <button type="button" onClick={() => deleteBillLogEntry(b.id)} className="px-2 py-1 bg-rose-600 text-white rounded font-bold text-[9px] font-sans font-sans font-sans font-bold"><i className="fa-solid fa-trash-can font-sans font-bold font-sans font-semibold font-semibold"></i> Delete</button>
                                </>
                              )}
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {!isVerified && (
                    <div className="space-y-2 animate-fadeIn font-sans border-t border-stone-200 pt-3 mt-1 text-center font-bold">
                      <p className="text-[10px] text-stone-500 font-bold font-sans font-sans font-semibold font-semibold">Older logs are locked. Enter access key to view full index:</p>
                      <input 
                        type="password" 
                        placeholder="Access Code..." 
                        value={passwordInput} 
                        onChange={e => handleTabVerificationInput(e.target.value)}
                        className="w-full max-w-[160px] mx-auto text-center px-3 py-1.5 text-xs border bg-stone-50 rounded-lg font-mono focus:outline-none focus:border-stone-800 font-bold font-semibold font-semibold"
                      />
                    </div>
                  )}

                  {isVerified && editingLogBill && (
                    <div className="bg-stone-50 border-2 border-amber-300 rounded-xl p-3 space-y-3 animate-fadeIn font-sans font-bold font-sans font-semibold font-bold font-sans font-semibold font-sans font-semibold">
                      <div className="flex justify-between items-center border-b pb-1 font-sans font-bold font-semibold font-semibold">
                        <span className="text-xs font-bold text-amber-800 font-sans font-bold">Edit Manifest File: {editingLogBill.customerName}</span>
                        <button type="button" onClick={() => setEditingLogBill(null)} className="text-[10px] text-stone-500 font-bold underline font-sans font-sans font-sans font-semibold">Cancel</button>
                      </div>

                      <div className="space-y-2 font-sans font-sans font-sans font-bold font-semibold font-semibold font-semibold font-sans">
                        <div className="grid grid-cols-2 gap-2 font-sans font-semibold font-bold font-sans font-semibold font-sans font-semibold">
                          <div>
                            <label className="text-[8px] font-bold uppercase block font-sans font-sans font-sans font-bold font-semibold font-semibold font-bold font-semibold">Customer</label>
                            <input 
                              type="text" 
                              value={editingLogBill.customerName} 
                              onChange={e => setEditingLogBill({...editingLogBill, customerName: e.target.value})}
                              className="w-full p-1 text-xs border bg-white rounded font-sans font-bold font-semibold font-bold font-sans font-semibold font-bold font-semibold"
                            />
                          </div>
                          <div>
                            <label className="text-[8px] font-bold uppercase block font-sans font-sans font-sans font-sans font-bold font-semibold font-semibold font-semibold font-sans font-semibold">City</label>
                            <input 
                              type="text" 
                              value={editingLogBill.customerCity} 
                              onChange={e => setEditingLogBill({...editingLogBill, customerCity: e.target.value})}
                              className="w-full p-1 text-xs border bg-white rounded font-sans font-sans font-bold font-semibold font-bold font-sans font-semibold font-semibold font-sans font-semibold"
                            />
                          </div>
                        </div>

                        <div className="space-y-1.5 border-t pt-2 mt-2 font-sans font-bold font-sans font-semibold font-sans font-semibold">
                          <span className="block text-[8px] font-bold uppercase text-stone-400 font-sans font-sans font-sans font-sans font-bold font-semibold font-semibold font-semibold">Bill Items</span>
                          {(editingLogBill.items || []).map((item, idx) => (
                            <div key={idx} className="flex gap-1.5 items-center bg-white p-1.5 rounded border border-stone-200 text-xs font-sans font-sans font-semibold font-semibold">
                              <span className="font-bold flex-1 uppercase truncate font-semibold font-bold font-sans font-sans font-semibold font-sans font-semibold">{item.name}</span>
                              
                              <input 
                                type="number" 
                                value={item.qty} 
                                onChange={e => handleLogItemQtyChange(idx, e.target.value)}
                                className="w-12 p-0.5 text-center border font-mono font-semibold font-sans font-bold font-sans font-semibold font-sans font-semibold"
                                title="Edit Quantity"
                              />
                              <input 
                                type="text" 
                                placeholder="Less" 
                                value={item.less === "—" ? "" : item.less} 
                                onChange={e => handleLogItemLessChange(idx, e.target.value)}
                                className="w-12 p-0.5 text-center border font-mono font-semibold font-sans font-bold font-sans font-semibold font-sans font-semibold"
                                title="Edit Less"
                              />
                              <span className="font-mono font-bold text-stone-700 w-16 text-right font-sans font-bold font-semibold font-bold font-sans font-semibold font-sans font-semibold">{item.totalAmount ? Math.round(item.totalAmount) : "0"}</span>
                              
                              <button type="button" onClick={() => handleRemoveLogItem(idx)} className="text-rose-500 p-0.5 font-sans font-semibold font-sans font-semibold font-sans font-semibold">
                                <i className="fa-solid fa-xmark text-xs font-sans font-sans font-sans font-sans font-semibold"></i>
                              </button>
                            </div>
                          ))}
                        </div>

                        <button 
                          type="button"
                          onClick={handleSaveLogEdits}
                          className="w-full py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg text-xs font-sans font-bold font-semibold font-bold font-sans font-semibold font-sans font-semibold font-sans font-semibold"
                        >
                          Save Manifest Changes
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            )}
          </main>

          {/* Sticky App-Style Tab Navigation Bar (Anchored at bottom for thumb-access) */}
          <footer className="bg-stone-900 border-t border-stone-800 py-2 px-4 no-print flex-shrink-0 z-40 shadow-lg font-sans font-bold font-sans font-semibold font-semibold">
            <div className="max-w-md mx-auto flex justify-around items-center font-sans font-bold font-semibold font-semibold">
              <button 
                type="button"
                onClick={() => setCurrentTab("bill")} 
                className={`flex flex-col items-center gap-1 py-1 px-3 transition-colors ${currentTab === "bill" ? "text-amber-400 font-bold" : "text-stone-400 hover:text-stone-200"}`}
              >
                <i className="fa-solid fa-receipt text-base font-sans font-sans font-semibold font-semibold"></i>
                <span className="text-[9px] uppercase tracking-wider font-sans font-semibold">New Bill</span>
              </button>
              
              <button 
                type="button"
                onClick={() => setCurrentTab("bag")} 
                className={`flex flex-col items-center gap-1 py-1 px-3 transition-colors relative ${currentTab === "bag" ? "text-amber-400 font-bold" : "text-stone-400 hover:text-stone-200"}`}
              >
                <i className="fa-solid fa-bag-shopping text-base font-sans font-semibold"></i>
                <span className="text-[9px] uppercase tracking-wider font-sans font-bold font-semibold font-semibold">Bag</span>
                {baggedItems.length > 0 && (
                  <span className="absolute -top-1 right-2.5 bg-rose-600 text-white text-[9px] font-black h-4 w-4 rounded-full flex items-center justify-center animate-bounce font-sans font-bold font-semibold font-bold font-sans font-semibold font-semibold">
                    {baggedItems.length}
                  </span>
                )}
              </button>
              
              <button 
                type="button"
                onClick={() => setCurrentTab("products")} 
                className={`flex flex-col items-center gap-1 py-1 px-3 transition-colors ${currentTab === "products" ? "text-amber-400 font-bold" : "text-stone-400 hover:text-stone-200"}`}
              >
                <i className="fa-solid fa-box-open text-base font-sans font-sans font-semibold font-semibold"></i>
                <span className="text-[9px] uppercase tracking-wider font-sans font-bold font-sans font-semibold font-semibold">Catalog</span>
              </button>
              
              <button 
                type="button"
                onClick={() => setCurrentTab("logs")} 
                className={`flex flex-col items-center gap-1 py-1 px-3 transition-colors ${currentTab === "logs" ? "text-amber-400 font-bold" : "text-stone-400 hover:text-stone-200"}`}
              >
                <i className="fa-solid fa-clock-rotate-left text-base font-sans font-sans font-semibold font-semibold font-semibold"></i>
                <span className="text-[9px] uppercase tracking-wider font-sans font-sans font-semibold font-bold font-sans font-semibold font-sans font-semibold font-semibold">Logs</span>
              </button>
            </div>
          </footer>

          {/* Ultimate Clean End-to-End A4 printable Receipt layout (3x Font magnified, Minimum spacing columns) */}
          <div id="printable-bill-invoice" className="p-1 text-black font-mono text-[36px] font-black leading-normal">
            <div className="text-center pb-2.5 mb-2.5 border-b-4 border-black font-sans">
              <h2 className="text-[44px] font-black uppercase tracking-wider" style={{ fontFamily: "'Courier Prime', monospace" }}>ESTIMATE RECEIPT</h2>
              <p className="text-[24px] font-extrabold" style={{ fontFamily: "'Courier Prime', monospace" }}>Rough Statement Profile</p>
              
              <div className="mt-2.5 text-center text-[28px] font-black border-y-4 border-dashed border-black py-2" style={{ fontFamily: "'Courier Prime', monospace" }}>
                {getThreeLetterCode(customerName)} ({getThreeLetterCode(customerCity)}) - {billDate}
              </div>
            </div>
            
            {/* Exactly 4 Columns: QT | ITEM | P | AMT (Code is written on a new line below item name with exactly a single space) */}
            <table className="w-full text-left mt-2.5 border-collapse text-[36px] font-black" style={{ fontFamily: "'Courier Prime', monospace" }}>
              <thead>
                <tr className="border-b-4 border-black text-[30px] font-black uppercase">
                  <th className="py-2.5 w-16 text-center">QT</th>
                  <th className="py-2.5 pl-1">ITEM</th>
                  <th className="py-2.5 text-right w-36 font-bold">P</th>
                  <th className="py-2.5 text-right w-44 font-bold">AMT</th>
                </tr>
              </thead>
              <tbody className="divide-y-2 divide-stone-300">
                {generatedItems.map((item, idx) => {
                  const cleanCode = (item.code && item.code !== "—") ? item.code.trim() : "";
                  return (
                    <tr key={idx} className="align-top font-black text-[34px]">
                      <td className="py-2.5 text-center font-mono">{Math.round(item.qty)}</td>
                      <td className="py-2.5 font-black uppercase whitespace-pre-wrap break-all pl-1 leading-tight">
                        <div>{item.name.trim().toUpperCase()}</div>
                        {cleanCode && (
                          <div className="text-[30px] text-stone-700 font-mono mt-1 font-bold">
                            {" " + cleanCode.toUpperCase()}
                          </div>
                        )}
                      </td>
                      <td className="py-2.5 text-right font-mono">{Math.round(item.finalUnitPrice)}</td>
                      <td className="py-2.5 text-right font-mono font-black">{Math.round(item.totalAmount)}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
            
            <div className="mt-6 pt-3 border-t-4 border-dashed border-black text-right space-y-2 text-[32px] font-black font-sans" style={{ fontFamily: "'Courier Prime', monospace" }}>
              <div className="flex justify-between font-extrabold">
                <span>Gross Aggregation:</span>
                <span>{Math.round(generatedItems.reduce((acc, i) => acc + (i.totalAmount || 0), 0))}</span>
              </div>
              <div className="flex justify-between text-[42px] font-black border-t-4 border-black pt-3">
                <span>Net Liability:</span>
                <span>{Math.round(generatedItems.reduce((acc, i) => acc + (i.totalAmount || 0), 0))}</span>
              </div>
            </div>

            {/* Centered thanks message on printout */}
            <div className="mt-14 text-center text-[34px] font-bold pt-6 border-t-4 border-black" style={{ fontFamily: "'Courier Prime', monospace" }}>
              Thanks for visiting!
            </div>
          </div>

          {/* New Bill Confirmation Modal */}
          {showNewBillModal && (
            <div className="absolute inset-0 bg-stone-900/80 z-50 flex items-center justify-center p-4 font-sans font-bold font-semibold">
              <div className="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-xl border border-stone-200 animate-fadeIn">
                <div className="text-stone-900 font-bold text-sm flex items-center gap-1.5 font-sans">
                  <i className="fa-solid fa-circle-exclamation text-rose-500 text-lg font-sans"></i> Reset Draft?
                </div>
                <p className="text-xs text-stone-600 font-sans font-semibold font-sans">Are you sure you want to initialize a new bill? Staged and Bagged entries will be discarded.</p>
                <div className="flex gap-2.5 justify-end font-sans">
                  <button type="button" onClick={() => setShowNewBillModal(false)} className="px-4 py-2 bg-stone-100 hover:bg-stone-200 text-stone-800 rounded-lg text-xs font-bold font-sans font-semibold">Cancel</button>
                  <button type="button" onClick={() => { handleResetAll(); setShowNewBillModal(false); }} className="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-lg text-xs font-bold font-sans font-semibold font-sans font-semibold">Confirm Reset</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
