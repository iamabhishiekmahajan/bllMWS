<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rough Bill Generator Sheets Pro</title>
  
  <!-- CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['Courier Prime', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    html, body {
      position: fixed;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #f5f5f4;
      margin: 0;
      padding: 0;
    }
    #printable-bill-invoice { display: none; }
    @media print {
      @page {
        size: A4;
        margin: 5mm 2mm 5mm 2mm !important;
      }
      html, body {
        position: relative !important;
        width: 210mm !important;
        height: auto !important;
        overflow: visible !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #fff !important;
        color: #000 !important;
        font-family: 'Courier Prime', monospace !important;
        -webkit-print-color-adjust: exact;
      }
      body * { visibility: hidden !important; }
      #printable-bill-invoice, #printable-bill-invoice * { visibility: visible !important; }
      #printable-bill-invoice {
        display: block !important;
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 206mm !important;
        height: auto !important;
        overflow: visible !important;
        margin: 0 !important;
        padding: 2mm 0mm !important;
        box-sizing: border-box !important;
      }
    }
    .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
    .custom-scroll::-webkit-scrollbar-track { background: #e7e5e4; border-radius: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #a8a29e; border-radius: 4px; }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    @keyframes slideInUp {
      from { transform: translateY(12px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-slide-up { animation: slideInUp 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>
<body class="text-stone-900 font-sans antialiased selection:bg-stone-300 bg-stone-100">
  <div id="root" class="h-[100dvh] w-full flex flex-col overflow-hidden"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const DEFAULT_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx8CKL5noduGGl416gC_QhZZ8Sda3iDOsmz8z3rihcmJR2PPSkxAoua8DdIs57vx1L3/exec";

    function App() {
      const [scriptUrl, setScriptUrl] = useState(() => localStorage.getItem("rough_bill_script_url") || DEFAULT_SCRIPT_URL);
      const [currentTab, setCurrentTab] = useState("bill");
      const [customerName, setCustomerName] = useState("");
      const [customerCity, setCustomerCity] = useState("");
      const [billDate, setBillDate] = useState(new Date().toISOString().split('T')[0]);
      const [discountX, setDiscountX] = useState("0"); 
      const [qty, setQty] = useState("1");
      const [productSearch, setProductSearch] = useState("");
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [code, setCode] = useState("");
      const [price, setPrice] = useState("");
      const [less, setLess] = useState("");
      const [addedItems, setAddedItems] = useState([]);
      const [baggedItems, setBaggedItems] = useState([]);
      const [dbCustomers, setDbCustomers] = useState([]);
      const [cloudProducts, setCloudProducts] = useState([]);
      const [cloudBills, setCloudBills] = useState([]);
      const [showCustSuggestions, setShowCustSuggestions] = useState(false);
      const [showProdSuggestions, setShowProdSuggestions] = useState(false);
      const [editingBillId, setEditingBillId] = useState(null);
      const [isBillGenerated, setIsBillGenerated] = useState(false);
      const [generatedItems, setGeneratedItems] = useState([]);
      const [notification, setNotification] = useState("");
      const [parserInput, setParserInput] = useState("");
      const [lastProductName, setLastProductName] = useState("");
      const [showManualInputs, setShowManualInputs] = useState(false);
      const [showPreview, setShowPreview] = useState(false);
      const [saveStatus, setSaveStatus] = useState(0);
      const [newProdName, setNewProdNameState] = useState("");
      const [productFilterQuery, setProductFilterQuery] = useState("");
      const [isVerified, setIsVerified] = useState(false);
      const [passwordInput, setPasswordInput] = useState("");
      const [visibleLogPreviews, setVisibleLogPreviews] = useState({});
      const [selectedCatalogProduct, setSelectedCatalogProduct] = useState(null);
      const [mergeTargetSearch, setMergeTargetSearch] = useState("");
      const [showMergeSuggestions, setShowMergeTargetSuggestions] = useState(false);
      const [bleDevice, setBleDevice] = useState(null);
      const [bleCharacteristic, setBleCharacteristic] = useState(null);
      const [bleStatus, setBleStatus] = useState("Disconnected");
      const [globalBagLess, setGlobalBagLess] = useState("");
      const [newSheetUrlInput, setNewSheetUrlInput] = useState("");

      // Print Settings State
      const [printSettings, setPrintSettings] = useState(() => {
        const saved = localStorage.getItem("rough_bill_print_settings");
        return saved ? JSON.parse(saved) : {
          showCompanyHeader: true,
          showDate: true,
          showCustomerMeta: true,
          showFooterThankYou: true,
          fontSize: "38px",
          fontFamily: "Courier Prime",
          boldHeaders: true
        };
      });

      const custRef = useRef(null);
      const prodRef = useRef(null);
      const parserRef = useRef(null);

      useEffect(() => {
        localStorage.setItem("rough_bill_print_settings", JSON.stringify(printSettings));
      }, [printSettings]);

      useEffect(() => {
        localStorage.setItem("rough_bill_script_url", scriptUrl);
      }, [scriptUrl]);

      window.firebaseBridge = {
        connected: true,
        products: cloudProducts,
        bills: cloudBills,
        customers: dbCustomers,
        
        saveBillToCloudWithNumericId: async (numericId, bill, isEdit) => {
          const payload = {
            action: isEdit ? 'updateTxn' : 'addTxn',
            txn: {
              id: numericId,
              name: bill.customerName,
              amount: Math.round(bill.totalAmount),
              date: bill.date,
              type: "bill",
              remarks: ""
            },
            items: bill.items,
            customer: {
              name: bill.customerName,
              city: bill.customerCity || "Local",
              discount: bill.discountRate,
              joined: bill.date.split(" ")[0]
            }
          };

          await fetch(scriptUrl, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify(payload)
          });
          return { id: String(numericId) };
        },

        addProductToCloud: async (prod) => {
          const payload = {
            action: 'addProduct',
            name: prod.name
          };
          await fetch(scriptUrl, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify(payload)
          });
        },

        deleteProductFromCloud: async (name) => {
          const payload = {
            action: 'deleteProduct',
            name: name
          };
          await fetch(scriptUrl, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify(payload)
          });
        }
      };

      const syncDataFromGoogleSheets = () => {
        const callbackName = "handleSheetsSync_" + Math.floor(Math.random() * 100000);
        window[callbackName] = (data) => {
          if (data) {
            if (data.customers) {
              let parsedCustomers = [];
              if (Array.isArray(data.customers)) {
                parsedCustomers = data.customers;
              } else if (typeof data.customers === "object") {
                parsedCustomers = Object.entries(data.customers).map(([name, details]) => ({
                  name: name,
                  phone: details ? details.phone : "",
                  joined: details ? details.joined : "",
                  city: details ? (details.city || details.City || "Local") : "Local",
                  discount: details ? (details.discount || 0) : 0
                }));
              }
              setDbCustomers(parsedCustomers);
            }
            if (data.products) {
              // Ensure uniqueness
              const uniqueProds = [];
              const seenNames = new Set();
              (data.products || []).forEach(p => {
                if (p && p.name) {
                  const norm = p.name.toLowerCase().trim();
                  if (!seenNames.has(norm)) {
                    seenNames.add(norm);
                    uniqueProds.push(p);
                  }
                }
              });
              setCloudProducts(uniqueProds);
            }
            if (data.txns) {
              setCloudBills(data.txns);
            }
          }
          document.getElementById(callbackName)?.remove();
          delete window[callbackName];
        };

        const script = document.createElement("script");
        script.id = callbackName;
        script.src = `${scriptUrl}?action=getData&callback=${callbackName}`;
        document.body.appendChild(script);
      };

      useEffect(() => {
        syncDataFromGoogleSheets();
        const interval = setInterval(() => {
          syncDataFromGoogleSheets();
          if (bleDevice && !bleCharacteristic) {
            reconnectBLEPrinterQuietly();
          }
        }, 5000);
        return () => clearInterval(interval);
      }, [scriptUrl, bleDevice, bleCharacteristic]);

      useEffect(() => {
        if (currentTab === "bill" && custRef.current) {
          const input = custRef.current.querySelector('input');
          if (input) input.focus();
        }
      }, [currentTab]);

      const triggerNotification = (msg) => {
        setNotification(msg);
        setTimeout(() => setNotification(""), 3500);
      };

      const getThreeLetterCode = (val) => {
        if (!val) return "GEN";
        const cleaned = val.replace(/[^a-zA-Z]/g, "").toUpperCase();
        return cleaned.slice(0, 3) || "GEN";
      };

      const getNormalizedKey = (str) => str ? str.toLowerCase().trim().replace(/\s+/g, ' ') : "";
      const toTitleCase = (str) => str.replace(/\w\S*/g, (txt) => txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase());

      const formatInvoiceDateTime = (dateStr) => {
        const baseDate = dateStr ? new Date(dateStr) : new Date();
        const currentRealTime = new Date();
        baseDate.setHours(currentRealTime.getHours(), currentRealTime.getMinutes());
        const day = String(baseDate.getDate()).padStart(2, '0');
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        return `${day},${months[baseDate.getMonth()]} ${String(baseDate.getHours()).padStart(2, '0')}:${String(baseDate.getMinutes()).padStart(2, '0')}`;
      };

      const handleCustomerSearchAndSelect = (nameVal) => {
        const match = dbCustomers.find(c => c && c.name && c.name.toLowerCase().trim() === nameVal.toLowerCase().trim());
        if (match) {
          setCustomerName(match.name);
          setCustomerCity(match.city || "");
          setDiscountX(String(match.discount || 0));
          setShowCustSuggestions(false);
        } else {
          setCustomerName("");
          setCustomerCity("");
          setDiscountX("0");
          triggerNotification("Strict Match Alert: Please select a pre-registered Sheet profile.");
        }
      };

      const handleResetAll = () => {
        setCustomerName(""); setCustomerCity(""); setDiscountX("0");
        setQty("1"); setProductSearch(""); setSelectedProduct(null); setCode(""); setPrice(""); setLess("");
        setAddedItems([]); setBaggedItems([]); setGeneratedItems([]); setIsBillGenerated(false); setEditingBillId(null);
        setParserInput("");
        setSaveStatus(0);
        setGlobalBagLess("");
        setTimeout(() => {
          if (custRef.current) {
            const input = custRef.current.querySelector('input');
            if (input) input.focus();
          }
        }, 100);
      };

      const handleLoadHistoricalBill = (historicalBillObj) => {
        setCustomerName(historicalBillObj.customerName || "");
        setCustomerCity(historicalBillObj.customerCity || "");
        setDiscountX(String(historicalBillObj.discountRate || historicalBillObj.discount || 0));
        setBillDate(historicalBillObj.date || new Date().toISOString().split('T')[0]);
        setBaggedItems(historicalBillObj.items || []);
        setEditingBillId(String(historicalBillObj.id) || null);
        setCurrentTab("bag");
        triggerNotification("Loaded historical bill!");
      };

      const calculateRateForToken = (codeStr, rawX) => {
        const cleanCode = codeStr.toLowerCase().trim();
        const discountRate = parseFloat(rawX) || 0;
        if (cleanCode.endsWith('n')) {
          const val = parseFloat(cleanCode.slice(0, -1));
          return !isNaN(val) ? val * 5 : 0;
        }
        if (cleanCode.endsWith('no') || cleanCode.endsWith('nu')) {
          const val = parseFloat(cleanCode.replace(/(no|nu)$/, ''));
          if (!isNaN(val)) {
            const baseMultiplierPrice = val * 5;
            return baseMultiplierPrice - (baseMultiplierPrice * (discountRate / 100));
          }
          return 0;
        }
        return !isNaN(parseFloat(cleanCode)) ? parseFloat(cleanCode) : 0;
      };

      const handleParserSubmit = async (e) => {
        e.preventDefault();
        const rawInput = parserInput.trim();
        if (!rawInput) return;
        const match = rawInput.match(/^(\d+(?:\.\d+)?)\s+(.+)$/);
        if (!match) {
          triggerNotification("Format: Qty Item [Code] (e.g. 5 sehra 20n)");
          return;
        }
        const parsedQty = parseFloat(match[1]);
        const tokens = match[2].trim().split(/\s+/);
        if (tokens.length === 0) return;

        let codeValue = "—";
        let unitPrice = 0;
        let finalTokens = [...tokens];
        const lastToken = tokens[tokens.length - 1];
        const isSuffixCode = (str) => {
          const s = str.toLowerCase().trim();
          return s.endsWith('n') || s.endsWith('no') || s.endsWith('nu');
        };

        if (isSuffixCode(lastToken)) {
          codeValue = lastToken;
          unitPrice = calculateRateForToken(codeValue, discountX);
          finalTokens.pop();
        } else if (!isNaN(parseFloat(lastToken)) && isFinite(lastToken)) {
          codeValue = "—";
          unitPrice = parseFloat(lastToken);
          finalTokens.pop();
        }

        let rawProdName = finalTokens.join(" ").trim();
        if (!rawProdName) {
          rawProdName = lastProductName ? lastProductName : "Item";
        } else {
          setLastProductName(rawProdName);
        }

        const displayCasing = toTitleCase(rawProdName);
        
        // Auto-save product to cloud directory if unique
        const normalizedProdName = getNormalizedKey(displayCasing);
        const existsInCloud = cloudProducts.some(p => p && p.name && getNormalizedKey(p.name) === normalizedProdName);
        if (!existsInCloud) {
          try {
            await window.firebaseBridge.addProductToCloud({ name: displayCasing });
            setCloudProducts(prev => [...prev, { id: Date.now(), name: displayCasing }]);
          } catch(err) { console.error("Auto product sync fail", err); }
        }

        const itemObj = {
          id: Date.now() + Math.random(), qty: parsedQty, name: displayCasing, code: codeValue,
          basePrice: unitPrice, less: "—", finalUnitPrice: unitPrice, totalAmount: parsedQty * unitPrice
        };
        setAddedItems(prev => [itemObj, ...prev]);
        setParserInput(""); setSaveStatus(0);
        if (parserRef.current) parserRef.current.focus();
        triggerNotification("Staged!");
      };

      const handleEditStagedItem = (id, field, value) => {
        setAddedItems(prev => prev.map(item => {
          if (item.id === id) {
            const updated = { ...item };
            if (field === 'qty') updated.qty = parseFloat(value) || 0;
            if (field === 'name') updated.name = value;
            if (field === 'code') updated.code = value;
            if (field === 'basePrice') updated.basePrice = parseFloat(value) || 0;
            if (updated.code !== "—" && updated.code !== "") updated.basePrice = calculateRateForToken(updated.code, discountX);
            updated.finalUnitPrice = updated.basePrice;
            updated.totalAmount = updated.qty * updated.finalUnitPrice;
            return updated;
          }
          return item;
        }));
      };

      const handleTalliedCheck = (stagedItem) => {
        setAddedItems(prev => prev.filter(i => i.id !== stagedItem.id));
        setBaggedItems(prev => [...prev, { ...stagedItem }]);
        setSaveStatus(0);
        triggerNotification("Tallied!");
      };

      const handleEditBaggedItem = (id, field, value) => {
        setBaggedItems(prev => prev.map(item => {
          if (item.id === id) {
            const updated = { ...item };
            if (field === 'qty') updated.qty = parseFloat(value) || 0;
            if (field === 'name') updated.name = value;
            if (field === 'code') updated.code = value;
            if (field === 'basePrice') updated.basePrice = parseFloat(value) || 0;
            if (field === 'less') updated.less = value;

            if (updated.code !== "—" && updated.code !== "") updated.basePrice = calculateRateForToken(updated.code, discountX);

            let deduction = 0;
            const cleanLess = String(updated.less).trim();
            if (cleanLess !== "" && cleanLess !== "—") {
              deduction = parseFloat(cleanLess) || 0;
            }

            updated.finalUnitPrice = Math.max(0, updated.basePrice - deduction);
            updated.totalAmount = updated.qty * updated.finalUnitPrice;
            return updated;
          }
          return item;
        }));
      };

      const applyGlobalBagLessDiscount = (lessAmountStr) => {
        const amt = parseFloat(lessAmountStr) || 0;
        setBaggedItems(prev => prev.map(item => {
          const updated = { ...item, less: lessAmountStr };
          updated.finalUnitPrice = Math.max(0, updated.basePrice - amt);
          updated.totalAmount = updated.qty * updated.finalUnitPrice;
          return updated;
        }));
        triggerNotification(`Applied flat ₹${amt} discount to all items!`);
      };

      const applyGroupedLessToBagged = (productName, lessAmount) => {
        const amt = parseFloat(lessAmount) || 0;
        setBaggedItems(prev => prev.map(item => {
          if (getNormalizedKey(item.name) === getNormalizedKey(productName)) {
            const updated = { ...item, less: String(amt) };
            updated.finalUnitPrice = Math.max(0, updated.basePrice - amt);
            updated.totalAmount = updated.qty * updated.finalUnitPrice;
            return updated;
          }
          return item;
        }));
        triggerNotification(`Applied ₹${amt} Less to all "${productName}" items!`);
      };

      const renderReceiptForSpool = (itemsList, custName, cityVal, dateTimeStr) => {
        const sortedItems = [...itemsList].sort((a,b) => a.name.localeCompare(b.name));
        const total = itemsList.reduce((acc, i) => acc + i.totalAmount, 0);
        const { showCompanyHeader, showDate, showCustomerMeta, showFooterThankYou, fontSize, fontFamily, boldHeaders } = printSettings;
        
        let receiptHTML = `
          <div class="text-center pb-4 mb-4 border-b-8 border-black" style="font-family: '${fontFamily}', monospace;">
            ${showCompanyHeader ? `<h2 style="font-size: ${fontSize};" class="font-black uppercase tracking-widest leading-none">ESTIMATE RECEIPT</h2>
            <p style="font-size: calc(${fontSize} * 0.55);" class="font-black mt-1">Rough Statement Profile</p>` : ""}
            ${showCustomerMeta ? `<div class="mt-3.5 text-center font-black border-y-4 border-dashed border-black py-2.5" style="font-size: calc(${fontSize} * 0.65);">
              ${getThreeLetterCode(custName)} (${getThreeLetterCode(cityVal)}) ${showDate ? `- ${dateTimeStr}` : ""}
            </div>` : ""}
          </div>
          <table class="w-full text-left mt-4 border-collapse font-black" style="font-size: ${fontSize}; font-family: '${fontFamily}', monospace;">
            <thead>
              <tr class="border-b-8 border-black uppercase" style="font-size: calc(${fontSize} * 0.85); font-weight: ${boldHeaders ? '900' : '600'};">
                <th class="py-3.5 w-20 text-center">QT</th>
                <th class="py-3.5 pl-1">ITEM</th>
                <th class="py-3.5 text-right w-40">P</th>
                <th class="py-3.5 text-right w-48">AMT</th>
              </tr>
            </thead>
            <tbody>
        `;

        sortedItems.forEach((item, index) => {
          receiptHTML += `
            <tr class="align-top border-b-2 border-stone-250 py-7">
              <td class="py-4 text-center font-mono font-black" style="font-size: ${fontSize};">${Math.round(item.qty)}</td>
              <td class="py-4 font-black uppercase whitespace-pre-wrap break-all pl-1 leading-tight" style="font-size: ${fontSize};">
                <div class="font-black leading-tight">${item.name.trim().toUpperCase()}</div>
                ${item.code && item.code !== "—" ? `
                  <div style="font-size: calc(${fontSize} * 0.7);" class="text-stone-600 font-mono mt-0.5 font-medium tracking-wide leading-none">
                    ${item.code.toUpperCase()}
                  </div>
                ` : ""}
              </td>
              <td class="py-4 text-right font-mono font-black" style="font-size: ${fontSize};">${Math.round(item.finalUnitPrice)}</td>
              <td class="py-4 text-right font-mono font-black" style="font-size: ${fontSize};">${Math.round(item.totalAmount)}</td>
            </tr>
          `;

          if ((index + 1) % 5 === 0 && index !== sortedItems.length - 1) {
            receiptHTML += `
              <tr>
                <td colspan="4" class="py-2 border-b-4 border-dashed border-black"></td>
              </tr>
            `;
          }
        });

        receiptHTML += `
            </tbody>
          </table>
          <div class="mt-10 pt-5 border-t-8 border-dashed border-black text-right space-y-3 font-black" style="font-size: ${fontSize}; font-family: '${fontFamily}', monospace;">
            <div class="flex justify-between font-black">
              <span>Gross Liability:</span>
              <span>${Math.round(total)}</span>
            </div>
            <div class="flex justify-between font-black border-t-8 border-black pt-4 mt-1" style="font-size: calc(${fontSize} * 1.25);">
              <span>Net Total:</span>
              <span>${Math.round(total)}</span>
            </div>
          </div>
          ${showFooterThankYou ? `<div class="mt-16 text-center font-black pt-6 border-t-4 border-black" style="font-size: ${fontSize}; font-family: '${fontFamily}', monospace;">
            Thank You For Your Visit<br/>
            Please Visit Again
          </div>` : ""}
        `;

        return receiptHTML;
      };

      const handleGenerateAndPrintBill = async () => {
        if (baggedItems.length === 0) return;
        
        const synchronousIsEdit = !!editingBillId;
        const uniqueNumericId = editingBillId ? Number(editingBillId) : Date.now();
        
        if (!editingBillId) {
          setEditingBillId(String(uniqueNumericId));
        }

        setGeneratedItems(baggedItems);
        setIsBillGenerated(true);
        const printDateFormatted = formatInvoiceDateTime(billDate);

        if (!bleCharacteristic || bleStatus !== "Connected to Seznik") {
          triggerNotification("Warning: Bluetooth printer is not connected. Printing A4/System invoice only.");
        }

        const printBody = document.getElementById("printable-bill-invoice");
        if (printBody) {
          const finalClientName = customerName.trim() || "Walk-In Customer";
          printBody.innerHTML = renderReceiptForSpool(baggedItems, finalClientName, customerCity, printDateFormatted);
        }
        
        window.print();
        setSaveStatus(1);

        const finalClientName = customerName.trim() || "Walk-In Customer";
        const computedTotalSum = baggedItems.reduce((acc, i) => acc + i.totalAmount, 0);

        const billDataObject = {

        element.innerHTML = renderReceiptForSpool(items, custName, cityVal, printDateFormatted);
        
        const fileName = `Invoice_${getThreeLetterCode(custName)}_${activeDate}.pdf`;
        const options = {
          margin: [4, 4, 4, 4],
          filename: fileName,
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2 },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        triggerNotification("Generating PDF shareable receipt...");
        
        html2pdf().set(options).from(element).toPdf().output('blob').then(async (blob) => {
          const file = new File([blob], fileName, { type: 'application/pdf' });
          
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
              await navigator.share({
                files: [file],
                title: `Rough Bill - ${custName}`,
                text: `PDF Receipt for ${custName} (${cityVal})`

              triggerNotification("✓ Shared successfully!");
              return;
            } catch (shareErr) {
              console.warn("Share failed, falling back to direct download:", shareErr);
            }

          const link = document.createElement("a");
          link.href = URL.createObjectURL(blob);
          link.download = fileName;
          link.click();
          triggerNotification("✓ PDF downloaded!");

        if (!navigator.bluetooth) {
          triggerNotification("Web BLE is unsupported on this browser.");
          return;
        }
        setBleStatus("Scanning...");
        try {
          const device = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: ["000018f0-0000-1000-8000-00805f9b34fb", "0000e7e1-0000-1000-8000-00805f9b34fb"]
          });
          setBleStatus("Connecting...");
          const server = await device.gatt.connect();
          let service;
          try {
            service = await server.getPrimaryService("000018f0-0000-1000-8000-00805f9b34fb");
          } catch(e) {
            service = await server.getPrimaryService("0000e7e1-0000-1000-8000-00805f9b34fb");
          }
          const characteristics = await service.getCharacteristics();
          const writer = characteristics.find(c => c.properties.write || c.properties.writeWithoutResponse);
          setBleDevice(device);
          setBleCharacteristic(writer);
          setBleStatus("Connected to Seznik");
          triggerNotification("BLE Printer Connected!");
        } catch (err) {
          setBleStatus("Disconnected");
          triggerNotification("BLE connection failed.");
        }

        if (!trimmed) return "";
        const match = trimmed.match(/^(\d+(?:\.\d+)?)\s+(.*)$/);
        if (match) {
          const rest = match[2].trim();
          const tokens = rest.split(/\s+/);
          if (tokens.length > 0) {
            const lastToken = tokens[tokens.length - 1];
            if (lastToken.toLowerCase().endsWith('n') || lastToken.toLowerCase().endsWith('no') || lastToken.toLowerCase().endsWith('nu') || (!isNaN(parseFloat(lastToken)) && isFinite(lastToken))) {
              tokens.pop();
            }
          }
          return tokens.join(" ");
        }
        if (isNaN(parseFloat(trimmed.split(/\s+/)[0]))) return trimmed;
        return "";

      const printBLEThermalDirectly = async (itemsList, custName, cityVal, activeDate) => {
        if (!bleCharacteristic) return;
        const encoder = new TextEncoder();
        let esc = [];

        esc.push(0x1B, 0x40); // Init
        esc.push(0x1B, 0x61, 0x01); // Center
        if (printSettings.showCompanyHeader) {
          esc.push(...encoder.encode("ESTIMATE RECEIPT\n"));
        }
        if (printSettings.showCustomerMeta) {
          esc.push(...encoder.encode(`${custName.toUpperCase()} ${printSettings.showDate ? `- ${activeDate}` : ""}\n`));
        }
        esc.push(...encoder.encode("--------------------------------\n"));
        
        esc.push(0x1B, 0x61, 0x00); // Left align
        const sortedItems = [...itemsList].sort((a,b) => a.name.localeCompare(b.name));
        sortedItems.forEach(item => {
          const nameStr = item.name.trim().toUpperCase();
          const qStr = String(Math.round(item.qty)).padEnd(3);
          const pStr = String(Math.round(item.finalUnitPrice)).padStart(4);
          const totalStr = String(Math.round(item.totalAmount)).padStart(6);
          
          // Print item name in one line, and code in the next line only if code is present (e.g. 120n, 110no)
          esc.push(...encoder.encode(`${qStr} ${nameStr.slice(0, 15).padEnd(15)} ${pStr} ${totalStr}\n`));
          if (item.code && item.code !== "—" && item.code.trim() !== "") {
            esc.push(...encoder.encode(`    [Code: ${item.code.toUpperCase()}]\n`));
          }
        });

        esc.push(...encoder.encode("--------------------------------\n"));
        const sumTotal = Math.round(itemsList.reduce((acc, i) => acc + i.totalAmount, 0));
        esc.push(...encoder.encode(`TOTAL LIABILITY:         ${sumTotal}\n\n\n`));
        if (printSettings.showFooterThankYou) {
          esc.push(0x1B, 0x61, 0x01); // Center
          esc.push(...encoder.encode("Thank You For Your Visit\nPlease Visit Again\n\n\n"));
        }
        esc.push(0x1D, 0x56, 0x42, 0x00); // Cut

        const bytes = new Uint8Array(esc);
        for (let i = 0; i < bytes.length; i += 20) {
          await bleCharacteristic.writeValue(bytes.slice(i, i + 20));
        }
      };

          <div id="printable-bill-invoice"></div>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
