<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rough Bill Generator Sheets Pro</title>
  
  <!-- CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700;800;900&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],

            robotomono: ['Roboto Mono', 'monospace'],
          }

    }
  </script>
  <style>
    html, body {
      position: fixed;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #f5f5f4;
      margin: 0;
      padding: 0;
    }
    #printable-bill-invoice { display: none; }
    #image-export-container {
      position: absolute;
      left: -9999px;
      top: 0;
      width: 320px;
      background: #ffffff;
      color: #000000;
      padding: 12px;
      box-sizing: border-box;
      z-index: -50;
    }
    @media print {
      @page {
        size: A4;
        margin: 5mm 2mm 5mm 2mm !important;
      }
      html, body {
        position: relative !important;
        width: 210mm !important;
        height: auto !important;
        overflow: visible !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #fff !important;
        color: #000 !important;
        font-family: 'Courier Prime', monospace !important;
        -webkit-print-color-adjust: exact;
      }
      body * { visibility: hidden !important; }
      #printable-bill-invoice, #printable-bill-invoice * { visibility: visible !important; }
      #printable-bill-invoice {
        display: block !important;
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 206mm !important;
        height: auto !important;
        overflow: visible !important;
        margin: 0 !important;
        padding: 2mm 0mm !important;
        box-sizing: border-box !important;
      }
    }
    .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
    .custom-scroll::-webkit-scrollbar-track { background: #e7e5e4; border-radius: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #a8a29e; border-radius: 4px; }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    @keyframes slideInUp {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-slide-up { animation: slideInUp 0.18s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>
<body class="text-stone-900 font-sans antialiased selection:bg-stone-300 bg-stone-100">
  <div id="root" class="h-[100dvh] w-full flex flex-col overflow-hidden"></div>
  <div id="image-export-container"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const DEFAULT_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx8CKL5noduGGl416gC_QhZZ8Sda3iDOsmz8z3rihcmJR2PPSkxAoua8DdIs57vx1L3/exec";

    // Helper to safely parse items whether array or JSON string from Sheets
    const parseItemsSafely = (itemsData) => {
      if (!itemsData) return [];
      if (Array.isArray(itemsData)) return itemsData;
      if (typeof itemsData === 'string') {
        try {
          const parsed = JSON.parse(itemsData);
          return Array.isArray(parsed) ? parsed : [];
        } catch (e) {
          console.warn("Failed to parse items string:", e);
          return [];
        }
      }
      return [];
    };

    // Helper to extract item total safely and accurately
    const getItemTotalAmount = (item) => {
      if (item.totalAmount !== undefined && !isNaN(parseFloat(item.totalAmount)) && parseFloat(item.totalAmount) > 0) {
        return parseFloat(item.totalAmount);
      }
      if (item.amount !== undefined && !isNaN(parseFloat(item.amount)) && parseFloat(item.amount) > 0) {
        return parseFloat(item.amount);
      }
      const q = parseFloat(item.qty) || 1;
      const baseP = parseFloat(item.basePrice || item.rate || item.price || item.finalUnitPrice || 0);
      const lessP = parseFloat(item.less) || 0;
      const finalP = item.finalUnitPrice !== undefined && !isNaN(parseFloat(item.finalUnitPrice)) 
        ? parseFloat(item.finalUnitPrice) 
        : Math.max(0, baseP - lessP);
      return q * finalP;
    };

    // Persistent deleted product keys filter
    const getDeletedProductKeys = () => {
      try {
        return JSON.parse(localStorage.getItem("deletedProductKeys") || "[]");
      } catch (e) {
        return [];
      }
    };

    const addDeletedProductKey = (key) => {
      const current = getDeletedProductKeys();
      if (!current.includes(key)) {
        current.push(key);
        localStorage.setItem("deletedProductKeys", JSON.stringify(current));
      }
    };

    // IndexedDB Storage Engine
    const idbStorage = {
      dbPromise: null,
      init() {
        if (this.dbPromise) return this.dbPromise;
        this.dbPromise = new Promise((resolve, reject) => {
          const request = indexedDB.open("RoughBillDB", 3);
          request.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains("bills")) {
              db.createObjectStore("bills", { keyPath: "id" });
            }
            if (!db.objectStoreNames.contains("pendingSync")) {
              db.createObjectStore("pendingSync", { keyPath: "id" });
            }
            if (!db.objectStoreNames.contains("products")) {
              db.createObjectStore("products", { keyPath: "name" });
            }
            if (!db.objectStoreNames.contains("customers")) {
              db.createObjectStore("customers", { keyPath: "name" });
            }
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
        return this.dbPromise;
      },
      async saveBill(bill, isPending = false) {
        const db = await this.init();
        return new Promise((resolve) => {
          const tx = db.transaction(["bills", "pendingSync"], "readwrite");
          tx.objectStore("bills").put(bill);
          if (isPending) {
            tx.objectStore("pendingSync").put(bill);
          } else {
            tx.objectStore("pendingSync").delete(bill.id);
          }
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(false);
        });
      },
      async removeBill(id) {
        const db = await this.init();
        return new Promise((resolve) => {
          const tx = db.transaction(["bills", "pendingSync"], "readwrite");
          tx.objectStore("bills").delete(id);
          tx.objectStore("pendingSync").delete(id);
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(false);
        });
      },
      async getPending() {
        const db = await this.init();
        return new Promise((resolve) => {
          const tx = db.transaction("pendingSync", "readonly");
          const req = tx.objectStore("pendingSync").getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => resolve([]);
        });
      },
      async getAllBills() {
        const db = await this.init();
        return new Promise((resolve) => {
          const tx = db.transaction("bills", "readonly");
          const req = tx.objectStore("bills").getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => resolve([]);
        });
      },
      async cacheProducts(products) {
        if (!Array.isArray(products) || products.length === 0) return;
        const db = await this.init();
        const tx = db.transaction("products", "readwrite");
        const store = tx.objectStore("products");
        products.forEach(p => { if (p && p.name) store.put(p); });
      },
      async removeProduct(name) {
        const db = await this.init();
        const tx = db.transaction("products", "readwrite");
        tx.objectStore("products").delete(name);
      },
      async getProducts() {
        const db = await this.init();
        return new Promise((resolve) => {
          const tx = db.transaction("products", "readonly");
          const req = tx.objectStore("products").getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => resolve([]);
        });
      },
      async cacheCustomers(customers) {
        if (!Array.isArray(customers) || customers.length === 0) return;
        const db = await this.init();
        const tx = db.transaction("customers", "readwrite");
        const store = tx.objectStore("customers");
        customers.forEach(c => { if (c && c.name) store.put(c); });
      },
      async getCustomers() {
        const db = await this.init();
        return new Promise((resolve) => {
          const tx = db.transaction("customers", "readonly");
          const req = tx.objectStore("customers").getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => resolve([]);
        });
      }
    };

    window.firebaseBridge = {
      connected: true,
      products: [],
      bills: [],
      customers: [],
      
      saveBillToCloudWithNumericId: async (numericId, bill, isEdit, targetUrl = DEFAULT_SCRIPT_URL) => {
        const cleanItems = (bill.items || []).map(item => ({
          qty: parseFloat(item.qty) || 1,
          name: item.name || "Item",
          code: (item.code && item.code !== "—") ? item.code : "",
          basePrice: parseFloat(item.basePrice || item.rate || item.price || 0),
          less: String(item.less !== undefined && item.less !== null ? item.less : "0"),
          finalUnitPrice: parseFloat(item.finalUnitPrice || 0),
          totalAmount: getItemTotalAmount(item)
        }));

        const payload = {
          action: isEdit ? 'updateTxn' : 'addTxn',
          txn: {
            id: numericId,
            name: bill.customerName,
            amount: Math.round(bill.totalAmount),
            date: bill.date,
            type: "bill",
            remarks: ""
          },
          items: cleanItems,
          customer: {
            name: bill.customerName,
            city: bill.customerCity || "Local",
            discount: bill.discountRate,
            joined: bill.date.split(" ")[0]
          }
        };

        const localBillObj = {
          ...bill,
          items: cleanItems,
          localUpdatedAt: Date.now()
        };

        await idbStorage.saveBill(localBillObj, !navigator.onLine);

        if (!navigator.onLine) {
          throw new Error("Offline - Saved locally");
        }

        try {
          await fetch(targetUrl, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify(payload)
          });
          await idbStorage.saveBill(localBillObj, false);
        } catch (err) {
          await idbStorage.saveBill(localBillObj, true);
          throw err;
        }
        return { id: String(numericId) };
      },

      deleteTxnFromCloud: async (numericId, targetUrl = DEFAULT_SCRIPT_URL) => {
        await idbStorage.removeBill(numericId);
        const payload = {
          action: 'deleteTxn',
          id: numericId
        };
        try {
          await fetch(targetUrl, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify(payload)
          });
        } catch (e) {
          console.warn("Background bill delete error:", e);
        }
      },

      addProductToCloud: async (prod, targetUrl = DEFAULT_SCRIPT_URL) => {
        const payload = {
          action: 'addProduct',
          name: prod.name
        };
        try {
          await fetch(targetUrl, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify(payload)
          });
        } catch (e) {
          console.warn("Background product add error:", e);
        }
      },

      deleteProductFromCloud: async (name, targetUrl = DEFAULT_SCRIPT_URL) => {
        await idbStorage.removeProduct(name);
        const payload = {
          action: 'deleteProduct',
          name: name
        };
        try {
          await fetch(targetUrl, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify(payload)
          });
        } catch (e) {
          console.warn("Background product delete error:", e);
        }
      }
    };

    function App() {
      const [currentTab, setCurrentTab] = useState("bill");
      const [customerName, setCustomerName] = useState("");
      const [customerCity, setCustomerCity] = useState("");
      const [billDate, setBillDate] = useState(new Date().toISOString().split('T')[0]);
      
      // REQUIREMENT NO. 1: Default fill X% discount as 15
      const [discountX, setDiscountX] = useState("15"); 

      const [baggedItems, setBaggedItems] = useState([]);
      const [dbCustomers, setDbCustomers] = useState([]);
      const [cloudProducts, setCloudProducts] = useState([]);
      const [cloudBills, setCloudBills] = useState([]);
      const [showCustSuggestions, setShowCustSuggestions] = useState(false);
      const [editingBillId, setEditingBillId] = useState(null);
      const [notification, setNotification] = useState("");
      const [parserInput, setParserInput] = useState("");
      const [lastProductName, setLastProductName] = useState("");
      const [showPreview, setShowPreview] = useState(false);
      const [newProdName, setNewProdNameState] = useState("");
      const [productFilterQuery, setProductFilterQuery] = useState("");
      const [isVerified, setIsVerified] = useState(false);
      const [passwordInput, setPasswordInput] = useState("");
      const [visibleLogPreviews, setVisibleLogPreviews] = useState({});
      const [selectedCatalogProduct, setSelectedCatalogProduct] = useState(null);
      const [mergeTargetSearch, setMergeTargetSearch] = useState("");
      const [showMergeSuggestions, setShowMergeTargetSuggestions] = useState(false);
      const [bleDevice, setBleDevice] = useState(null);
      const [bleCharacteristic, setBleCharacteristic] = useState(null);
      const [bleStatus, setBleStatus] = useState("Disconnected");
      const [groupLessInputs, setGroupLessInputs] = useState({});
      const [billToDelete, setBillToDelete] = useState(null);

      // Offline Resilience & Pending Sync
      const [isOnline, setIsOnline] = useState(navigator.onLine);
      const [pendingSyncCount, setPendingSyncCount] = useState(0);

      // Last Balance Feature States
      const [includeLastBalance, setIncludeLastBalance] = useState(false);
      const [lastBalanceAmount, setLastBalanceAmount] = useState(0);
      const [isFetchingLastBalance, setIsFetchingLastBalance] = useState(false);

      // Printable & App Settings State
      const [printSettings, setPrintSettings] = useState(() => {
        try {
          const saved = localStorage.getItem("roughBillPrintSettings");
          if (saved) return JSON.parse(saved);
        } catch (e) {}
        return {
          showName: true,
          showCity: true,
          showDate: true,
          showTime: true,
          fontSize: '24',
          fontFamily: 'Courier Prime',
          rowSpacing: '8',
          colSpacing: '4',
          primarySheetUrl: DEFAULT_SCRIPT_URL,
          lastBalanceSheetUrl: DEFAULT_SCRIPT_URL,
          enableInlineAutocomplete: true,
          footerMessage: "Thank You For Your Visit\nPlease Visit Again"
        };
      });

      useEffect(() => {
        try {
          localStorage.setItem("roughBillPrintSettings", JSON.stringify(printSettings));
        } catch (e) {}
      }, [printSettings]);

      // Date Range Report States
      const [reportPreset, setReportPreset] = useState("last7");
      const [reportStartDate, setReportStartDate] = useState(new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0]);
      const [reportEndDate, setReportEndDate] = useState(new Date().toISOString().split('T')[0]);

      const custRef = useRef(null);
      const parserRef = useRef(null);

      const activeScriptUrl = printSettings.primarySheetUrl || DEFAULT_SCRIPT_URL;
      const lastBalScriptUrl = printSettings.lastBalanceSheetUrl || activeScriptUrl;

      const triggerNotification = (msg) => {
        setNotification(msg);
        setTimeout(() => setNotification(""), 3500);
      };

      const getNormalizedKey = (str) => str ? str.toLowerCase().trim().replace(/\s+/g, ' ') : "";
      const toTitleCase = (str) => str.replace(/\w\S*/g, (txt) => txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase());

      const fetchLastBalanceInBackground = (nameVal) => {
        if (!nameVal || nameVal.trim() === "") {
          setLastBalanceAmount(0);
          return;
        }
        setIsFetchingLastBalance(true);
        const callbackName = "handleBalanceFetch_" + Math.floor(Math.random() * 100000);
        window[callbackName] = (data) => {
          if (data && data.balance !== undefined) {
            setLastBalanceAmount(parseFloat(data.balance) || 0);
          } else if (data && data.customers) {
            let custObj = null;
            if (Array.isArray(data.customers)) {
              custObj = data.customers.find(c => c && c.name && getNormalizedKey(c.name) === getNormalizedKey(nameVal));
            } else if (typeof data.customers === "object") {
              custObj = data.customers[nameVal] || data.customers[Object.keys(data.customers).find(k => getNormalizedKey(k) === getNormalizedKey(nameVal))];
            }
            if (custObj && custObj.balance !== undefined) {
              setLastBalanceAmount(parseFloat(custObj.balance) || 0);
            }
          }
          setIsFetchingLastBalance(false);
          document.getElementById(callbackName)?.remove();
          delete window[callbackName];
        };

        const script = document.createElement("script");
        script.id = callbackName;
        script.src = `${lastBalScriptUrl}?action=getCustomerBalance&customer=${encodeURIComponent(nameVal.trim())}&callback=${callbackName}`;
        script.onerror = () => {
          setIsFetchingLastBalance(false);
          script.remove();
          delete window[callbackName];
        };
        document.body.appendChild(script);
      };

      useEffect(() => {
        if (includeLastBalance && customerName.trim() !== "") {
          fetchLastBalanceInBackground(customerName);
        }
      }, [includeLastBalance, customerName]);

      useEffect(() => {
        const loadIDBCache = async () => {
          const cachedBills = await idbStorage.getAllBills();
          const cachedProds = await idbStorage.getProducts();
          const cachedCusts = await idbStorage.getCustomers();
          const pending = await idbStorage.getPending();

          const deletedKeys = getDeletedProductKeys();

          if (cachedBills.length > 0) {
            const sorted = [...cachedBills].sort((a, b) => (b.id ? Number(b.id) : 0) - (a.id ? Number(a.id) : 0));
            setCloudBills(sorted);
          }
          if (cachedProds.length > 0) {
            const filteredProds = cachedProds.filter(p => p && p.name && !deletedKeys.includes(getNormalizedKey(p.name)));
            setCloudProducts(filteredProds);
          }
          if (cachedCusts.length > 0) setDbCustomers(cachedCusts);
          setPendingSyncCount(pending.length);
        };
        loadIDBCache();
      }, []);

      useEffect(() => {
        const handleOnline = () => {
          setIsOnline(true);
          triggerNotification("📶 Online! Auto-syncing pending offline bills...");
          syncPendingOfflineBills();
        };
        const handleOffline = () => {
          setIsOnline(false);
          triggerNotification("⚡ Network Disconnected - Switching to IndexedDB Local Mode");
        };

        window.addEventListener("online", handleOnline);
        window.addEventListener("offline", handleOffline);

        return () => {
          window.removeEventListener("online", handleOnline);
          window.removeEventListener("offline", handleOffline);
        };
      }, []);

      const syncPendingOfflineBills = async () => {
        if (!navigator.onLine) return;
        const pending = await idbStorage.getPending();
        if (pending.length === 0) {
          setPendingSyncCount(0);
          return;
        }

        let syncedCount = 0;
        for (const bill of pending) {
          try {
            await window.firebaseBridge.saveBillToCloudWithNumericId(bill.id, bill, false, activeScriptUrl);
            syncedCount++;
          } catch (e) {
            console.warn("Background bill sync attempt deferred:", e);
          }
        }

        const remainingPending = await idbStorage.getPending();
        setPendingSyncCount(remainingPending.length);

        if (syncedCount > 0) {
          triggerNotification(`✓ Successfully auto-synced ${syncedCount} offline bill(s) to Sheets!`);
          syncDataFromGoogleSheets();
        }
      };

      const syncDataFromGoogleSheets = () => {
        const callbackName = "handleSheetsSync_" + Math.floor(Math.random() * 100000);
        window[callbackName] = (data) => {
          if (data) {
            const deletedKeys = getDeletedProductKeys();

            if (data.customers) {
              let parsedCustomers = [];
              if (Array.isArray(data.customers)) {
                parsedCustomers = data.customers;
              } else if (typeof data.customers === "object") {
                parsedCustomers = Object.entries(data.customers).map(([name, details]) => ({
                  name: name,
                  phone: details ? details.phone : "",
                  joined: details ? details.joined : "",
                  city: details ? (details.city || details.City || "Local") : "Local",
                  discount: details ? (details.discount || 0) : 0,
                  balance: details ? (details.balance || 0) : 0
                }));
              }
              setDbCustomers(parsedCustomers);
              window.firebaseBridge.customers = parsedCustomers;
              idbStorage.cacheCustomers(parsedCustomers);
            }

            if (data.products) {
              const validProds = data.products.filter(p => p && p.name && !deletedKeys.includes(getNormalizedKey(p.name)));
              setCloudProducts(validProds);
              window.firebaseBridge.products = validProds;
              idbStorage.cacheProducts(validProds);
            }

            if (data.txns) {
              setCloudBills(prevBills => {
                const prevMap = new Map();
                prevBills.forEach(b => prevMap.set(String(b.id), b));

                const merged = data.txns.map(remoteTxn => {
                  const remoteId = String(remoteTxn.id);
                  const localTxn = prevMap.get(remoteId);
                  const remoteItems = parseItemsSafely(remoteTxn.items);

                  if (localTxn) {
                    const localItems = parseItemsSafely(localTxn.items);
                    const isRecentlySavedLocally = (Date.now() - (localTxn.localUpdatedAt || 0)) < 30000;
                    if ((isRecentlySavedLocally || localItems.length > remoteItems.length) && localItems.length > 0) {
                      return {
                        ...remoteTxn,
                        ...localTxn,
                        items: localItems,
                        totalAmount: localTxn.totalAmount || remoteTxn.totalAmount || remoteTxn.amount
                      };
                    }
                  }

                  return {
                    ...remoteTxn,
                    items: remoteItems,
                    totalAmount: remoteTxn.totalAmount || remoteTxn.amount
                  };
                });

                prevBills.forEach(localTxn => {
                  if (!merged.some(m => String(m.id) === String(localTxn.id))) {
                    merged.push(localTxn);
                  }
                });

                const sortedTxns = merged.sort((a, b) => {
                  const timeA = a.id ? Number(a.id) : new Date(a.date || 0).getTime();
                  const timeB = b.id ? Number(b.id) : new Date(b.date || 0).getTime();
                  return timeB - timeA;
                });

                window.firebaseBridge.bills = sortedTxns;
                sortedTxns.forEach(b => idbStorage.saveBill(b, false));
                return sortedTxns;
              });
            }
          }
          document.getElementById(callbackName)?.remove();
          delete window[callbackName];
        };

        const script = document.createElement("script");
        script.id = callbackName;
        script.src = `${activeScriptUrl}?action=getData&callback=${callbackName}`;
        document.body.appendChild(script);
      };

      useEffect(() => {
        syncDataFromGoogleSheets();
        const interval = setInterval(() => {
          if (navigator.onLine) {
            syncDataFromGoogleSheets();
            syncPendingOfflineBills();
          }
          if (bleDevice && !bleCharacteristic) {
            reconnectBLEPrinterQuietly();
          }
        }, 5000);
        return () => clearInterval(interval);
      }, [bleDevice, bleCharacteristic, activeScriptUrl]);

      useEffect(() => {
        if (currentTab === "bill" && parserRef.current) {
          parserRef.current.focus();
        }
      }, [currentTab]);

      const getThreeLetterCode = (val) => {
        if (!val) return "GEN";
        const cleaned = val.replace(/[^a-zA-Z]/g, "").toUpperCase();
        return cleaned.slice(0, 3) || "GEN";
      };

      const formatInvoiceDateTime = (dateStr) => {
        const baseDate = dateStr ? new Date(dateStr) : new Date();
        const currentRealTime = new Date();
        baseDate.setHours(currentRealTime.getHours(), currentRealTime.getMinutes());
        const day = String(baseDate.getDate()).padStart(2, '0');
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        
        const datePart = `${day},${months[baseDate.getMonth()]}`;
        const timePart = `${String(baseDate.getHours()).padStart(2, '0')}:${String(baseDate.getMinutes()).padStart(2, '0')}`;

        if (printSettings.showDate && printSettings.showTime) return `${datePart} ${timePart}`;
        if (printSettings.showDate) return datePart;
        if (printSettings.showTime) return timePart;
        return "";
      };

      const handleCustomerSearchAndSelect = (nameVal) => {
        const match = dbCustomers.find(c => c && c.name && c.name.toLowerCase().trim() === nameVal.toLowerCase().trim());
        if (match) {
          setCustomerName(match.name);
          setCustomerCity(match.city || "");
          setDiscountX(match.discount !== undefined && match.discount !== 0 ? String(match.discount) : "15");
          if (match.balance !== undefined) setLastBalanceAmount(parseFloat(match.balance) || 0);
          setShowCustSuggestions(false);
          if (includeLastBalance) fetchLastBalanceInBackground(match.name);
        } else {
          setCustomerName("");
          setCustomerCity("");
          setDiscountX("15");
          setLastBalanceAmount(0);
          triggerNotification("Select a valid customer from database.");
        }
      };

      const handleResetAll = () => {
        setCustomerName(""); setCustomerCity(""); setDiscountX("15");
        setBaggedItems([]); setEditingBillId(null);
        setParserInput("");
        setGroupLessInputs({});
        setIncludeLastBalance(false);
        setLastBalanceAmount(0);
        setTimeout(() => {
          if (parserRef.current) parserRef.current.focus();
        }, 100);
      };

      // Load Historical Bill (Retains default 0 item less if unspecified)
      const handleLoadHistoricalBill = (historicalBillObj) => {
        setCustomerName(historicalBillObj.customerName || historicalBillObj.name || "");
        setCustomerCity(historicalBillObj.customerCity || historicalBillObj.city || "");
        setDiscountX(String(historicalBillObj.discountRate || historicalBillObj.discount || 15));
        setBillDate(historicalBillObj.date ? historicalBillObj.date.split(' ')[0] : new Date().toISOString().split('T')[0]);
        
        const rawItems = parseItemsSafely(historicalBillObj.items);
        const normalized = rawItems.map((i, idx) => {
          const qtyVal = parseFloat(i.qty) || 1;
          const priceVal = parseFloat(i.basePrice || i.rate || i.price || i.finalUnitPrice || 0);
          const lessVal = (i.less !== undefined && i.less !== null && i.less !== "—") ? String(i.less) : "0";
          const deduct = (lessVal !== "—" && !isNaN(parseFloat(lessVal))) ? parseFloat(lessVal) : 0;
          const finalPrice = i.finalUnitPrice !== undefined && !isNaN(parseFloat(i.finalUnitPrice))
            ? parseFloat(i.finalUnitPrice) 
            : Math.max(0, priceVal - deduct);
          const totalAmt = getItemTotalAmount(i);

          return {
            id: 'loaded_' + Date.now() + '_' + idx + '_' + Math.random().toString(36).substring(2, 7),
            qty: qtyVal,
            name: i.name || "Item",
            code: (i.code && i.code !== "—" && i.code !== "") ? i.code : "—",
            basePrice: priceVal,
            less: lessVal,
            finalUnitPrice: finalPrice,
            totalAmount: totalAmt
          };
        });

        setBaggedItems(normalized);
        setEditingBillId(String(historicalBillObj.id) || null);
        setCurrentTab("bill");
        triggerNotification(`✓ Loaded bill with all ${normalized.length} item(s)!`);
      };

      const calculateRateForToken = (codeStr, rawX) => {
        const cleanCode = codeStr.toLowerCase().trim();
        const discountRate = parseFloat(rawX) || 0;
        if (cleanCode.endsWith('n')) {
          const val = parseFloat(cleanCode.slice(0, -1));
          return !isNaN(val) ? val * 5 : 0;
        }
        if (cleanCode.endsWith('no') || cleanCode.endsWith('nu')) {
          const val = parseFloat(cleanCode.replace(/(no|nu)$/, ''));
          if (!isNaN(val)) {
            const baseMultiplierPrice = val * 5;
            return baseMultiplierPrice - (baseMultiplierPrice * (discountRate / 100));
          }
          return 0;
        }
        return !isNaN(parseFloat(cleanCode)) ? parseFloat(cleanCode) : 0;
      };

      // SORT DIRECTORY SHORTCUTS BY MOST TYPED / FREQUENTLY BILLED ITEMS FIRST
      const mostTypedProducts = useMemo(() => {
        if (!cloudProducts || !Array.isArray(cloudProducts)) return [];
        const deletedKeys = getDeletedProductKeys();

        const counts = {};
        cloudBills.forEach(b => {
          const items = parseItemsSafely(b.items);
          items.forEach(i => {
            if (i && i.name) {
              const k = getNormalizedKey(i.name);
              counts[k] = (counts[k] || 0) + (parseFloat(i.qty) || 1);
            }
          });
        });

        return [...cloudProducts]
          .filter(p => p && p.name && !deletedKeys.includes(getNormalizedKey(p.name)))
          .sort((a, b) => {
            const countA = counts[getNormalizedKey(a.name)] || 0;
            const countB = counts[getNormalizedKey(b.name)] || 0;
            if (countB !== countA) return countB - countA;
            return (a.name || "").localeCompare((b.name || ""), undefined, { sensitivity: 'base' });
          });
      }, [cloudProducts, cloudBills]);

      // Inline Autocomplete Suggestion Calculation
      const autocompleteSuggestion = useMemo(() => {
        if (!printSettings.enableInlineAutocomplete || !parserInput.trim()) return "";
        const trimmed = parserInput.trimStart();
        const match = trimmed.match(/^(\d+(?:\.\d+)?)\s+(.*)$/);
        const typedText = match ? match[2].trim() : trimmed;
        if (!typedText) return "";

        const candidate = mostTypedProducts.find(p => p.name.toLowerCase().startsWith(typedText.toLowerCase()));
        if (candidate && candidate.name.toLowerCase() !== typedText.toLowerCase()) {
          return candidate.name.slice(typedText.length);
        }
        return "";
      }, [parserInput, mostTypedProducts, printSettings.enableInlineAutocomplete]);

      // FAST PARSER SUBMIT
      // REQUIREMENT NO. 3: Item-level default less is 0 (or blank), NO automatic subtraction!
      const handleParserSubmit = (e) => {
        e.preventDefault();
        let rawInput = parserInput.trim();
        if (!rawInput) return;

        if (autocompleteSuggestion) {
          rawInput = rawInput + autocompleteSuggestion;
        }

        const isSuffixCode = (str) => {
          const s = str.toLowerCase().trim();
          return s.endsWith('n') || s.endsWith('no') || s.endsWith('nu');
        };

        let parsedQty = 1;
        let codeValue = "—";
        let unitPrice = 0;
        let rawProdName = "";

        const match = rawInput.match(/^(\d+(?:\.\d+)?)\s+(.+)$/);

        if (match) {
          parsedQty = parseFloat(match[1]);
          const tokens = match[2].trim().split(/\s+/);
          const lastToken = tokens[tokens.length - 1];

          if (isSuffixCode(lastToken)) {
            codeValue = lastToken;
            unitPrice = calculateRateForToken(codeValue, discountX);
            tokens.pop();
          } else if (!isNaN(parseFloat(lastToken)) && isFinite(lastToken)) {
            codeValue = "—";
            unitPrice = parseFloat(lastToken);
            tokens.pop();
          }

          rawProdName = tokens.join(" ").trim();
        } else {
          parsedQty = 1;
          const tokens = rawInput.split(/\s+/);
          const lastToken = tokens[tokens.length - 1];

          if (isSuffixCode(lastToken)) {
            codeValue = lastToken;
            unitPrice = calculateRateForToken(codeValue, discountX);
            tokens.pop();
            rawProdName = tokens.join(" ").trim();
          } else if (!isNaN(parseFloat(lastToken)) && isFinite(lastToken)) {
            codeValue = "—";
            unitPrice = parseFloat(lastToken);
            tokens.pop();
            rawProdName = tokens.join(" ").trim();
          } else {
            rawProdName = rawInput;
            unitPrice = 0;
          }
        }

        if (!rawProdName) {
          rawProdName = lastProductName ? lastProductName : "Item";
        } else {
          setLastProductName(rawProdName);
        }

        const displayCasing = toTitleCase(rawProdName);
        
        // Save unique product to catalog automatically
        const isDuplicateCatalog = cloudProducts.some(p => p && p.name && getNormalizedKey(p.name) === getNormalizedKey(displayCasing));
        if (!isDuplicateCatalog) {
          window.firebaseBridge.addProductToCloud({ name: displayCasing }, activeScriptUrl);
          const updatedProds = [...cloudProducts, { id: Date.now(), name: displayCasing }];
          setCloudProducts(updatedProds);
          idbStorage.cacheProducts(updatedProds);
        }

        // DEFAULT PER SKU ITEM LESS = 0 (No deduction by default)
        const defaultSkuLess = "0";
        const finalUnitPrice = unitPrice; // No automatic subtraction

        const newItem = {
          id: 'item_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9), 
          qty: parsedQty, 
          name: displayCasing, 
          code: codeValue,
          basePrice: unitPrice, 
          less: defaultSkuLess, 
          finalUnitPrice: finalUnitPrice, 
          totalAmount: parsedQty * finalUnitPrice
        };

        setBaggedItems(prev => [newItem, ...prev]);
        setParserInput(""); 
        if (parserRef.current) parserRef.current.focus();
      };

      const handleEditBaggedItem = (id, field, value) => {
        setBaggedItems(prev => prev.map(item => {
          if (String(item.id) === String(id)) {
            const updated = { ...item };
            if (field === 'qty') updated.qty = parseFloat(value) || 0;
            if (field === 'name') updated.name = value;
            if (field === 'code') updated.code = value;
            if (field === 'basePrice') updated.basePrice = parseFloat(value) || 0;
            if (field === 'less') updated.less = value;

            if (updated.code !== "—" && updated.code !== "" && field === 'code') {
              updated.basePrice = calculateRateForToken(updated.code, discountX);
            }

            let deduction = 0;
            const cleanLess = String(updated.less).trim();
            if (cleanLess !== "" && cleanLess !== "—") {
              deduction = parseFloat(cleanLess) || 0;
            }

            updated.finalUnitPrice = Math.max(0, updated.basePrice - deduction);
            updated.totalAmount = updated.qty * updated.finalUnitPrice;
            return updated;
          }
          return item;
        }));
      };

      // REQUIREMENT NO. 2: Group Less input is filled with 10 (Not applied automatically until APPLY is clicked)
      const applyGroupLessDiscount = (groupKey, lessValStr) => {
        const valToApply = lessValStr !== undefined && lessValStr !== "" ? lessValStr : "10";
        const amt = parseFloat(valToApply) || 0;
        setBaggedItems(prev => prev.map(item => {
          if (getNormalizedKey(item.name) === groupKey) {
            const updated = { ...item, less: String(amt) };
            updated.finalUnitPrice = Math.max(0, updated.basePrice - amt);
            updated.totalAmount = updated.qty * updated.finalUnitPrice;
            return updated;
          }
          return item;
        }));
        triggerNotification(`Applied ₹${amt} Less to all ${groupKey.toUpperCase()} items!`);
      };

      // Grouping bagged items by Item Name
      const groupedBaggedItems = useMemo(() => {
        const groups = {};
        baggedItems.forEach(item => {
          const key = getNormalizedKey(item.name);
          if (!groups[key]) {
            groups[key] = {
              key: key,
              displayName: item.name,
              totalQty: 0,
              totalAmount: 0,
              items: []
            };
          }
          const itemAmt = getItemTotalAmount(item);
          groups[key].items.push(item);
          groups[key].totalQty += (parseFloat(item.qty) || 0);
          groups[key].totalAmount += itemAmt;
        });
        return Object.values(groups);
      }, [baggedItems]);

      // Total Current Bill Liability Sum
      const currentBillTotalSum = useMemo(() => {
        return baggedItems.reduce((acc, i) => acc + getItemTotalAmount(i), 0);
      }, [baggedItems]);

      // Grand Total Balance
      const grandFinalBalance = useMemo(() => {
        return Math.round(currentBillTotalSum + (includeLastBalance ? lastBalanceAmount : 0));
      }, [currentBillTotalSum, includeLastBalance, lastBalanceAmount]);

      // Renders receipts for printer/spool
      const renderReceiptForSpool = (itemsList, custName, cityVal, dateTimeStr) => {
        const sortedItems = [...itemsList].sort((a,b) => a.name.localeCompare(b.name));
        const total = sortedItems.reduce((acc, i) => acc + getItemTotalAmount(i), 0);

        const headerDetails = [];
        if (printSettings.showName && custName) headerDetails.push(getThreeLetterCode(custName));
        if (printSettings.showCity && cityVal) headerDetails.push(`(${getThreeLetterCode(cityVal)})`);
        if (dateTimeStr) headerDetails.push(`- ${dateTimeStr}`);

        const fontFamCss = printSettings.fontFamily === 'Roboto Mono' ? "'Roboto Mono', monospace" : "'Courier Prime', monospace";
        const fSizePx = `${printSettings.fontSize}px`;
        const rPadPx = `${printSettings.rowSpacing}px`;
        const cPadPx = `${printSettings.colSpacing}px`;

        const footerLines = (printSettings.footerMessage || "Thank You For Your Visit\nPlease Visit Again").split('\n');

        let receiptHTML = `
          <div style="font-family: ${fontFamCss};" class="text-center pb-3 mb-3 border-b-4 border-black">
            <h2 style="font-size: ${Math.round(parseInt(printSettings.fontSize)*1.4)}px;" class="font-black uppercase tracking-widest leading-none">ESTIMATE RECEIPT</h2>
            <p style="font-size: ${Math.round(parseInt(printSettings.fontSize)*0.8)}px;" class="font-bold mt-1">Rough Statement Profile</p>
            ${headerDetails.length > 0 ? `
              <div style="font-size: ${fSizePx};" class="mt-2 text-center font-black border-y-2 border-dashed border-black py-1.5">
                ${headerDetails.join(" ")}
              </div>
            ` : ""}
          </div>
          <table style="font-family: ${fontFamCss}; font-size: ${fSizePx};" class="w-full text-left mt-2 border-collapse font-bold">
            <thead>
              <tr class="border-b-4 border-black font-black uppercase">
                <th style="padding: ${rPadPx} ${cPadPx};" class="w-16 text-center">QT</th>
                <th style="padding: ${rPadPx} ${cPadPx};">ITEM</th>
                <th style="padding: ${rPadPx} ${cPadPx};" class="text-right w-28">P</th>
                <th style="padding: ${rPadPx} ${cPadPx};" class="text-right w-36">AMT</th>
              </tr>
            </thead>
            <tbody>
        `;

        sortedItems.forEach((item, index) => {
          const rawCodeOnly = (item.code && item.code !== "—") ? item.code.trim() : "";
          const itemAmt = getItemTotalAmount(item);
          const unitP = item.finalUnitPrice !== undefined ? item.finalUnitPrice : (item.rate || item.basePrice || item.price || 0);

          receiptHTML += `
            <tr class="align-top border-b border-stone-200">
              <td style="padding: ${rPadPx} ${cPadPx}; font-size: ${fSizePx};" class="text-center font-bold">${Math.round(item.qty || 1)}</td>
              <td style="padding: ${rPadPx} ${cPadPx}; font-size: ${fSizePx};" class="font-bold uppercase whitespace-pre-wrap break-all leading-tight">
                <div>${item.name.trim().toUpperCase()}</div>
                ${rawCodeOnly ? `<div style="font-size: ${Math.round(parseInt(printSettings.fontSize)*0.75)}px;" class="text-stone-700 font-normal tracking-wide">${rawCodeOnly}</div>` : ""}
              </td>
              <td style="padding: ${rPadPx} ${cPadPx}; font-size: ${fSizePx};" class="text-right font-bold">${Math.round(unitP)}</td>
              <td style="padding: ${rPadPx} ${cPadPx}; font-size: ${fSizePx};" class="text-right font-bold">${Math.round(itemAmt)}</td>
            </tr>
          `;

          if ((index + 1) % 5 === 0 && index !== sortedItems.length - 1) {
            receiptHTML += `
              <tr>
                <td colspan="4" class="py-1 border-b-2 border-dotted border-stone-400"></td>
              </tr>
            `;
          }
        });

        receiptHTML += `
            </tbody>
          </table>
          <div style="font-family: ${fontFamCss}; font-size: ${fSizePx};" class="mt-6 pt-3 border-t-4 border-dashed border-black text-right space-y-2 font-bold">
            <div class="flex justify-between font-black">
              <span>Bill Total:</span>
              <span>₹${Math.round(total)}</span>
            </div>
            ${includeLastBalance ? `
              <div class="flex justify-between font-bold text-stone-700">
                <span>Previous Balance:</span>
                <span>₹${Math.round(lastBalanceAmount)}</span>
              </div>
            ` : ""}
            <div style="font-size: ${Math.round(parseInt(printSettings.fontSize)*1.25)}px;" class="flex justify-between font-black border-t-4 border-black pt-2 mt-1">
              <span>TOTAL:</span>
              <span>₹${Math.round(total + (includeLastBalance ? lastBalanceAmount : 0))}</span>
            </div>
          </div>
          <div style="font-family: ${fontFamCss}; font-size: ${fSizePx};" class="mt-10 text-center font-bold pt-4 border-t-2 border-black">
            ${footerLines.map(line => `<div>${line}</div>`).join('')}
          </div>
        `;

        return receiptHTML;
      };

      const handleGenerateAndPrintBill = async () => {
        if (baggedItems.length === 0) return;
        
        const synchronousIsEdit = !!editingBillId;
        const uniqueNumericId = editingBillId ? Number(editingBillId) : Date.now();
        const printDateFormatted = formatInvoiceDateTime(billDate);
        const finalClientName = customerName.trim() || "Walk-In Customer";

        const printBody = document.getElementById("printable-bill-invoice");
        if (printBody) {
          printBody.innerHTML = renderReceiptForSpool(baggedItems, finalClientName, customerCity, printDateFormatted);
        }
        
        window.print();

        if (bleCharacteristic) {
          try {
            printBLEThermalDirectly(baggedItems, finalClientName, customerCity, printDateFormatted);
          } catch (e) { 
            console.warn("BLE print dispatch bypassed.", e); 
          }
        }

        const billDataObject = {
          id: uniqueNumericId, customerName: finalClientName, customerCity: customerCity || "Local",
          date: billDate, items: baggedItems, totalAmount: grandFinalBalance, discountRate: parseFloat(discountX) || 0,
          timestamp: uniqueNumericId, syncStatusFirestore: true, syncStatusSheets: true, formattedDateTime: printDateFormatted
        };

        setCloudBills(prev => [billDataObject, ...prev.filter(b => String(b.id) !== String(uniqueNumericId))]);

        window.firebaseBridge.saveBillToCloudWithNumericId(uniqueNumericId, billDataObject, synchronousIsEdit, activeScriptUrl)
          .then(() => triggerNotification("✓ Bill saved locally & synced to Sheets!"))
          .catch(() => {
            setPendingSyncCount(prev => prev + 1);
            triggerNotification("⚡ Saved to IndexedDB! Will auto-sync when online.");
          });

        setTimeout(() => {
          handleResetAll();
        }, 300);
      };

      const shareBillImage = (items, custName, cityVal, activeDate) => {
        const exportContainer = document.getElementById("image-export-container");
        if (!exportContainer) return;

        const printDateFormatted = formatInvoiceDateTime(activeDate);
        const finalClientName = custName || "Walk-In Customer";

        exportContainer.innerHTML = renderReceiptForSpool(items, finalClientName, cityVal, printDateFormatted);

        triggerNotification("Generating shareable receipt image...");

        setTimeout(() => {
          html2canvas(exportContainer, { scale: 2, useCORS: true, backgroundColor: "#ffffff" })
            .then(async (canvas) => {
              canvas.toBlob(async (blob) => {
                if (!blob) {
                  triggerNotification("Image export failed.");
                  exportContainer.innerHTML = "";
                  return;
                }
                const fileName = `Bill_${getThreeLetterCode(finalClientName)}_${activeDate}.png`;
                const file = new File([blob], fileName, { type: 'image/png' });

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                  try {
                    await navigator.share({
                      files: [file],
                      title: `Bill - ${finalClientName}`,
                      text: `Receipt for ${finalClientName} (${cityVal})`
                    });
                    triggerNotification("✓ Shared successfully!");
                    exportContainer.innerHTML = "";
                    return;
                  } catch (shareErr) {
                    console.warn("Native share error, downloading instead:", shareErr);
                  }
                }

                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = fileName;
                link.click();
                triggerNotification("✓ Image Downloaded!");
                exportContainer.innerHTML = "";
              }, 'image/png');
            })
            .catch(err => {
              console.error("Canvas image export failed:", err);
              triggerNotification("Image generation failed.");
              exportContainer.innerHTML = "";
            });
        }, 100);
      };

      const handleLogsItemPrint = (logItem) => {
        const printBody = document.getElementById("printable-bill-invoice");
        if (printBody) {
          const printDateFormatted = formatInvoiceDateTime(logItem.timestamp ? new Date(logItem.timestamp) : new Date());
          printBody.innerHTML = renderReceiptForSpool(logItem.items || [], logItem.customerName, logItem.customerCity, printDateFormatted);
        }
        window.print();

        if (bleCharacteristic) {
          try {
            const printDateFormatted = formatInvoiceDateTime(logItem.timestamp ? new Date(logItem.timestamp) : new Date());
            printBLEThermalDirectly(logItem.items || [], logItem.customerName, logItem.customerCity, printDateFormatted);
          } catch (e) { console.warn("BLE print logs bypassed.", e); }
        }
      };

      const toggleLogItemPreview = (billId) => {
        setVisibleLogPreviews(prev => ({
          ...prev,
          [billId]: !prev[billId]
        }));
      };

      const connectBluetoothPrinter = async () => {
        if (!navigator.bluetooth) {
          triggerNotification("Web BLE is unsupported on this browser.");
          return;
        }
        setBleStatus("Scanning...");
        try {
          const device = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: ["000018f0-0000-1000-8000-00805f9b34fb", "0000e7e1-0000-1000-8000-00805f9b34fb"]
          });
          setBleStatus("Connecting...");
          const server = await device.gatt.connect();
          let service;
          try {
            service = await server.getPrimaryService("000018f0-0000-1000-8000-00805f9b34fb");
          } catch(e) {
            service = await server.getPrimaryService("0000e7e1-0000-1000-8000-00805f9b34fb");
          }
          const characteristics = await service.getCharacteristics();
          const writer = characteristics.find(c => c.properties.write || c.properties.writeWithoutResponse);
          setBleDevice(device);
          setBleCharacteristic(writer);
          setBleStatus("Connected");
          triggerNotification("BLE Printer Connected!");
        } catch (err) {
          setBleStatus("Disconnected");
          triggerNotification("BLE connection failed.");
        }
      };

      const reconnectBLEPrinterQuietly = async () => {
        if (!bleDevice) return;
        try {
          const server = await bleDevice.gatt.connect();
          let service;
          try {
            service = await server.getPrimaryService("000018f0-0000-1000-8000-00805f9b34fb");
          } catch(e) {
            service = await server.getPrimaryService("0000e7e1-0000-1000-8000-00805f9b34fb");
          }
          const characteristics = await service.getCharacteristics();
          const writer = characteristics.find(c => c.properties.write || c.properties.writeWithoutResponse);
          setBleCharacteristic(writer);
          setBleStatus("Connected");
        } catch (err) {
          setBleStatus("Disconnected");
        }
      };

      const handleCatalogDelete = async (name) => {
        const prodKey = getNormalizedKey(name);
        addDeletedProductKey(prodKey);
        try {
          await window.firebaseBridge.deleteProductFromCloud(name, activeScriptUrl);
          const updated = cloudProducts.filter(p => getNormalizedKey(p.name) !== prodKey);
          setCloudProducts(updated);
          idbStorage.cacheProducts(updated);
          triggerNotification("✓ Product deleted permanently from directory!");
        } catch (err) {
          console.error(err);
        }
      };

      const getParserAutocompleteQueryLocal = () => {
        const trimmed = parserInput.trim();
        if (!trimmed) return "";
        const match = trimmed.match(/^(\d+(?:\.\d+)?)\s+(.*)$/);
        if (match) {
          const rest = match[2].trim();
          const tokens = rest.split(/\s+/);
          if (tokens.length > 0) {
            const lastToken = tokens[tokens.length - 1];
            if (lastToken.toLowerCase().endsWith('n') || lastToken.toLowerCase().endsWith('no') || lastToken.toLowerCase().endsWith('nu') || (!isNaN(parseFloat(lastToken)) && isFinite(lastToken))) {
              tokens.pop();
            }
          }
          return tokens.join(" ");
        }
        if (isNaN(parseFloat(trimmed.split(/\s+/)[0]))) return trimmed;
        return "";
      };

      const selectParserSuggestion = (prodName) => {
        const trimmed = parserInput.trimStart();
        const match = trimmed.match(/^(\d+(?:\.\d+)?)\s+(.*)$/);
        const currentQty = match ? match[1] : "1";
        setParserInput(`${currentQty} ${prodName} `);

      const getSecureLogBills = () => isVerified ? cloudBills : cloudBills.slice(0, 3);

      const handleProductAddSubmit = async (e) => {
        e.preventDefault();
        const trimmed = newProdName.trim();
        if (!trimmed) return;

        const isDuplicate = cloudProducts.some(p => p && p.name && getNormalizedKey(p.name) === getNormalizedKey(trimmed));
        if (isDuplicate) {
          triggerNotification("Product already exists!");
          return;
        }

        const formattedName = toTitleCase(trimmed);
        try {
          await window.firebaseBridge.addProductToCloud({ name: formattedName }, activeScriptUrl);
          const updated = [...cloudProducts, { id: Date.now(), name: formattedName }];
          setCloudProducts(updated);
          idbStorage.cacheProducts(updated);
          setNewProdNameState("");
          triggerNotification("Product synced to database!");
        } catch (err) {
          console.error(err);
          triggerNotification("Failed to add product.");

      };

      // Thermal BLE Print Command Generator
      const printBLEThermalDirectly = async (itemsList, custName, cityVal, activeDate) => {
        if (!bleCharacteristic) return;
        const encoder = new TextEncoder();
        let esc = [];

        esc.push(0x1B, 0x40); // Init
        esc.push(0x1B, 0x61, 0x01); // Center
        esc.push(...encoder.encode("ESTIMATE RECEIPT\n"));
        
        const headerText = [];
        if (printSettings.showName && custName) headerText.push(custName.toUpperCase());
        if (activeDate) headerText.push(activeDate);
        if (headerText.length > 0) esc.push(...encoder.encode(`${headerText.join(" - ")}\n`));
        
        esc.push(...encoder.encode("--------------------------------\n"));
        
        esc.push(0x1B, 0x61, 0x00); // Left align
        const sortedItems = [...itemsList].sort((a,b) => a.name.localeCompare(b.name));
        
        let sumTotal = 0;
        sortedItems.forEach((item, index) => {
          const itemAmt = getItemTotalAmount(item);
          sumTotal += itemAmt;

          const nameStr = item.name.trim().toUpperCase().slice(0, 15);
          const qStr = String(Math.round(item.qty || 1)).padEnd(3);
          const unitP = item.finalUnitPrice !== undefined ? item.finalUnitPrice : (item.rate || item.basePrice || 0);
          const pStr = String(Math.round(unitP)).padStart(4);
          const totalStr = String(Math.round(itemAmt)).padStart(6);
          
          esc.push(...encoder.encode(`${qStr} ${nameStr.padEnd(15)} ${pStr} ${totalStr}\n`));
          
          if (item.code && item.code !== "—") {
            esc.push(...encoder.encode(`    ${item.code.trim()}\n`));
          }

          if ((index + 1) % 5 === 0 && index !== sortedItems.length - 1) {
            esc.push(...encoder.encode("................................\n"));
          }
        });

        esc.push(...encoder.encode("--------------------------------\n"));
        let finalGrandTotal = sumTotal;
        if (includeLastBalance) {
          esc.push(...encoder.encode(`BILL TOTAL:              ${Math.round(sumTotal)}\n`));
          esc.push(...encoder.encode(`LAST BAL:                ${Math.round(lastBalanceAmount)}\n`));
          finalGrandTotal += lastBalanceAmount;
        }
        esc.push(...encoder.encode(`TOTAL:                   ${Math.round(finalGrandTotal)}\n\n`));

        // Custom Thank You Message
        const footerLines = (printSettings.footerMessage || "Thank You For Your Visit\nPlease Visit Again").split('\n');
        esc.push(0x1B, 0x61, 0x01); // Center
        footerLines.forEach(line => {
          if (line.trim()) {
            esc.push(...encoder.encode(`${line.trim()}\n`));
          }
        });
        esc.push(...encoder.encode("\n\n"));

        esc.push(0x1D, 0x56, 0x42, 0x00); // Cut paper

        const bytes = new Uint8Array(esc);
        for (let i = 0; i < bytes.length; i += 20) {
          await bleCharacteristic.writeValue(bytes.slice(i, i + 20));
        }
      };

      const autocompleteQueryLocal = getParserAutocompleteQueryLocal();

      // Date Range Bill Report Filtering
      const filteredReportBills = useMemo(() => {
        let startMs = 0;

          startMs = new Date(today).getTime();
          endMs = startMs + (24 * 60 * 60 * 1000);
        } else if (reportPreset === "last7") {
          endMs = Date.now() + (24 * 60 * 60 * 1000);
          startMs = Date.now() - (7 * 24 * 60 * 60 * 1000);
        } else if (reportPreset === "last30") {
          endMs = Date.now() + (24 * 60 * 60 * 1000);
          startMs = Date.now() - (30 * 24 * 60 * 60 * 1000);
        } else if (reportPreset === "custom") {

          if (reportEndDate) endMs = new Date(reportEndDate).getTime() + (24 * 60 * 60 * 1000);

          if (isWalkIn) return false;

          const bTime = b.id ? Number(b.id) : new Date(b.date || 0).getTime();
          return bTime >= startMs && bTime <= endMs;
        });
      }, [cloudBills, reportPreset, reportStartDate, reportEndDate]);

              <button type="button" onClick={connectBluetoothPrinter} className={`px-2 py-1.5 h-10 rounded-lg text-[8px] font-black tracking-wider flex items-center gap-0.5 transition-colors ${bleStatus.includes('Connected') ? 'bg-emerald-100 text-emerald-800 border-emerald-300' : 'bg-stone-100 text-stone-600 border'}`}>
                <i className="fa-brands fa-bluetooth text-sm"></i> {bleStatus.includes('Connected') ? 'ON':'OFF'}
              </button>

          {/* MAIN INTERFACE TAB VIEWS */}
          <main className="flex-grow flex-1 min-h-0 max-w-md w-full mx-auto p-2 flex flex-col gap-2 overflow-hidden bg-stone-50 no-print">
            
            {currentTab === "bill" && (
              <div className="flex-grow flex flex-col gap-2 overflow-hidden min-h-0">
                
                {/* Directory Shortcuts (Sorted by Most Typed First) */}
                <div className="bg-white p-2 border rounded-xl shadow-xs flex-shrink-0">

                      className="w-full text-xs p-2 border rounded font-mono font-bold bg-stone-50 focus:outline-none"
                    ></textarea>
                    <span className="block text-[8px] text-stone-400 italic">Appears at the bottom of printed receipts, images, and previews.</span>
                  </div>

                  {/* Autocomplete Toggle */}
                  <div className="space-y-1 border-t pt-2">
                    <span className="block text-[9px] font-black text-stone-400 uppercase tracking-wider">Draft Typing Controls</span>
                    <label className="flex items-center justify-between p-2 border rounded bg-stone-50 cursor-pointer text-xs font-bold">
                      <span>Inline Ghost Autocomplete Suffix</span>
                      <input 
                        type="checkbox" 
                        checked={printSettings.enableInlineAutocomplete} 
                        onChange={(e) => setPrintSettings({ ...printSettings, enableInlineAutocomplete: e.target.checked })} 
                        className="h-4 w-4 rounded text-stone-900" 
                      />
                    </label>
                  </div>

                  {/* Field Visibility Options */}
                  <div className="space-y-2 border-t pt-2">
                    <span className="block text-[9px] font-black text-stone-400 uppercase tracking-wider">Header Field Visibility</span>
                    <div className="grid grid-cols-2 gap-2 text-xs font-bold">
                      <label className="flex items-center gap-2 p-2 border rounded bg-stone-50 cursor-pointer">
                        <input type="checkbox" checked={printSettings.showName} onChange={e => setPrintSettings({ ...printSettings, showName: e.target.checked })} className="h-4 w-4 rounded text-stone-900" />
                        <span>Print Customer Name</span>
                      </label>
                      <label className="flex items-center gap-2 p-2 border rounded bg-stone-50 cursor-pointer">
                        <input type="checkbox" checked={printSettings.showCity} onChange={e => setPrintSettings({ ...printSettings, showCity: e.target.checked })} className="h-4 w-4 rounded text-stone-900" />
                        <span>Print Customer City</span>
                      </label>
                      <label className="flex items-center gap-2 p-2 border rounded bg-stone-50 cursor-pointer">
                        <input type="checkbox" checked={printSettings.showDate} onChange={e => setPrintSettings({ ...printSettings, showDate: e.target.checked })} className="h-4 w-4 rounded text-stone-900" />
                        <span>Print Invoice Date</span>
                      </label>
                      <label className="flex items-center gap-2 p-2 border rounded bg-stone-50 cursor-pointer">
                        <input type="checkbox" checked={printSettings.showTime} onChange={e => setPrintSettings({ ...printSettings, showTime: e.target.checked })} className="h-4 w-4 rounded text-stone-900" />
                        <span>Print Invoice Time</span>
                      </label>
                    </div>
                  </div>

                  {/* Font Options */}
                  <div className="space-y-2 border-t pt-2">
                    <span className="block text-[9px] font-black text-stone-400 uppercase tracking-wider">Typography Settings</span>
                    <div className="grid grid-cols-2 gap-2 text-xs">
                      <div>
                        <span className="block text-[9px] font-bold text-stone-600 mb-0.5">Font Family</span>
                        <select 
                          value={printSettings.fontFamily} 
                          onChange={e => setPrintSettings({ ...printSettings, fontFamily: e.target.value })} 
                          className="w-full p-2 border rounded font-bold bg-stone-50"
                        >
                          <option value="Courier Prime">Courier Prime (Monospace)</option>
                          <option value="Roboto Mono">Roboto Mono</option>
                        </select>
                      </div>

                      <div>
                        <span className="block text-[9px] font-bold text-stone-600 mb-0.5">Base Font Size (px)</span>
                        <input 
                          type="number" 
                          value={printSettings.fontSize} 
                          onChange={e => setPrintSettings({ ...printSettings, fontSize: e.target.value })} 
                          className="w-full p-2 border rounded font-bold bg-stone-50" 
                        />
                      </div>
                    </div>
                  </div>

                  {/* Spacing Controls */}
                  <div className="space-y-2 border-t pt-2">
                    <span className="block text-[9px] font-black text-stone-400 uppercase tracking-wider">Table Row & Column Spacing</span>
                    <div className="grid grid-cols-2 gap-2 text-xs">
                      <div>
                        <span className="block text-[9px] font-bold text-stone-600 mb-0.5">Row Vertical Padding (px)</span>
                        <input 
                          type="number" 
                          value={printSettings.rowSpacing} 
                          onChange={e => setPrintSettings({ ...printSettings, rowSpacing: e.target.value })} 
                          className="w-full p-2 border rounded font-bold bg-stone-50" 
                        />
                      </div>

                      <div>
                        <span className="block text-[9px] font-bold text-stone-600 mb-0.5">Column Horizontal Padding (px)</span>
                        <input 
                          type="number" 
                          value={printSettings.colSpacing} 
                          onChange={e => setPrintSettings({ ...printSettings, colSpacing: e.target.value })} 
                          className="w-full p-2 border rounded font-bold bg-stone-50" 
                        />
                      </div>
                    </div>
                  </div>

                  <button 
                    type="button" 
                    onClick={() => triggerNotification("✓ Print settings saved!")} 
                    className="w-full py-2.5 bg-stone-900 text-white font-bold rounded-lg text-xs uppercase tracking-wider shadow-xs"
                  >
                    Save Settings
                  </button>
                </div>
              </div>
            )}

          </main>

          {/* Bottom Navigation Bar */}
          <footer className="bg-stone-900 border-t py-2.5 px-4 no-print flex-shrink-0 z-40 shadow-lg">
            <div className="max-w-md mx-auto flex justify-around items-center">
              
              <button 
                type="button" 
                onClick={() => setCurrentTab("bill")} 
                className={`flex flex-col items-center gap-1 py-1 px-3 rounded-xl transition-all relative ${currentTab === "bill" ? "text-amber-400 bg-stone-800" : "text-stone-400"}`}
              >
                <i className="fa-solid fa-receipt text-lg"></i>
                <span className="text-[10px] font-black uppercase tracking-wider">Fast Draft</span>
                {baggedItems.length > 0 && <span className="absolute -top-1 right-2 bg-rose-600 text-white text-[8px] font-black h-4 w-4 rounded-full flex items-center justify-center animate-bounce">{baggedItems.length}</span>}
              </button>

              <button 
                type="button" 
                onClick={() => setCurrentTab("products")} 
                className={`flex flex-col items-center gap-1 py-1 px-3 rounded-xl transition-all ${currentTab === "products" ? "text-amber-400 bg-stone-800" : "text-stone-400"}`}
              >
                <i className="fa-solid fa-box-open text-lg"></i>
                <span className="text-[10px] font-black uppercase tracking-wider">Products</span>
              </button>

              <button 
                type="button" 
                onClick={() => setCurrentTab("logs")} 
                className={`flex flex-col items-center gap-1 py-1 px-3 rounded-xl transition-all ${currentTab === "logs" ? "text-amber-400 bg-stone-800" : "text-stone-400"}`}
              >
                <i className="fa-solid fa-clock-rotate-left text-lg"></i>
                <span className="text-[10px] font-black uppercase tracking-wider">Historic</span>
              </button>

              <button 
                type="button" 
                onClick={() => setCurrentTab("settings")} 
                className={`flex flex-col items-center gap-1 py-1 px-3 rounded-xl transition-all ${currentTab === "settings" ? "text-amber-400 bg-stone-800" : "text-stone-400"}`}
              >
                <i className="fa-solid fa-gear text-lg"></i>
                <span className="text-[10px] font-black uppercase tracking-wider">Settings</span>
              </button>

            </div>
          </footer>

          <div id="printable-bill-invoice"></div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
