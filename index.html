<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rough Bill Generator Sheets Pro</title>
  
  <!-- CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700;800;900&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['Courier Prime', 'monospace'],
            robotomono: ['Roboto Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    html, body {
      position: fixed;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #f5f5f4;
      margin: 0;
      padding: 0;
    }
    #printable-bill-invoice { display: none; }
    #image-export-container {
      position: absolute;
      left: -9999px;
      top: 0;
      width: 320px;
      background: #ffffff;
      color: #000000;
      padding: 12px;
      box-sizing: border-box;
      z-index: -50;
    }
    @media print {
      @page {
        size: A4;
        margin: 5mm 2mm 5mm 2mm !important;
      }
      html, body {
        position: relative !important;
        width: 210mm !important;
        height: auto !important;
        overflow: visible !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #fff !important;
        color: #000 !important;
        font-family: 'Courier Prime', monospace !important;
        -webkit-print-color-adjust: exact;
      }
      body * { visibility: hidden !important; }
      #printable-bill-invoice, #printable-bill-invoice * { visibility: visible !important; }
      #printable-bill-invoice {
        display: block !important;
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 206mm !important;
        height: auto !important;
        overflow: visible !important;
        margin: 0 !important;
        padding: 2mm 0mm !important;
        box-sizing: border-box !important;
      }
    }
    .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
    .custom-scroll::-webkit-scrollbar-track { background: #e7e5e4; border-radius: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #a8a29e; border-radius: 4px; }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    @keyframes slideInUp {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-slide-up { animation: slideInUp 0.18s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>
<body class="text-stone-900 font-sans antialiased selection:bg-stone-300 bg-stone-100">
  <div id="root" class="h-[100dvh] w-full flex flex-col overflow-hidden"></div>
  <div id="image-export-container"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx8CKL5noduGGl416gC_QhZZ8Sda3iDOsmz8z3rihcmJR2PPSkxAoua8DdIs57vx1L3/exec";

    window.firebaseBridge = {
      connected: true,
      products: [],
      bills: [],
      customers: [],
      
      saveBillToCloudWithNumericId: async (numericId, bill, isEdit) => {
        const payload = {
          action: isEdit ? 'updateTxn' : 'addTxn',
          txn: {
            id: numericId,
            name: bill.customerName,
            amount: Math.round(bill.totalAmount),
            date: bill.date,
            type: "bill",
            remarks: ""
          },
          items: bill.items,
          customer: {
            name: bill.customerName,
            city: bill.customerCity || "Local",
            discount: bill.discountRate,
            joined: bill.date.split(" ")[0]
          }
        };

        try {
          await fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify(payload)
          });
        } catch (err) {
          console.warn("Background cloud sync error:", err);
        }
        return { id: String(numericId) };
      },

      addProductToCloud: async (prod) => {
        const payload = {
          action: 'addProduct',
          name: prod.name
        };
        try {
          await fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify(payload)
          });
        } catch (e) {
          console.warn("Background product add error:", e);
        }
      },

      deleteProductFromCloud: async (name) => {
        const payload = {
          action: 'deleteProduct',
          name: name
        };
        try {
          await fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify(payload)
          });
        } catch (e) {
          console.warn("Background product delete error:", e);
        }
      }
    };

    function App() {
      const [currentTab, setCurrentTab] = useState("bill");
      const [customerName, setCustomerName] = useState("");
      const [customerCity, setCustomerCity] = useState("");
      const [billDate, setBillDate] = useState(new Date().toISOString().split('T')[0]);
      const [discountX, setDiscountX] = useState("0"); 
      const [baggedItems, setBaggedItems] = useState([]);
      const [dbCustomers, setDbCustomers] = useState([]);
      const [cloudProducts, setCloudProducts] = useState([]);
      const [cloudBills, setCloudBills] = useState([]);
      const [showCustSuggestions, setShowCustSuggestions] = useState(false);
      const [editingBillId, setEditingBillId] = useState(null);
      const [notification, setNotification] = useState("");
      const [parserInput, setParserInput] = useState("");
      const [lastProductName, setLastProductName] = useState("");
      const [showPreview, setShowPreview] = useState(false);
      const [newProdName, setNewProdNameState] = useState("");
      const [productFilterQuery, setProductFilterQuery] = useState("");
      const [isVerified, setIsVerified] = useState(false);
      const [passwordInput, setPasswordInput] = useState("");
      const [visibleLogPreviews, setVisibleLogPreviews] = useState({});
      const [selectedCatalogProduct, setSelectedCatalogProduct] = useState(null);
      const [mergeTargetSearch, setMergeTargetSearch] = useState("");
      const [showMergeSuggestions, setShowMergeTargetSuggestions] = useState(false);
      const [bleDevice, setBleDevice] = useState(null);
      const [bleCharacteristic, setBleCharacteristic] = useState(null);
      const [bleStatus, setBleStatus] = useState("Disconnected");
      const [groupLessInputs, setGroupLessInputs] = useState({});

      // Printable Settings State
      const [printSettings, setPrintSettings] = useState({
        showName: true,
        showCity: true,
        showDate: true,
        showTime: true,
        fontSize: '24', // px for receipt text
        fontFamily: 'Courier Prime',
        rowSpacing: '8', // px padding vertical
        colSpacing: '4'  // px padding horizontal
      });

      // Date Range Report States
      const [reportPreset, setReportPreset] = useState("last7");
      const [reportStartDate, setReportStartDate] = useState(new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0]);
      const [reportEndDate, setReportEndDate] = useState(new Date().toISOString().split('T')[0]);

      const custRef = useRef(null);
      const parserRef = useRef(null);

      const triggerNotification = (msg) => {
        setNotification(msg);
        setTimeout(() => setNotification(""), 3500);
      };

      const syncDataFromGoogleSheets = () => {
        const callbackName = "handleSheetsSync_" + Math.floor(Math.random() * 100000);
        window[callbackName] = (data) => {
          if (data) {
            if (data.customers) {
              let parsedCustomers = [];
              if (Array.isArray(data.customers)) {
                parsedCustomers = data.customers;
              } else if (typeof data.customers === "object") {
                parsedCustomers = Object.entries(data.customers).map(([name, details]) => ({
                  name: name,
                  phone: details ? details.phone : "",
                  joined: details ? details.joined : "",
                  city: details ? (details.city || details.City || "Local") : "Local",
                  discount: details ? (details.discount || 0) : 0
                }));
              }
              setDbCustomers(parsedCustomers);
              window.firebaseBridge.customers = parsedCustomers;
            }
            if (data.products) {
              setCloudProducts(data.products);
              window.firebaseBridge.products = data.products;
            }
            if (data.txns) {
              // Sort recent bills first
              const sortedTxns = [...data.txns].sort((a, b) => {
                const timeA = a.id ? Number(a.id) : new Date(a.date || 0).getTime();
                const timeB = b.id ? Number(b.id) : new Date(b.date || 0).getTime();
                return timeB - timeA;
              });
              setCloudBills(sortedTxns);
              window.firebaseBridge.bills = sortedTxns;
            }
          }
          document.getElementById(callbackName)?.remove();
          delete window[callbackName];
        };

        const script = document.createElement("script");
        script.id = callbackName;
        script.src = `${SCRIPT_URL}?action=getData&callback=${callbackName}`;
        document.body.appendChild(script);
      };

      useEffect(() => {
        syncDataFromGoogleSheets();
        const interval = setInterval(() => {
          syncDataFromGoogleSheets();
          if (bleDevice && !bleCharacteristic) {
            reconnectBLEPrinterQuietly();
          }
        }, 5000);
        return () => clearInterval(interval);
      }, [bleDevice, bleCharacteristic]);

      useEffect(() => {
        if (currentTab === "bill" && parserRef.current) {
          parserRef.current.focus();
        }
      }, [currentTab]);

      const getThreeLetterCode = (val) => {
        if (!val) return "GEN";
        const cleaned = val.replace(/[^a-zA-Z]/g, "").toUpperCase();
        return cleaned.slice(0, 3) || "GEN";
      };

      const getNormalizedKey = (str) => str ? str.toLowerCase().trim().replace(/\s+/g, ' ') : "";
      const toTitleCase = (str) => str.replace(/\w\S*/g, (txt) => txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase());

      const formatInvoiceDateTime = (dateStr) => {
        const baseDate = dateStr ? new Date(dateStr) : new Date();
        const currentRealTime = new Date();
        baseDate.setHours(currentRealTime.getHours(), currentRealTime.getMinutes());
        const day = String(baseDate.getDate()).padStart(2, '0');
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        
        const datePart = `${day},${months[baseDate.getMonth()]}`;
        const timePart = `${String(baseDate.getHours()).padStart(2, '0')}:${String(baseDate.getMinutes()).padStart(2, '0')}`;

        if (printSettings.showDate && printSettings.showTime) return `${datePart} ${timePart}`;
        if (printSettings.showDate) return datePart;
        if (printSettings.showTime) return timePart;
        return "";
      };

      const handleCustomerSearchAndSelect = (nameVal) => {
        const match = dbCustomers.find(c => c && c.name && c.name.toLowerCase().trim() === nameVal.toLowerCase().trim());
        if (match) {
          setCustomerName(match.name);
          setCustomerCity(match.city || "");
          setDiscountX(String(match.discount || 0));
          setShowCustSuggestions(false);
        } else {
          setCustomerName("");
          setCustomerCity("");
          setDiscountX("0");
          triggerNotification("Select a valid customer from database.");
        }
      };

      const handleResetAll = () => {
        setCustomerName(""); setCustomerCity(""); setDiscountX("0");
        setBaggedItems([]); setEditingBillId(null);
        setParserInput("");
        setGroupLessInputs({});
        setTimeout(() => {
          if (parserRef.current) parserRef.current.focus();
        }, 100);
      };

      const handleLoadHistoricalBill = (historicalBillObj) => {
        setCustomerName(historicalBillObj.customerName || "");
        setCustomerCity(historicalBillObj.customerCity || "");
        setDiscountX(String(historicalBillObj.discountRate || historicalBillObj.discount || 0));
        setBillDate(historicalBillObj.date || new Date().toISOString().split('T')[0]);
        setBaggedItems(historicalBillObj.items || []);
        setEditingBillId(String(historicalBillObj.id) || null);
        setCurrentTab("bill");
        triggerNotification("Historical bill loaded into bag!");
      };

      const calculateRateForToken = (codeStr, rawX) => {
        const cleanCode = codeStr.toLowerCase().trim();
        const discountRate = parseFloat(rawX) || 0;
        if (cleanCode.endsWith('n')) {
          const val = parseFloat(cleanCode.slice(0, -1));
          return !isNaN(val) ? val * 5 : 0;
        }
        if (cleanCode.endsWith('no') || cleanCode.endsWith('nu')) {
          const val = parseFloat(cleanCode.replace(/(no|nu)$/, ''));
          if (!isNaN(val)) {
            const baseMultiplierPrice = val * 5;
            return baseMultiplierPrice - (baseMultiplierPrice * (discountRate / 100));
          }
          return 0;
        }
        return !isNaN(parseFloat(cleanCode)) ? parseFloat(cleanCode) : 0;
      };

      // FAST PARSER SUBMIT
      const handleParserSubmit = (e) => {
        e.preventDefault();
        const rawInput = parserInput.trim();
        if (!rawInput) return;

        const isSuffixCode = (str) => {
          const s = str.toLowerCase().trim();
          return s.endsWith('n') || s.endsWith('no') || s.endsWith('nu');
        };

        let parsedQty = 1;
        let codeValue = "—";
        let unitPrice = 0;
        let rawProdName = "";

        const match = rawInput.match(/^(\d+(?:\.\d+)?)\s+(.+)$/);

        if (match) {
          parsedQty = parseFloat(match[1]);
          const tokens = match[2].trim().split(/\s+/);
          const lastToken = tokens[tokens.length - 1];

          if (isSuffixCode(lastToken)) {
            codeValue = lastToken;
            unitPrice = calculateRateForToken(codeValue, discountX);
            tokens.pop();
          } else if (!isNaN(parseFloat(lastToken)) && isFinite(lastToken)) {
            codeValue = "—";
            unitPrice = parseFloat(lastToken);
            tokens.pop();
          }

          rawProdName = tokens.join(" ").trim();
        } else {
          parsedQty = 1;
          const tokens = rawInput.split(/\s+/);
          const lastToken = tokens[tokens.length - 1];

          if (isSuffixCode(lastToken)) {
            codeValue = lastToken;
            unitPrice = calculateRateForToken(codeValue, discountX);
            tokens.pop();
            rawProdName = tokens.join(" ").trim();
          } else if (!isNaN(parseFloat(lastToken)) && isFinite(lastToken)) {
            codeValue = "—";
            unitPrice = parseFloat(lastToken);
            tokens.pop();
            rawProdName = tokens.join(" ").trim();
          } else {
            rawProdName = rawInput;
            unitPrice = 0;
          }
        }

        if (!rawProdName) {
          rawProdName = lastProductName ? lastProductName : "Item";
        } else {
          setLastProductName(rawProdName);
        }

        const displayCasing = toTitleCase(rawProdName);
        
        // Save unique product to cloud catalog automatically
        const isDuplicateCatalog = cloudProducts.some(p => p && p.name && getNormalizedKey(p.name) === getNormalizedKey(displayCasing));
        if (!isDuplicateCatalog) {
          window.firebaseBridge.addProductToCloud({ name: displayCasing });
          setCloudProducts(prev => [...prev, { id: Date.now(), name: displayCasing }]);
        }

        const newItem = {
          id: Date.now() + Math.random(), 
          qty: parsedQty, 
          name: displayCasing, 
          code: codeValue,
          basePrice: unitPrice, 
          less: "—", 
          finalUnitPrice: unitPrice, 
          totalAmount: parsedQty * unitPrice
        };

        // Instant insertion into bag
        setBaggedItems(prev => [newItem, ...prev]);
        setParserInput(""); 
        if (parserRef.current) parserRef.current.focus();
      };

      const handleEditBaggedItem = (id, field, value) => {
        setBaggedItems(prev => prev.map(item => {
          if (item.id === id) {
            const updated = { ...item };
            if (field === 'qty') updated.qty = parseFloat(value) || 0;
            if (field === 'name') updated.name = value;
            if (field === 'code') updated.code = value;
            if (field === 'basePrice') updated.basePrice = parseFloat(value) || 0;
            if (field === 'less') updated.less = value;

            if (updated.code !== "—" && updated.code !== "" && field === 'code') {
              updated.basePrice = calculateRateForToken(updated.code, discountX);
            }

            let deduction = 0;
            const cleanLess = String(updated.less).trim();
            if (cleanLess !== "" && cleanLess !== "—") {
              deduction = parseFloat(cleanLess) || 0;
            }

            updated.finalUnitPrice = Math.max(0, updated.basePrice - deduction);
            updated.totalAmount = updated.qty * updated.finalUnitPrice;
            return updated;
          }
          return item;
        }));
      };

      // Group Less Handler for all items of same item name
      const applyGroupLessDiscount = (groupKey, lessValStr) => {
        const amt = parseFloat(lessValStr) || 0;
        setBaggedItems(prev => prev.map(item => {
          if (getNormalizedKey(item.name) === groupKey) {
            const updated = { ...item, less: lessValStr };
            updated.finalUnitPrice = Math.max(0, updated.basePrice - amt);
            updated.totalAmount = updated.qty * updated.finalUnitPrice;
            return updated;
          }
          return item;
        }));
        triggerNotification(`Applied ₹${amt} Less to all ${groupKey.toUpperCase()} items!`);
      };

      // Grouping bagged items by Item Name
      const groupedBaggedItems = useMemo(() => {
        const groups = {};
        baggedItems.forEach(item => {
          const key = getNormalizedKey(item.name);
          if (!groups[key]) {
            groups[key] = {
              key: key,
              displayName: item.name,
              totalQty: 0,
              totalAmount: 0,
              items: []
            };
          }
          groups[key].items.push(item);
          groups[key].totalQty += (item.qty || 0);
          groups[key].totalAmount += (item.totalAmount || 0);
        });
        return Object.values(groups);
      }, [baggedItems]);

      // Top 10 Most Frequently Billed Unique Products
      const topBilledProducts = useMemo(() => {
        const counts = {};
        cloudBills.forEach(b => {
          if (Array.isArray(b.items)) {
            b.items.forEach(i => {
              if (i && i.name) {
                const key = getNormalizedKey(i.name);
                counts[key] = (counts[key] || 0) + (i.qty || 1);
              }
            });
          }
        });

        return [...cloudProducts]
          .filter(p => p && p.name)
          .sort((a, b) => {
            const countA = counts[getNormalizedKey(a.name)] || 0;
            const countB = counts[getNormalizedKey(b.name)] || 0;
            if (countB !== countA) return countB - countA;
            return a.name.localeCompare(b.name);
          });
      }, [cloudProducts, cloudBills]);

      // Renders receipts for printer/spool utilizing Print Settings
      const renderReceiptForSpool = (itemsList, custName, cityVal, dateTimeStr) => {
        const sortedItems = [...itemsList].sort((a,b) => a.name.localeCompare(b.name));
        const total = itemsList.reduce((acc, i) => acc + i.totalAmount, 0);

        const headerDetails = [];
        if (printSettings.showName && custName) headerDetails.push(getThreeLetterCode(custName));
        if (printSettings.showCity && cityVal) headerDetails.push(`(${getThreeLetterCode(cityVal)})`);
        if (dateTimeStr) headerDetails.push(`- ${dateTimeStr}`);

        const fontFamCss = printSettings.fontFamily === 'Roboto Mono' ? "'Roboto Mono', monospace" : "'Courier Prime', monospace";
        const fSizePx = `${printSettings.fontSize}px`;
        const rPadPx = `${printSettings.rowSpacing}px`;
        const cPadPx = `${printSettings.colSpacing}px`;

        let receiptHTML = `
          <div style="font-family: ${fontFamCss};" class="text-center pb-3 mb-3 border-b-4 border-black">
            <h2 style="font-size: ${Math.round(parseInt(printSettings.fontSize)*1.4)}px;" class="font-black uppercase tracking-widest leading-none">ESTIMATE RECEIPT</h2>
            <p style="font-size: ${Math.round(parseInt(printSettings.fontSize)*0.8)}px;" class="font-bold mt-1">Rough Statement Profile</p>
            ${headerDetails.length > 0 ? `
              <div style="font-size: ${fSizePx};" class="mt-2 text-center font-black border-y-2 border-dashed border-black py-1.5">
                ${headerDetails.join(" ")}
              </div>
            ` : ""}
          </div>
          <table style="font-family: ${fontFamCss}; font-size: ${fSizePx};" class="w-full text-left mt-2 border-collapse font-bold">
            <thead>
              <tr class="border-b-4 border-black font-black uppercase">
                <th style="padding: ${rPadPx} ${cPadPx};" class="w-16 text-center">QT</th>
                <th style="padding: ${rPadPx} ${cPadPx};">ITEM</th>
                <th style="padding: ${rPadPx} ${cPadPx};" class="text-right w-28">P</th>
                <th style="padding: ${rPadPx} ${cPadPx};" class="text-right w-36">AMT</th>
              </tr>
            </thead>
            <tbody>
        `;

        sortedItems.forEach((item, index) => {
          const rawCodeOnly = (item.code && item.code !== "—") ? item.code.trim() : "";

          receiptHTML += `
            <tr class="align-top border-b border-stone-200">
              <td style="padding: ${rPadPx} ${cPadPx}; font-size: ${fSizePx};" class="text-center font-bold">${Math.round(item.qty)}</td>
              <td style="padding: ${rPadPx} ${cPadPx}; font-size: ${fSizePx};" class="font-bold uppercase whitespace-pre-wrap break-all leading-tight">
                <div>${item.name.trim().toUpperCase()}</div>
                ${rawCodeOnly ? `<div style="font-size: ${Math.round(parseInt(printSettings.fontSize)*0.75)}px;" class="text-stone-700 font-normal tracking-wide">${rawCodeOnly}</div>` : ""}
              </td>
              <td style="padding: ${rPadPx} ${cPadPx}; font-size: ${fSizePx};" class="text-right font-bold">${Math.round(item.finalUnitPrice)}</td>
              <td style="padding: ${rPadPx} ${cPadPx}; font-size: ${fSizePx};" class="text-right font-bold">${Math.round(item.totalAmount)}</td>
            </tr>
          `;

          if ((index + 1) % 5 === 0 && index !== sortedItems.length - 1) {
            receiptHTML += `
              <tr>
                <td colspan="4" class="py-1 border-b-2 border-dotted border-stone-400"></td>
              </tr>
            `;
          }
        });

        receiptHTML += `
            </tbody>
          </table>
          <div style="font-family: ${fontFamCss}; font-size: ${fSizePx};" class="mt-6 pt-3 border-t-4 border-dashed border-black text-right space-y-2 font-bold">
            <div class="flex justify-between font-black">
              <span>Gross Liability:</span>
              <span>₹${Math.round(total)}</span>
            </div>
            <div style="font-size: ${Math.round(parseInt(printSettings.fontSize)*1.25)}px;" class="flex justify-between font-black border-t-4 border-black pt-2 mt-1">
              <span>Net Total:</span>
              <span>₹${Math.round(total)}</span>
            </div>
          </div>
          <div style="font-family: ${fontFamCss}; font-size: ${fSizePx};" class="mt-10 text-center font-bold pt-4 border-t-2 border-black">
            Thank You For Your Visit<br/>
            Please Visit Again
          </div>
        `;

        return receiptHTML;
      };

      const handleGenerateAndPrintBill = async () => {

        const synchronousIsEdit = !!editingBillId;
        const uniqueNumericId = editingBillId ? Number(editingBillId) : Date.now();
        const printDateFormatted = formatInvoiceDateTime(billDate);
        const finalClientName = customerName.trim() || "Walk-In Customer";

        const printBody = document.getElementById("printable-bill-invoice");
        if (printBody) {
          printBody.innerHTML = renderReceiptForSpool(baggedItems, finalClientName, customerCity, printDateFormatted);
        }
        
        // Fire system print box synchronously
        window.print();

        if (bleCharacteristic) {
          try {
            printBLEThermalDirectly(baggedItems, finalClientName, customerCity, printDateFormatted);
          } catch (e) { 
            console.warn("BLE print dispatch bypassed.", e); 
          }
        }

        triggerNotification("✓ Bill Printed! Syncing to Google Sheets in background...");

        const computedTotalSum = baggedItems.reduce((acc, i) => acc + i.totalAmount, 0);
        const billDataObject = {
          id: uniqueNumericId, customerName: finalClientName, customerCity: customerCity || "Local",
          date: billDate, items: baggedItems, totalAmount: computedTotalSum, discountRate: parseFloat(discountX) || 0,
          timestamp: uniqueNumericId, syncStatusFirestore: true, syncStatusSheets: true, formattedDateTime: printDateFormatted
        };

        window.firebaseBridge.saveBillToCloudWithNumericId(uniqueNumericId, billDataObject, synchronousIsEdit)
          .then(() => triggerNotification("✓ Bill saved to Sheets!"))
          .catch(() => triggerNotification("Failed to save to Sheets."));

        setTimeout(() => {
          handleResetAll();
        }, 300);
      };

      // SHARE BILL IMAGE FUNCTION
      const shareBillImage = (items, custName, cityVal, activeDate) => {
        const exportContainer = document.getElementById("image-export-container");
        if (!exportContainer) return;

        const printDateFormatted = formatInvoiceDateTime(activeDate);
        const finalClientName = custName || "Walk-In Customer";

        exportContainer.innerHTML = renderReceiptForSpool(items, finalClientName, cityVal, printDateFormatted);

        triggerNotification("Generating shareable receipt image...");

        setTimeout(() => {
          html2canvas(exportContainer, { scale: 2, useCORS: true, backgroundColor: "#ffffff" })
            .then(async (canvas) => {
              canvas.toBlob(async (blob) => {
                if (!blob) {
                  triggerNotification("Image export failed.");
                  exportContainer.innerHTML = "";
                  return;
                }
                const fileName = `Bill_${getThreeLetterCode(finalClientName)}_${activeDate}.png`;
                const file = new File([blob], fileName, { type: 'image/png' });

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                  try {
                    await navigator.share({
                      files: [file],
                      title: `Bill - ${finalClientName}`,
                      text: `Receipt for ${finalClientName} (${cityVal})`
                    });
                    triggerNotification("✓ Shared successfully!");
                    exportContainer.innerHTML = "";
                    return;
                  } catch (shareErr) {
                    console.warn("Native share error, downloading instead:", shareErr);
                  }
                }

                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = fileName;
                link.click();
                triggerNotification("✓ Image Downloaded!");
                exportContainer.innerHTML = "";
              }, 'image/png');
            })
            .catch(err => {
              console.error("Canvas image export failed:", err);
              triggerNotification("Image generation failed.");
              exportContainer.innerHTML = "";
            });
        }, 100);

      const handleLogsItemPrint = (logItem) => {

          printBody.innerHTML = renderReceiptForSpool(logItem.items || [], logItem.customerName, logItem.customerCity, printDateFormatted);

      const toggleLogItemPreview = (billId) => {

      const connectBluetoothPrinter = async () => {
        if (!navigator.bluetooth) {
          triggerNotification("Web BLE is unsupported on this browser.");
          return;
        }
        setBleStatus("Scanning...");
        try {
          const device = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: ["000018f0-0000-1000-8000-00805f9b34fb", "0000e7e1-0000-1000-8000-00805f9b34fb"]
          });
          setBleStatus("Connecting...");
          const server = await device.gatt.connect();
          let service;
          try {
            service = await server.getPrimaryService("000018f0-0000-1000-8000-00805f9b34fb");
          } catch(e) {
            service = await server.getPrimaryService("0000e7e1-0000-1000-8000-00805f9b34fb");
          }
          const characteristics = await service.getCharacteristics();
          const writer = characteristics.find(c => c.properties.write || c.properties.writeWithoutResponse);
          setBleDevice(device);
          setBleCharacteristic(writer);
          setBleStatus("Connected");
          triggerNotification("BLE Printer Connected!");
        } catch (err) {
          setBleStatus("Disconnected");
          triggerNotification("BLE connection failed.");
        }
      };

      const reconnectBLEPrinterQuietly = async () => {
        if (!bleDevice) return;
        try {
          const server = await bleDevice.gatt.connect();
          let service;
          try {
            service = await server.getPrimaryService("000018f0-0000-1000-8000-00805f9b34fb");
          } catch(e) {
            service = await server.getPrimaryService("0000e7e1-0000-1000-8000-00805f9b34fb");
          }
          const characteristics = await service.getCharacteristics();
          const writer = characteristics.find(c => c.properties.write || c.properties.writeWithoutResponse);
          setBleCharacteristic(writer);
          setBleStatus("Connected");

          setBleStatus("Disconnected");

      const handleCatalogDelete = async (name) => {

      const getParserAutocompleteQueryLocal = () => {
        const trimmed = parserInput.trim();
        if (!trimmed) return "";
        const match = trimmed.match(/^(\d+(?:\.\d+)?)\s+(.*)$/);
        if (match) {
          const rest = match[2].trim();
          const tokens = rest.split(/\s+/);
          if (tokens.length > 0) {
            const lastToken = tokens[tokens.length - 1];
            if (lastToken.toLowerCase().endsWith('n') || lastToken.toLowerCase().endsWith('no') || lastToken.toLowerCase().endsWith('nu') || (!isNaN(parseFloat(lastToken)) && isFinite(lastToken))) {
              tokens.pop();
            }
          }
          return tokens.join(" ");
        }
        if (isNaN(parseFloat(trimmed.split(/\s+/)[0]))) return trimmed;
        return "";
      };

      const selectParserSuggestion = (prodName) => {

        setParserInput(`${currentQty} ${prodName} `);

          triggerNotification("Failed to add product.");
        }
      };

      const printBLEThermalDirectly = async (itemsList, custName, cityVal, activeDate) => {
        if (!bleCharacteristic) return;
        const encoder = new TextEncoder();
        let esc = [];

        esc.push(0x1B, 0x40); // Init
        esc.push(0x1B, 0x61, 0x01); // Center
        esc.push(...encoder.encode("ESTIMATE RECEIPT\n"));
        
        const headerText = [];
        if (printSettings.showName && custName) headerText.push(custName.toUpperCase());
        if (activeDate) headerText.push(activeDate);
        if (headerText.length > 0) esc.push(...encoder.encode(`${headerText.join(" - ")}\n`));
        
        esc.push(...encoder.encode("--------------------------------\n"));
        
        esc.push(0x1B, 0x61, 0x00); // Left align
        const sortedItems = [...itemsList].sort((a,b) => a.name.localeCompare(b.name));
        
        sortedItems.forEach((item, index) => {
          const nameStr = item.name.trim().toUpperCase().slice(0, 15);
          const qStr = String(Math.round(item.qty)).padEnd(3);
          const pStr = String(Math.round(item.finalUnitPrice)).padStart(4);
          const totalStr = String(Math.round(item.totalAmount)).padStart(6);
          
          esc.push(...encoder.encode(`${qStr} ${nameStr.padEnd(15)} ${pStr} ${totalStr}\n`));
          
          if (item.code && item.code !== "—") {
            esc.push(...encoder.encode(`    ${item.code.trim()}\n`));
          }

          if ((index + 1) % 5 === 0 && index !== sortedItems.length - 1) {
            esc.push(...encoder.encode("................................\n"));
          }
        });

        esc.push(...encoder.encode("--------------------------------\n"));
        const sumTotal = Math.round(itemsList.reduce((acc, i) => acc + i.totalAmount, 0));
        esc.push(...encoder.encode(`TOTAL LIABILITY:         ${sumTotal}\n\n\n`));
        esc.push(0x1D, 0x56, 0x42, 0x00); // Cut

        const bytes = new Uint8Array(esc);
        for (let i = 0; i < bytes.length; i += 20) {
          await bleCharacteristic.writeValue(bytes.slice(i, i + 20));
        }
      };

      const autocompleteQueryLocal = getParserAutocompleteQueryLocal();
      const suggestionsLocal = autocompleteQueryLocal ? topBilledProducts.filter(p => p && p.name && p.name.toLowerCase().includes(autocompleteQueryLocal.toLowerCase())).slice(0, 5) : [];

      const filteredSheetsCustomers = customerName.trim() === "" 
        ? [] 
        : dbCustomers.filter(c => c && c.name && c.name.toLowerCase().includes(customerName.toLowerCase()));

      // Date Range Bill Report Filtering
      const filteredReportBills = useMemo(() => {
        let startMs = 0;
        let endMs = Infinity;

        if (reportPreset === "today") {
          const today = new Date().toISOString().split('T')[0];
          startMs = new Date(today).getTime();
          endMs = startMs + (24 * 60 * 60 * 1000);
        } else if (reportPreset === "last7") {
          endMs = Date.now() + (24 * 60 * 60 * 1000);
          startMs = Date.now() - (7 * 24 * 60 * 60 * 1000);
        } else if (reportPreset === "last30") {
          endMs = Date.now() + (24 * 60 * 60 * 1000);
          startMs = Date.now() - (30 * 24 * 60 * 60 * 1000);
        } else if (reportPreset === "custom") {
          if (reportStartDate) startMs = new Date(reportStartDate).getTime();
          if (reportEndDate) endMs = new Date(reportEndDate).getTime() + (24 * 60 * 60 * 1000);
        }

        return cloudBills.filter(b => {
          const custNameLower = (b.customerName || "").trim().toLowerCase();
          const isWalkIn = custNameLower === "walk-in customer" || custNameLower === "walkin" || custNameLower === "" || custNameLower === "walk in";
          if (isWalkIn) return false;

          const bTime = b.id ? Number(b.id) : new Date(b.date || 0).getTime();
          return bTime >= startMs && bTime <= endMs;
        });
      }, [cloudBills, reportPreset, reportStartDate, reportEndDate]);

      const handlePrintDateRangeReport = () => {

          </div>

              </tr>
            </thead>
            <tbody>
        `;

        filteredReportBills.forEach((b, idx) => {

          if ((idx + 1) % 5 === 0 && idx !== filteredReportBills.length - 1) {
            reportHTML += `
              <tr>
                <td colspan="3" class="py-1 border-b-2 border-dotted border-stone-400"></td>
              </tr>
            `;
          }
        });

        reportHTML += `
            </tbody>
          </table>
          <div class="mt-6 pt-4 border-t-4 border-black text-right text-[28px] font-mono font-black">
            Total Revenue: ₹${Math.round(totalRevenue)}
          </div>
        `;

        const printBody = document.getElementById("printable-bill-invoice");
        if (printBody) {
          printBody.innerHTML = reportHTML;
        }
        window.print();
      };

      return (
        <div className="h-screen w-full flex flex-col bg-stone-100 overflow-hidden relative font-sans text-stone-900">
          
          {/* Bluetooth Disconnection Red Warning Bar */}

          {notification && (

          {/* Top Bar / Customer Selection */}
          <div className="bg-white p-2 border-b border-stone-200 no-print w-full max-w-md mx-auto z-40 shadow-sm flex-shrink-0">
            <div className="flex gap-1.5 items-center font-sans h-11">
              <button type="button" onClick={handleResetAll} title="New Bill Reset" className="h-10 w-10 flex items-center justify-center bg-rose-600 hover:bg-rose-700 text-white rounded-lg font-black shadow-xs active:scale-95 transition-all"><i className="fa-solid fa-plus-circle text-lg"></i></button>

              <div className="flex-grow min-w-0 relative" ref={custRef}>
                <input

                  autoCorrect="off"
                  spellCheck="false"

                  onChange={(e) => { setCustomerName(e.target.value); setShowCustSuggestions(true); }}

                  className="w-full px-2.5 py-1.5 h-10 text-xs bg-stone-50 border rounded-lg font-bold focus:border-stone-800 focus:outline-none"
                />

              <input

              />
              
              <div className="flex items-center gap-0.5">
                <span className="text-[8px] text-stone-400 font-black">X%:</span>
                <input 
                  type="number" 
                  placeholder="0" 
                  value={discountX}

                <i className="fa-brands fa-bluetooth text-sm"></i> {bleStatus.includes('Connected') ? 'ON':'OFF'}

            {currentTab === "bill" && (
              <div className="flex-grow flex flex-col gap-2 overflow-hidden min-h-0">
                
                {/* Product Directory Shortcuts */}
                <div className="bg-white p-2 border rounded-xl shadow-xs flex-shrink-0">

                      {groupedBaggedItems.map(group => (

                          {/* Group Header: Group Item Name FIRST, Total Qty, and Combined Less Option */}

                            <div className="flex items-center justify-between">
                              <span className="font-black text-sm uppercase tracking-wider">{group.displayName}</span>
                              <span className="text-xs bg-amber-400 text-stone-950 font-mono font-black px-2 py-0.5 rounded-md">

                                <button

                <i className="fa-solid fa-receipt text-lg"></i>
                <span className="text-[10px] font-black uppercase tracking-wider">Fast Draft</span>
                {baggedItems.length > 0 && <span className="absolute -top-1 right-2 bg-rose-600 text-white text-[8px] font-black h-4 w-4 rounded-full flex items-center justify-center animate-bounce">{baggedItems.length}</span>}
              </button>

              <button 
                type="button" 
                onClick={() => setCurrentTab("products")} 
                className={`flex flex-col items-center gap-1 py-1 px-3 rounded-xl transition-all ${currentTab === "products" ? "text-amber-400 bg-stone-800" : "text-stone-400"}`}
              >
                <i className="fa-solid fa-box-open text-lg"></i>
                <span className="text-[10px] font-black uppercase tracking-wider">Products</span>
              </button>

              <button 
                type="button" 
                onClick={() => setCurrentTab("logs")} 
                className={`flex flex-col items-center gap-1 py-1 px-3 rounded-xl transition-all ${currentTab === "logs" ? "text-amber-400 bg-stone-800" : "text-stone-400"}`}
              >
                <i className="fa-solid fa-clock-rotate-left text-lg"></i>
                <span className="text-[10px] font-black uppercase tracking-wider">Historic</span>
              </button>

              <button 
                type="button" 
                onClick={() => setCurrentTab("settings")} 
                className={`flex flex-col items-center gap-1 py-1 px-3 rounded-xl transition-all ${currentTab === "settings" ? "text-amber-400 bg-stone-800" : "text-stone-400"}`}
              >
                <i className="fa-solid fa-gear text-lg"></i>
                <span className="text-[10px] font-black uppercase tracking-wider">Settings</span>
              </button>

            </div>
          </footer>

          <div id="printable-bill-invoice"></div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
