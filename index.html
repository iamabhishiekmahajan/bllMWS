                            <div className="space-y-1 divide-y divide-stone-100">
                              {group.items.map(item => (
                                <div key={item.id} className="pt-1 flex items-center justify-between gap-1 text-xs font-mono bg-stone-50 p-1.5 rounded-lg border border-stone-200 flex-nowrap overflow-hidden">
                                  
                                  <div className="flex items-center gap-1 font-mono flex-nowrap flex-grow min-w-0">
                                    <div className="flex items-center gap-0.5 bg-white border border-stone-300 px-1 py-0.5 rounded-lg h-9 flex-shrink-0">
                                      <span className="text-[8px] font-black text-stone-400 uppercase">Q:</span>
                                      <input 
                                        type="number" 
                                        inputMode="decimal"
                                        value={item.qty} 
                                        onChange={e => handleEditBaggedItem(item.id, 'qty', e.target.value)} 
                                        onFocus={(e) => e.target.select()}
                                        className="w-6 text-center font-black bg-transparent focus:outline-none text-xs"
                                      />
                                    </div>

                                    <div className="flex items-center gap-0.5 bg-white border border-stone-300 px-1 py-0.5 rounded-lg h-9 flex-shrink-0">
                                      <span className="text-[8px] font-black text-stone-400 uppercase">C:</span>
                                      <input 
                                        type="text" 
                                        autoCapitalize="characters"
                                        placeholder="CODE"
                                        value={item.code === "—" ? "" : item.code} 
                                        onChange={e => handleEditBaggedItem(item.id, 'code', e.target.value)} 
                                        onFocus={(e) => e.target.select()}
                                        className="w-11 text-center font-bold text-indigo-700 bg-transparent focus:outline-none uppercase text-xs"
                                      />
                                    </div>

                                    <div className="flex items-center gap-0.5 bg-white border border-stone-300 px-1 py-0.5 rounded-lg h-9 flex-shrink-0">
                                      <span className="text-[8px] font-black text-stone-400 uppercase">P:</span>
                                      <input 
                                        type="number" 
                                        inputMode="decimal"
                                        value={Math.round(item.basePrice)} 
                                        onChange={e => handleEditBaggedItem(item.id, 'basePrice', e.target.value)} 
                                        onFocus={(e) => e.target.select()}
                                        className="w-10 text-center font-bold text-stone-800 bg-transparent focus:outline-none text-xs"
                                      />
                                    </div>

                                    <div className="flex items-center gap-0.5 bg-rose-50 border border-rose-300 px-1 py-0.5 rounded-lg h-9 flex-shrink-0">
                                      <span className="text-[8px] font-black text-rose-500 uppercase">L:</span>
                                      <input 
                                        type="text" 
                                        inputMode="decimal"
                                        placeholder="0" 
                                        value={item.less === "—" ? "" : item.less} 
                                        onChange={e => handleEditBaggedItem(item.id, 'less', e.target.value)} 
                                        onFocus={(e) => e.target.select()}
                                        className="w-6 text-center font-bold text-rose-700 bg-transparent focus:outline-none text-xs"
                                      />
                                    </div>

                                    <div className="flex-grow text-right font-black text-stone-900 text-xs whitespace-nowrap px-1">
                                      ₹{Math.round(getItemTotalAmount(item))}
                                    </div>
                                  </div>

                                  <button type="button" onClick={() => setBaggedItems(prev => prev.filter(i => String(i.id) !== String(item.id)))} className="text-stone-400 hover:text-rose-600 px-1.5 text-base flex-shrink-0 h-9 w-8 flex items-center justify-center active:scale-95">
                                    <i className="fa-solid fa-xmark"></i>
                                  </button>

                                </div>
                              ))}
                            </div>

                          </div>
                        );
                      })}

                      <div className="bg-white p-2.5 border rounded-xl space-y-1 shadow-xs font-sans text-xs">
                        <div className="flex justify-between items-center text-stone-600 font-bold">
                          <span>Current Bill Amount:</span>
                          <span className="font-mono text-sm font-black text-stone-900">₹{Math.round(currentBillTotalSum)}</span>
                        </div>

                        {includeLastBalance && (
                          <div className="flex justify-between items-center text-amber-900 bg-amber-50 p-1.5 rounded-lg border border-amber-200 font-bold">
                            <span className="flex items-center gap-1">
                              <span>Lb (Previous Balance):</span>
                              {isFetchingLastBalance && <i className="fa-solid fa-spinner fa-spin text-amber-600"></i>}
                            </span>
                            <span className="font-mono font-black text-amber-800">₹{Math.round(lastBalanceAmount)}</span>
                          </div>
                        )}

                        <div className="flex justify-between items-center pt-1 border-t-2 border-stone-900 font-black text-stone-950">
                          <span className="uppercase tracking-wider">TOTAL:</span>
                          <span className="font-mono text-base text-amber-600 font-black">₹{grandFinalBalance}</span>
                        </div>
                      </div>
                    </>
                  )}

                </div>
              </div>
            )}

            {currentTab === "products" && (
              <div className="flex-grow p-1 bg-stone-50 overflow-y-auto custom-scroll space-y-2">
                
                {/* Add Product & Merge Product Bar */}
                <div className="bg-white p-2.5 border rounded-xl space-y-2 flex-shrink-0 shadow-xs">
                  <form onSubmit={handleProductAddSubmit} className="space-y-1.5">
                    <span className="block text-[9px] font-black text-stone-400 uppercase tracking-wider">Add New Product</span>
                    <div className="flex gap-1.5">
                      <input 
                        type="text" 
                        required 
                        placeholder="Product Name..." 
                        value={newProdName} 
                        onChange={e => setNewProdNameState(e.target.value)} 
                        className="flex-grow px-3 h-10 text-xs border rounded-lg font-bold bg-stone-50 focus:bg-white"
                      />
                      <button type="submit" className="px-3 h-10 bg-stone-900 text-white rounded-lg text-xs font-black uppercase active:scale-95">Add</button>
                    </div>
                  </form>

                  <div className="pt-2 border-t flex justify-between items-center">
                    <button type="button" onClick={() => setShowMergeModal(true)} className="text-xs bg-amber-100 hover:bg-amber-200 text-amber-900 font-extrabold px-3 py-1.5 rounded-lg border border-amber-300 flex items-center gap-1.5 active:scale-95">
                      <i className="fa-solid fa-code-merge"></i> Merge Product Spelling
                    </button>

                    {/* Sorting Toggle */}
                    <div className="flex items-center gap-1 bg-stone-100 p-1 rounded-lg">
                      <button type="button" onClick={() => setProductSortMode("qty")} className={`px-2 py-0.5 text-[10px] font-black rounded ${productSortMode === 'qty' ? 'bg-stone-900 text-white' : 'text-stone-600'}`}>
                        Qty Sold
                      </button>
                      <button type="button" onClick={() => setProductSortMode("alpha")} className={`px-2 py-0.5 text-[10px] font-black rounded ${productSortMode === 'alpha' ? 'bg-stone-900 text-white' : 'text-stone-600'}`}>
                        A-Z
                      </button>
                    </div>
                  </div>
                </div>

                {/* Master Product Directory List with Sale in Cipher */}
                <div className="bg-white border rounded-xl p-2 space-y-1.5 shadow-xs">
                  <div className="text-[10px] font-black text-stone-400 uppercase tracking-wider px-1">Master Directory ({sortedProductsList.length} items)</div>
                  <div className="divide-y divide-stone-100">
                    {sortedProductsList.map(prod => {
                      const prodKey = getNormalizedKey(prod.name);
                      const stats = productSalesStats[prodKey] || { qty: 0, amount: 0 };
                      const cipherSales = encodeCustomCipher(stats.amount);

                      return (
                        <div key={prod.id || prod.name} className="py-2 px-2 flex justify-between items-center text-xs hover:bg-stone-50 rounded-lg transition-colors">
                          <div className="min-w-0 pr-2">
                            <div className="font-extrabold uppercase text-stone-900 truncate">{prod.name}</div>
                            <div className="text-[10px] font-mono text-stone-500 flex items-center gap-2 mt-0.5">
                              <span>Sold Qty: <strong className="text-stone-900">{stats.qty}</strong></span>
                              <span>•</span>
                              <span>Cipher Amt: <strong className="text-amber-700">{cipherSales}</strong></span>
                            </div>
                          </div>
                          <button type="button" onClick={() => handleCatalogDelete(prod.name)} className="text-stone-300 hover:text-rose-600 p-1.5 active:scale-95">
                            <i className="fa-solid fa-trash-can"></i>
                          </button>
                        </div>
                      );
                    })}
                  </div>
                </div>

              </div>
            )}

            {currentTab === "historic" && (
              <div className="flex-grow p-1 bg-stone-50 overflow-y-auto custom-scroll space-y-2">
                
                <div className="bg-white p-2.5 border rounded-xl shadow-xs font-sans">
                  <div className="text-xs font-black uppercase text-stone-900 tracking-wider">Recent 10 Historic Bills</div>
                  <div className="text-[10px] text-stone-400 mt-0.5">Showing last 10 bills generated across sessions</div>
                </div>

                {recent10Bills.length === 0 ? (
                  <div className="p-8 text-center text-xs text-stone-400 italic bg-white rounded-xl border border-dashed">
                    No historic bills recorded yet.
                  </div>
                ) : (
                  <div className="space-y-2">
                    {recent10Bills.map((bill) => {
                      const bId = getTxnId(bill);
                      const bName = getTxnName(bill);
                      const bCity = bill.customerCity || bill.city || "";
                      const bAmt = getTxnAmount(bill);
                      const rawDate = getTxnDate(bill) || bill.timestamp;
                      const bDateFormatted = formatDDMM(rawDate);
                      const items = parseItemsSafely(getTxnItems(bill));
                      const isPreviewOpen = visibleLogPreviews[bId];

                      return (
                        <div key={bId} className="bg-white border-2 border-stone-200 rounded-xl p-2.5 space-y-2 shadow-xs animate-slide-up">
                          <div className="flex justify-between items-start gap-2">
                            <div>
                              <div className="font-black text-xs uppercase text-stone-950">{formatCustomerNameJI(bName)}</div>
                              <div className="text-[10px] font-mono text-stone-500 mt-0.5 flex items-center gap-1.5">
                                <span>#{bId}</span>
                                <span>•</span>
                                <span>{bDateFormatted}</span>
                                {bCity && <span className="bg-stone-100 px-1 py-0.2 text-stone-700 rounded font-black uppercase">{getCityCode(bCity)}</span>}
                              </div>
                            </div>

                            <div className="text-right">
                              <div className="font-mono text-sm font-black text-stone-900">₹{Math.round(bAmt)}</div>
                              <div className="text-[9px] text-stone-400 font-bold">{items.length} item(s)</div>
                            </div>
                          </div>

                          <div className="flex gap-1.5 pt-1 border-t border-stone-100">
                            <button type="button" onClick={() => handleLogsItemPrint(bill)} className="px-2.5 py-1.5 bg-stone-900 text-white rounded-lg text-[10px] font-black uppercase active:scale-95 flex items-center gap-1">
                              <i className="fa-solid fa-print"></i> Print
                            </button>
                            <button type="button" onClick={() => handleLoadHistoricalBill(bill)} className="px-2.5 py-1.5 bg-amber-500 hover:bg-amber-600 text-stone-950 rounded-lg text-[10px] font-black uppercase active:scale-95 flex items-center gap-1">
                              <i className="fa-solid fa-file-pen"></i> Edit Draft
                            </button>
                            <button type="button" onClick={() => toggleLogItemPreview(bId)} className="px-2.5 py-1.5 bg-stone-100 text-stone-700 rounded-lg text-[10px] font-bold uppercase active:scale-95">
                              {isPreviewOpen ? 'Hide' : 'Items'}
                            </button>
                            <button type="button" onClick={() => setBillToDelete(bill)} className="px-2 py-1.5 text-stone-400 hover:text-rose-600 ml-auto active:scale-95">
                              <i className="fa-solid fa-trash-can"></i>
                            </button>
                          </div>

                          {isPreviewOpen && (
                            <div className="mt-2 p-2 bg-stone-50 rounded-lg border text-xs font-mono space-y-1 animate-slide-up">
                              {items.map((i, idx) => (
                                <div key={idx} className="flex justify-between text-stone-800">
                                  <span>{Math.round(i.qty || 1)}x {i.name}</span>
                                  <span>₹{Math.round(getItemTotalAmount(i))}</span>
                                </div>
                              ))}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}

              </div>
            )}

            {currentTab === "ledger" && (
              <div className="flex-grow p-1 bg-stone-50 overflow-y-auto custom-scroll space-y-2">
                
                {/* Ledger & Custom Range Controls */}
                <div className="bg-white p-3 border rounded-xl space-y-2.5 shadow-xs">
                  <div className="flex justify-between items-center">
                    <span className="text-xs font-black uppercase tracking-wider text-stone-900">Sales Ledger & Range Summary</span>
                    <button type="button" onClick={handlePrintSummaryReport} className="px-3 py-1 bg-stone-900 text-white rounded-lg text-xs font-black uppercase active:scale-95 flex items-center gap-1">
                      <i className="fa-solid fa-print"></i> Print Report
                    </button>
                  </div>

                  {/* High Visibility Toggle Switches */}
                  <div className="grid grid-cols-1 gap-2 pt-1 border-t">
                    <label className="flex items-center justify-between p-2 bg-stone-50 border rounded-xl cursor-pointer">
                      <span className="text-xs font-extrabold text-stone-900">Include Walk-In Customers</span>
                      <button 
                        type="button" 
                        onClick={() => setIncludeWalkInInLedger(!includeWalkInInLedger)}
                        className={`w-12 h-6 flex items-center rounded-full p-1 transition-colors ${includeWalkInInLedger ? 'bg-emerald-600' : 'bg-stone-300'}`}
                      >
                        <div className={`bg-white w-4 h-4 rounded-full shadow-md transform transition-transform ${includeWalkInInLedger ? 'translate-x-6' : ''}`}></div>
                      </button>
                    </label>

                    <label className="flex items-center justify-between p-2 bg-stone-50 border rounded-xl cursor-pointer">
                      <span className="text-xs font-extrabold text-stone-900">Slim Checkbox on Printed Slip</span>
                      <button 
                        type="button" 
                        onClick={() => setPrintSettings({ ...printSettings, showSlimCheckbox: !printSettings.showSlimCheckbox })}
                        className={`w-12 h-6 flex items-center rounded-full p-1 transition-colors ${printSettings.showSlimCheckbox ? 'bg-emerald-600' : 'bg-stone-300'}`}
                      >
                        <div className={`bg-white w-4 h-4 rounded-full shadow-md transform transition-transform ${printSettings.showSlimCheckbox ? 'translate-x-6' : ''}`}></div>
                      </button>
                    </label>
                  </div>

                  {/* Preset & Custom Range Selection */}
                  <div className="space-y-1.5 pt-1 border-t">
                    <span className="text-[10px] font-black text-stone-400 uppercase">Select Date Range Filter:</span>
                    <div className="grid grid-cols-4 gap-1">
                      {['all', 'today', '7days', '30days'].map(preset => (
                        <button 
                          key={preset} 
                          type="button" 
                          onClick={() => setLedgerDatePreset(preset)} 
                          className={`py-1.5 text-[10px] font-black uppercase rounded-lg border active:scale-95 ${ledgerDatePreset === preset ? 'bg-stone-900 text-white border-stone-900' : 'bg-stone-50 text-stone-700'}`}
                        >
                          {preset}
                        </button>
                      ))}
                    </div>

                    <div className="flex gap-1.5 pt-1">
                      <input 
                        type="date" 
                        value={ledgerFromDate} 
                        onChange={(e) => { setLedgerFromDate(e.target.value); setLedgerDatePreset("custom"); }} 
                        className="flex-1 px-2 py-1 text-xs border rounded-lg font-bold bg-stone-50"
                      />
                      <span className="text-xs font-bold text-stone-400 self-center">to</span>
                      <input 
                        type="date" 
                        value={ledgerToDate} 
                        onChange={(e) => { setLedgerToDate(e.target.value); setLedgerDatePreset("custom"); }} 
                        className="flex-1 px-2 py-1 text-xs border rounded-lg font-bold bg-stone-50"
                      />
                    </div>
                  </div>

                  <input 
                    type="text" 
                    placeholder="Search Customer in Ledger..." 
                    value={ledgerSearchQuery} 
                    onChange={e => setLedgerSearchQuery(e.target.value)} 
                    className="w-full px-3 py-1.5 text-xs border rounded-lg font-bold bg-stone-50"
                  />
                </div>

                {/* Summary Metrics Cards */}
                <div className="grid grid-cols-2 gap-1.5">
                  <div className="bg-white p-2.5 border rounded-xl shadow-xs">
                    <div className="text-[9px] font-black text-stone-400 uppercase">Today's Total</div>
                    <div className="text-base font-black text-stone-900 font-mono mt-0.5">₹{Math.round(ledgerSummaryTotals.daySum)}</div>
                  </div>
                  <div className="bg-white p-2.5 border rounded-xl shadow-xs">
                    <div className="text-[9px] font-black text-stone-400 uppercase">Filtered Range Revenue</div>
                    <div className="text-base font-black text-amber-600 font-mono mt-0.5">₹{Math.round(ledgerSummaryTotals.rangeSum)}</div>
                  </div>
                </div>

                {/* Filtered Bills Listing */}
                <div className="bg-white border rounded-xl p-2 space-y-1.5 shadow-xs">
                  <div className="text-[10px] font-black text-stone-400 uppercase px-1">Bills in Selected Range ({filteredLedgerBills.length})</div>
                  <div className="divide-y divide-stone-100">
                    {filteredLedgerBills.map(b => {
                      const bId = getTxnId(b);
                      const bName = getTxnName(b);
                      const bAmt = getTxnAmount(b);
                      const bDate = formatDDMM(getTxnDate(b));

                      return (
                        <div key={bId} className="py-2 px-1 flex justify-between items-center text-xs">
                          <div>
                            <div className="font-extrabold uppercase text-stone-900">{formatCustomerNameJI(bName)}</div>
                            <div className="text-[10px] font-mono text-stone-400 mt-0.5">
                              #{bId} • {bDate}
                            </div>
                          </div>
                          <div className="text-right">
                            <div className="font-mono font-black text-stone-900">₹{Math.round(bAmt)}</div>
                            <button type="button" onClick={() => handleLogsItemPrint(b)} className="text-[9px] font-bold text-amber-700 underline">
                              Print Slip
                            </button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

              </div>
            )}

            {currentTab === "settings" && (
              <div className="flex-grow p-1 bg-stone-50 overflow-y-auto custom-scroll space-y-2 text-xs">
                
                <div className="bg-white p-3 border rounded-xl space-y-2 shadow-xs">
                  <span className="font-black text-xs uppercase text-stone-900">Receipt Print Settings</span>
                  
                  <div className="space-y-1 pt-1">
                    <label className="text-[10px] font-black text-stone-500 uppercase">Thermal Print Font Size (px):</label>
                    <input 
                      type="number" 
                      value={printSettings.fontSize} 
                      onChange={e => setPrintSettings({ ...printSettings, fontSize: e.target.value })} 
                      className="w-full p-2 border rounded-lg font-bold bg-stone-50"
                    />
                  </div>

                  <div className="space-y-1">
                    <label className="text-[10px] font-black text-stone-500 uppercase">Footer Custom Message:</label>
                    <textarea 
                      rows="2"
                      value={printSettings.footerMessage} 
                      onChange={e => setPrintSettings({ ...printSettings, footerMessage: e.target.value })} 
                      className="w-full p-2 border rounded-lg font-bold bg-stone-50"
                    ></textarea>
                  </div>

                  <div className="pt-2 border-t space-y-1">
                    <label className="text-[10px] font-black text-stone-500 uppercase">Primary Google Script URL:</label>
                    <input 
                      type="text" 
                      value={printSettings.primarySheetUrl} 
                      onChange={e => setPrintSettings({ ...printSettings, primarySheetUrl: e.target.value })} 
                      className="w-full p-2 border rounded-lg font-mono text-[10px] bg-stone-50"
                    />
                  </div>

                  <div className="space-y-1">
                    <label className="text-[10px] font-black text-stone-500 uppercase">Last Balance Script URL:</label>
                    <input 
                      type="text" 
                      value={printSettings.lastBalanceSheetUrl} 
                      onChange={e => setPrintSettings({ ...printSettings, lastBalanceSheetUrl: e.target.value })} 
                      className="w-full p-2 border rounded-lg font-mono text-[10px] bg-stone-50"
                    />
                  </div>
                </div>

              </div>
            )}

          </main>

          {/* Bottom Navigation Tab Bar */}
          <nav className="bg-white border-t border-stone-200 no-print w-full max-w-md mx-auto flex-shrink-0 z-40 shadow-lg">
            <div className="grid grid-cols-5 h-12 text-[10px] font-black uppercase text-stone-500">
              <button 
                type="button" 
                onClick={() => { triggerHaptic(20); setCurrentTab("bill"); }} 
                className={`flex flex-col items-center justify-center gap-0.5 ${currentTab === 'bill' ? 'text-stone-950 font-black border-t-2 border-stone-900 bg-stone-50' : 'hover:text-stone-800'}`}
              >
                <i className="fa-solid fa-receipt text-sm"></i>
                <span>Bill</span>
              </button>

              <button 
                type="button" 
                onClick={() => { triggerHaptic(20); setCurrentTab("products"); }} 
                className={`flex flex-col items-center justify-center gap-0.5 ${currentTab === 'products' ? 'text-stone-950 font-black border-t-2 border-stone-900 bg-stone-50' : 'hover:text-stone-800'}`}
              >
                <i className="fa-solid fa-boxes-stacked text-sm"></i>
                <span>Products</span>
              </button>

              <button 
                type="button" 
                onClick={() => { triggerHaptic(20); setCurrentTab("historic"); }} 
                className={`flex flex-col items-center justify-center gap-0.5 ${currentTab === 'historic' ? 'text-stone-950 font-black border-t-2 border-stone-900 bg-stone-50' : 'hover:text-stone-800'}`}
              >
                <i className="fa-solid fa-clock-rotate-left text-sm"></i>
                <span>Historic</span>
              </button>

              <button 
                type="button" 
                onClick={() => { triggerHaptic(20); setCurrentTab("ledger"); }} 
                className={`flex flex-col items-center justify-center gap-0.5 ${currentTab === 'ledger' ? 'text-stone-950 font-black border-t-2 border-stone-900 bg-stone-50' : 'hover:text-stone-800'}`}
              >
                <i className="fa-solid fa-book-journal-whills text-sm"></i>
                <span>Ledger</span>
              </button>

              <button 
                type="button" 
                onClick={() => { triggerHaptic(20); setCurrentTab("settings"); }} 
                className={`flex flex-col items-center justify-center gap-0.5 ${currentTab === 'settings' ? 'text-stone-950 font-black border-t-2 border-stone-900 bg-stone-50' : 'hover:text-stone-800'}`}
              >
                <i className="fa-solid fa-sliders text-sm"></i>
                <span>Settings</span>
              </button>
            </div>
          </nav>

        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
