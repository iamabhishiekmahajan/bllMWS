      @page { size: A4; margin: 5mm 2mm 5mm 2mm !important; }

      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.8; }
    }
    .animate-pulse-glow { animation: pulseGlow 1.2s infinite ease-in-out; }

  <script>
    const manifestObj = {
      "name": "Rough Bill Generator Sheets Pro",
      "short_name": "RoughBill",
      "description": "Rough Bill Generator and Ledger Management",
      "start_url": "./",
      "display": "standalone",
      "background_color": "#f5f5f4",
      "theme_color": "#1c1917",
      "orientation": "portrait",
      "icons": [
        { "src": "https://cdn-icons-png.flaticon.com/512/1052/1052866.png", "sizes": "192x192", "type": "image/png", "purpose": "any maskable" },
        { "src": "https://cdn-icons-png.flaticon.com/512/1052/1052866.png", "sizes": "512x512", "type": "image/png", "purpose": "any maskable" }
      ]
    };
    const manifestBlob = new Blob([JSON.stringify(manifestObj)], {type: 'application/json'});
    const manifestUrl = URL.createObjectURL(manifestBlob);
    document.addEventListener("DOMContentLoaded", () => {
      const link = document.getElementById("manifest-placeholder");
      if (link) link.setAttribute("href", manifestUrl);
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swCode = `
          const CACHE_NAME = 'rough-bill-v7';
          self.addEventListener('install', e => self.skipWaiting());
          self.addEventListener('activate', e => e.waitUntil(clients.claim()));
          self.addEventListener('fetch', e => {
            e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
          });
        `;
        const blob = new Blob([swCode], { type: 'text/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
      });
    }
  </script>
</head>
<body class="text-stone-900 font-sans antialiased selection:bg-stone-300 bg-stone-100">
  <div id="root" class="h-[100dvh] w-full flex flex-col overflow-hidden"></div>
  <div id="image-export-container"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const DEFAULT_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx8CKL5noduGGl416gC_QhZZ8Sda3iDOsmz8z3rihcmJR2PPSkxAoua8DdIs57vx1L3/exec";
    const DEFAULT_LAST_BAL_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzHDEi_3-0oaLvlPqM3tJdDcMLCdOvr3DNRdl-DDOcAJu_oCJrLCrukhRycnN6nBcwY/exec";

    // Subtle Haptic Vibration Helper
    const triggerHaptic = (ms = 30) => {
      if (navigator.vibrate) {
        try { navigator.vibrate(ms); } catch (e) {}
      }
    };

    const getTxnName = (t) => t ? String(t.name || t.Name || t.customerName || t.CustomerName || t.Customer || t.customer || "") : "";
    const getTxnAmount = (t) => {
      if (!t) return 0;
      const val = t.amount !== undefined ? t.amount : (t.Amount !== undefined ? t.Amount : (t.totalAmount !== undefined ? t.totalAmount : (t.TotalAmount !== undefined ? t.TotalAmount : (t.Amt !== undefined ? t.Amt : (t.amt !== undefined ? t.amt : 0)))));
      return parseFloat(val) || 0;
    };
    const getTxnType = (t) => t ? String(t.type || t.Type || t.TxnType || t.txnType || "bill").toLowerCase().trim() : "bill";
    const getTxnDate = (t) => t ? String(t.date || t.Date || t.timestamp || t.Timestamp || "") : "";
    const getTxnItems = (t) => t ? (t.items || t.Items || []) : [];
    const getTxnId = (t) => t ? String(t.id || t.Id || t['#'] || "") : "";

    const encodeCustomCipher = (num) => {
      if (num === undefined || num === null || isNaN(num) || num <= 0) return "0";
      const cipherMap = { '0':'y', '1':'k', '2':'a', '3':'n', '4':'p', '5':'u', '6':'r', '7':'c', '8':'i', '9':'t' };
      const str = String(Math.round(num));
      if (str.length === 1) return str;
      const firstDigit = str[0];
      const rest = str.slice(1).split('').map(d => cipherMap[d] || d).join('');
      return firstDigit + rest;
    };

    const formatCustomerNameJI = (name) => {
      if (!name || !name.trim()) return "WALK-IN CUSTOMER JI";
      const trimmed = name.trim().toUpperCase();
      if (trimmed.endsWith(" JI") || trimmed.endsWith("JI")) return trimmed;
      return `${trimmed} JI`;
    };

    const formatDDMM = (dateStr) => {
      const d = dateStr ? new Date(dateStr) : new Date();
      if (isNaN(d.getTime())) return "";
      const day = String(d.getDate()).padStart(2, '0');
      const month = String(d.getMonth() + 1).padStart(2, '0');
      return `${day}/${month}`;
    };

    const parseItemsSafely = (itemsData) => {
      if (!itemsData) return [];
      if (Array.isArray(itemsData)) return itemsData;
      if (typeof itemsData === 'string') {
        try {
          const parsed = JSON.parse(itemsData);
          return Array.isArray(parsed) ? parsed : [];
        } catch (e) { return []; }
      }
      return [];
    };

    const getItemTotalAmount = (item) => {
      if (!item) return 0;
      if (item.totalAmount !== undefined && !isNaN(parseFloat(item.totalAmount)) && parseFloat(item.totalAmount) > 0) {
        return parseFloat(item.totalAmount);
      }
      if (item.amount !== undefined && !isNaN(parseFloat(item.amount)) && parseFloat(item.amount) > 0) {
        return parseFloat(item.amount);
      }
      const q = parseFloat(item.qty) || 1;
      const baseP = parseFloat(item.basePrice || item.rate || item.price || item.finalUnitPrice || 0);
      const lessP = parseFloat(item.less) || 0;
      const finalP = item.finalUnitPrice !== undefined && !isNaN(parseFloat(item.finalUnitPrice)) 
        ? parseFloat(item.finalUnitPrice) 
        : Math.max(0, baseP - lessP);
      return q * finalP;
    };

    const getDeletedProductKeys = () => {
      try { return JSON.parse(localStorage.getItem("deletedProductKeys") || "[]"); } catch (e) { return []; }
    };

    const addDeletedProductKey = (key) => {
      const current = getDeletedProductKeys();
      if (!current.includes(key)) {
        current.push(key);
        localStorage.setItem("deletedProductKeys", JSON.stringify(current));
      }
    };

    const getDeletedBillIds = () => {
      try { return JSON.parse(localStorage.getItem("deletedBillIds") || "[]"); } catch (e) { return []; }
    };

    const addDeletedBillId = (id) => {
      const current = getDeletedBillIds();
      const strId = String(id);
      if (!current.includes(strId)) {
        current.push(strId);
        localStorage.setItem("deletedBillIds", JSON.stringify(current));
      }
    };

    const getTodayDateStr = () => new Date().toISOString().split('T')[0];

    const getLocalBalancesCache = () => {
      try { return JSON.parse(localStorage.getItem("customerBalancesCache") || "{}"); } catch (e) { return {}; }
    };

    const saveLocalBalanceCache = (custName, balance, lastBilledInfo) => {
      if (!custName) return;
      const cache = getLocalBalancesCache();
      const key = String(custName).toLowerCase().trim();
      cache[key] = {
        balance: parseFloat(balance) || 0,
        lastBilledInfo: lastBilledInfo || null,
        updatedDate: getTodayDateStr()
      };
      try { localStorage.setItem("customerBalancesCache", JSON.stringify(cache)); } catch (e) {}
    };

    const idbStorage = {
      dbPromise: null,
      init() {
        if (this.dbPromise) return this.dbPromise;
        this.dbPromise = new Promise((resolve, reject) => {
          const request = indexedDB.open("RoughBillDB", 3);
          request.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains("bills")) db.createObjectStore("bills", { keyPath: "id" });
            if (!db.objectStoreNames.contains("pendingSync")) db.createObjectStore("pendingSync", { keyPath: "id" });
            if (!db.objectStoreNames.contains("products")) db.createObjectStore("products", { keyPath: "name" });
            if (!db.objectStoreNames.contains("customers")) db.createObjectStore("customers", { keyPath: "name" });
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
        return this.dbPromise;
      },
      async saveBill(bill, isPending = false) {
        const db = await this.init();
        return new Promise((resolve) => {
          const tx = db.transaction(["bills", "pendingSync"], "readwrite");
          tx.objectStore("bills").put(bill);
          if (isPending) tx.objectStore("pendingSync").put(bill);
          else tx.objectStore("pendingSync").delete(bill.id);
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(false);
        });
      },
      async removeBill(id) {
        const db = await this.init();
        return new Promise((resolve) => {
          const tx = db.transaction(["bills", "pendingSync"], "readwrite");
          tx.objectStore("bills").delete(id);
          tx.objectStore("pendingSync").delete(id);
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(false);
        });
      },
      async getPending() {
        const db = await this.init();
        return new Promise((resolve) => {
          const tx = db.transaction("pendingSync", "readonly");
          const req = tx.objectStore("pendingSync").getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => resolve([]);
        });
      },
      async getAllBills() {
        const db = await this.init();
        return new Promise((resolve) => {
          const tx = db.transaction("bills", "readonly");
          const req = tx.objectStore("bills").getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => resolve([]);
        });
      },
      async cacheProducts(products) {
        if (!Array.isArray(products) || products.length === 0) return;
        const db = await this.init();
        const tx = db.transaction("products", "readwrite");
        const store = tx.objectStore("products");
        products.forEach(p => { if (p && p.name) store.put(p); });
      },
      async removeProduct(name) {
        const db = await this.init();
        const tx = db.transaction("products", "readwrite");
        tx.objectStore("products").delete(name);
      },
      async getProducts() {
        const db = await this.init();
        return new Promise((resolve) => {
          const tx = db.transaction("products", "readonly");
          const req = tx.objectStore("products").getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => resolve([]);
        });
      },
      async cacheCustomers(customers) {
        if (!Array.isArray(customers) || customers.length === 0) return;
        const db = await this.init();
        const tx = db.transaction("customers", "readwrite");
        const store = tx.objectStore("customers");
        customers.forEach(c => { if (c && c.name) store.put(c); });
      },
      async getCustomers() {
        const db = await this.init();
        return new Promise((resolve) => {
          const tx = db.transaction("customers", "readonly");
          const req = tx.objectStore("customers").getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => resolve([]);
        });
      }
    };

    window.firebaseBridge = {
      connected: true, products: [], bills: [], customers: [],
      
      saveBillToCloudWithNumericId: async (numericId, bill, isEdit, targetUrl = DEFAULT_SCRIPT_URL) => {
        const cleanItems = (bill.items || []).map(item => ({
          qty: parseFloat(item.qty) || 1,
          name: item.name || "Item",
          code: (item.code && item.code !== "—") ? String(item.code) : "",
          basePrice: parseFloat(item.basePrice || item.rate || item.price || 0),
          less: String(item.less !== undefined && item.less !== null ? item.less : "0"),
          finalUnitPrice: parseFloat(item.finalUnitPrice || 0),
          totalAmount: getItemTotalAmount(item)
        }));

        const saveAmount = Math.round(bill.currentBillAmount || bill.totalAmount || 0);

        const payload = {
          action: isEdit ? 'updateTxn' : 'addTxn',
          txn: {
            id: numericId,
            name: bill.customerName,
            amount: saveAmount,
            date: bill.date,
            type: "bill",
            remarks: ""
          },
          items: cleanItems,
          customer: {
            name: bill.customerName,
            city: bill.customerCity || "Local",
            joined: bill.date.split(" ")[0]
          }
        };

        const localBillObj = {
          ...bill,
          items: cleanItems,
          amount: saveAmount,
          localUpdatedAt: Date.now()
        };

        await idbStorage.saveBill(localBillObj, !navigator.onLine);

        if (!navigator.onLine) throw new Error("Offline - Saved locally");

        try {
          await fetch(targetUrl, {
            method: "POST", mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify(payload)
          });
          await idbStorage.saveBill(localBillObj, false);
        } catch (err) {
          await idbStorage.saveBill(localBillObj, true);
          throw err;
        }
        return { id: String(numericId) };
      },

      deleteTxnFromCloud: async (numericId, targetUrl = DEFAULT_SCRIPT_URL) => {
        addDeletedBillId(numericId);
        await idbStorage.removeBill(numericId);
        const payload = { action: 'deleteTxn', id: numericId };
        try {
          await fetch(targetUrl, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(payload) });
        } catch (e) {}
      },

      addProductToCloud: async (prod, targetUrl = DEFAULT_SCRIPT_URL) => {
        const payload = { action: 'addProduct', name: prod.name };
        try {
          await fetch(targetUrl, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(payload) });
        } catch (e) {}
      },

      deleteProductFromCloud: async (name, targetUrl = DEFAULT_SCRIPT_URL) => {
        await idbStorage.removeProduct(name);
        const payload = { action: 'deleteProduct', name: name };
        try {
          await fetch(targetUrl, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(payload) });
        } catch (e) {}
      }
    };

    function App() {
      const [currentTab, setCurrentTab] = useState("bill");
      const [customerName, setCustomerName] = useState("");
      const [customerCity, setCustomerCity] = useState("");
      const [billDate, setBillDate] = useState(new Date().toISOString().split('T')[0]);
      
      const [discountX, setDiscountX] = useState("15");

      const [baggedItems, setBaggedItems] = useState([]);
      const [dbCustomers, setDbCustomers] = useState([]);
      const [cloudProducts, setCloudProducts] = useState([]);
      const [cloudBills, setCloudBills] = useState([]);
      const [showCustSuggestions, setShowCustSuggestions] = useState(false);
      const [editingBillId, setEditingBillId] = useState(null);
      const [notification, setNotification] = useState("");
      const [parserInput, setParserInput] = useState("");
      const [lastProductName, setLastProductName] = useState("");
      const [newProdName, setNewProdNameState] = useState("");
      const [productFilterQuery, setProductFilterQuery] = useState("");

      // Voice Input Speech Recognition
      const [isListening, setIsListening] = useState(false);
      const [voiceLang, setVoiceLang] = useState("pa-IN");
      const [showVoiceTips, setShowVoiceTips] = useState(false);
      const recognitionRef = useRef(null);

      const [isVerified, setIsVerified] = useState(false);
      const [passInput, setPassInput] = useState("");
      const lockTimerRef = useRef(null);

      const [visibleLogPreviews, setVisibleLogPreviews] = useState({});
      const [bleDevice, setBleDevice] = useState(null);
      const [bleCharacteristic, setBleCharacteristic] = useState(null);
      const [bleStatus, setBleStatus] = useState("Disconnected");
      const [groupLessInputs, setGroupLessInputs] = useState({});
      const [billToDelete, setBillToDelete] = useState(null);
      const [showNewBillConfirmModal, setShowNewBillConfirmModal] = useState(false);

      const [showWorkerSlipModal, setShowWorkerSlipModal] = useState(false);
      const [workerNoteInput, setWorkerNoteInput] = useState("");

      const [isOnline, setIsOnline] = useState(navigator.onLine);
      const [pendingSyncCount, setPendingSyncCount] = useState(0);

      const [includeLastBalance, setIncludeLastBalance] = useState(false);
      const [lastBalanceAmount, setLastBalanceAmount] = useState(0);
      const [isFetchingLastBalance, setIsFetchingLastBalance] = useState(false);
      const [lastBilledInfo, setLastBilledInfo] = useState(null);

      // Print settings with showSNo defaulting to true
      const [printSettings, setPrintSettings] = useState(() => {
        try {
          const saved = localStorage.getItem("roughBillPrintSettings");
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed.showSNo === undefined) parsed.showSNo = true;
            return parsed;
          }
        } catch (e) {}
        return {
          showName: true, showCity: true, showDate: true, showTime: true, showSNo: true,
          fontSize: '24', fontFamily: 'Courier Prime', rowSpacing: '8', colSpacing: '4',
          primarySheetUrl: DEFAULT_SCRIPT_URL, lastBalanceSheetUrl: DEFAULT_LAST_BAL_SCRIPT_URL,
          enableInlineAutocomplete: true, footerMessage: "Thank You For Your Visit\nPlease Visit Again"
        };
      });

      useEffect(() => {
        try { localStorage.setItem("roughBillPrintSettings", JSON.stringify(printSettings)); } catch (e) {}
      }, [printSettings]);

      useEffect(() => {
        try {
          const savedDraft = localStorage.getItem("billDraftData");
          if (savedDraft) {
            const d = JSON.parse(savedDraft);
            if (d.customerName) setCustomerName(d.customerName);
            if (d.customerCity) setCustomerCity(d.customerCity);
            if (d.discountX) setDiscountX(d.discountX);
            if (Array.isArray(d.baggedItems)) setBaggedItems(d.baggedItems);
            if (d.includeLastBalance !== undefined) setIncludeLastBalance(d.includeLastBalance);
            if (d.lastBalanceAmount) setLastBalanceAmount(d.lastBalanceAmount);
          }
        } catch (e) {}
      }, []);

      useEffect(() => {
        try {
          const draftObj = { customerName, customerCity, discountX, baggedItems, includeLastBalance, lastBalanceAmount };
          localStorage.setItem("billDraftData", JSON.stringify(draftObj));
        } catch (e) {}
      }, [customerName, customerCity, discountX, baggedItems, includeLastBalance, lastBalanceAmount]);

      const [reportPreset, setReportPreset] = useState("2days");
      const [reportStartDate, setReportStartDate] = useState(new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0]);
      const [reportEndDate, setReportEndDate] = useState(new Date().toISOString().split('T')[0]);

      const custRef = useRef(null);
      const parserRef = useRef(null);
      const baggedListRef = useRef(null);

      const activeScriptUrl = printSettings.primarySheetUrl || DEFAULT_SCRIPT_URL;
      const lastBalScriptUrl = printSettings.lastBalanceSheetUrl || DEFAULT_LAST_BAL_SCRIPT_URL;

      const triggerNotification = (msg) => {
        setNotification(msg);
        setTimeout(() => setNotification(""), 3500);
      };

      // Outside click listener for Customer Suggestions Dropdown
      useEffect(() => {
        const handleClickOutside = (e) => {
          if (custRef.current && !custRef.current.contains(e.target)) {
            setShowCustSuggestions(false);
          }
        };
        document.addEventListener("mousedown", handleClickOutside);
        document.addEventListener("touchstart", handleClickOutside);
        return () => {
          document.removeEventListener("mousedown", handleClickOutside);
          document.removeEventListener("touchstart", handleClickOutside);
        };
      }, []);

      // Filtered Customers - Shows top matches even when input is blank
      const filteredSheetsCustomers = useMemo(() => {
        if (!dbCustomers || !Array.isArray(dbCustomers)) return [];
        const query = customerName.trim().toLowerCase();
        if (!query) return dbCustomers.slice(0, 15);
        return dbCustomers.filter(c => c && c.name && String(c.name).toLowerCase().includes(query)).slice(0, 20);
      }, [dbCustomers, customerName]);

      const getCustomerPhone = (custName) => {
        if (!custName) return "";
        const norm = getNormalizedKey(custName);

        const printName = formatCustomerNameJI(custName);

        const safeItems = Array.isArray(itemsList) ? itemsList : [];

        msg += `*Customer:* ${printName}\n`;
        if (dateStr) msg += `*Date:* ${dateStr}\n`;
        msg += `------------------------\n`;
        
        safeItems.forEach((item) => {
          const qty = Math.round(item.qty || 1);
          const name = String(item.name || "Item").trim().toUpperCase();
          const unitP = Math.round(item.finalUnitPrice !== undefined ? item.finalUnitPrice : (item.rate || item.basePrice || 0));
          const itemAmt = Math.round(getItemTotalAmount(item));
          msg += `▪ ${qty}x ${name} @ ₹${unitP} = ₹${itemAmt}\n`;

      const getNormalizedKey = (str) => str ? String(str).toLowerCase().trim().replace(/\s+/g, ' ') : "";

      const computeLastBalanceFromTxnsArray = (txnsList, nameVal) => {
        if (!nameVal || !nameVal.trim() || !Array.isArray(txnsList)) return { balance: 0, latestBill: null };
        const targetKey = getNormalizedKey(nameVal);
        let bSum = 0, pSum = 0, latestBill = null;

        txnsList.forEach(t => {
          const tName = getNormalizedKey(getTxnName(t));
          if (tName === targetKey) {
            const typeStr = getTxnType(t);
            const amt = getTxnAmount(t);
            if (typeStr === "pay") pSum += amt;
            else if (typeStr === "bill") {
              bSum += amt;
              if (amt > 0) {
                const tId = getTxnId(t) ? Number(getTxnId(t)) : 0;
                const curLatestId = latestBill ? (getTxnId(latestBill) ? Number(getTxnId(latestBill)) : 0) : -1;
                if (!latestBill || tId >= curLatestId) latestBill = t;
              }
            }
          }
        });

        return { balance: bSum - pSum, latestBill: latestBill };
      };

      const fetchLastBalanceInBackground = (nameVal, forceFetch = false) => {
        if (!nameVal || nameVal.trim() === "") {
          setLastBalanceAmount(0); setLastBilledInfo(null);

        const key = getNormalizedKey(nameVal);
        const cache = getLocalBalancesCache();
        const cachedItem = cache[key];

        if (cachedItem && !forceFetch) {
          setLastBalanceAmount(cachedItem.balance || 0);
          setLastBilledInfo(cachedItem.lastBilledInfo || null);
          if (cachedItem.updatedDate === getTodayDateStr()) return;

            if (activeLatestBill) {
              const rawDate = getTxnDate(activeLatestBill) || activeLatestBill.timestamp;

          const deletedBillIds = getDeletedBillIds();

        if (!navigator.onLine) return;
        const pending = await idbStorage.getPending();

        let syncedCount = 0;

          try {
            await window.firebaseBridge.saveBillToCloudWithNumericId(bill.id, bill, false, activeScriptUrl);
            syncedCount++;
          } catch (e) {}

        setPendingSyncCount(remainingPending.length);

        if (syncedCount > 0) {
          triggerNotification(`✓ Auto-synced ${syncedCount} offline bill(s) to Sheets!`);

        }

      const syncDataFromGoogleSheets = () => {
        const callbackName = "handleSheetsSync_" + Math.floor(Math.random() * 100000);
        window[callbackName] = (data) => {
          if (data) {
            const deletedKeys = getDeletedProductKeys();
            const deletedBillIds = getDeletedBillIds();

            const rawCusts = data.customers || data.Customers || [];
            const rawProds = data.products || data.Products || [];
            const rawTxns = data.txns || data.Txns || data.transactions || data.Transactions || [];

            if (rawCusts) {
              let parsedCustomers = Array.isArray(rawCusts) 
                ? rawCusts.map(c => ({ name: c.name || c.Name || "", phone: c.phone || c.Phone || c.discount || c.Discount || "", city: (String(c.city || "").toLowerCase() === "local") ? "" : (c.city || "") }))
                : Object.entries(rawCusts).map(([name, details]) => ({ name, phone: details?.phone || details?.Phone || details?.discount || "", city: details?.city || "" }));
              setDbCustomers(parsedCustomers);
              window.firebaseBridge.customers = parsedCustomers;
              idbStorage.cacheCustomers(parsedCustomers);
            }

            if (rawProds) {
              const validProds = rawProds.filter(p => p && p.name && !deletedKeys.includes(getNormalizedKey(p.name)));
              setCloudProducts(validProds);
              window.firebaseBridge.products = validProds;
              idbStorage.cacheProducts(validProds);
            }

            if (rawTxns) {
              setCloudBills(prevBills => {
                const prevMap = new Map();
                prevBills.forEach(b => prevMap.set(String(getTxnId(b)), b));

                const remoteValid = rawTxns.filter(b => getTxnId(b) && !deletedBillIds.includes(String(getTxnId(b))));

                const merged = remoteValid.map(remoteTxn => {
                  const remoteId = String(getTxnId(remoteTxn));
                  const localTxn = prevMap.get(remoteId);
                  const remoteItems = parseItemsSafely(getTxnItems(remoteTxn));
                  const remoteName = getTxnName(remoteTxn) || "Walk-In Customer";
                  const remoteCity = remoteTxn.customerCity || remoteTxn.city || "";

                  if (localTxn && (Date.now() - (localTxn.localUpdatedAt || 0)) < 30000 && parseItemsSafely(localTxn.items).length > 0) {
                    return { ...remoteTxn, ...localTxn, id: remoteId };
                  }

                  return {
                    ...remoteTxn, id: remoteId, customerName: remoteName, customerCity: remoteCity,
                    items: remoteItems, totalAmount: getTxnAmount(remoteTxn), type: getTxnType(remoteTxn)
                  };
                });

                prevBills.forEach(localTxn => {
                  const lId = String(getTxnId(localTxn));
                  if (!deletedBillIds.includes(lId) && !merged.some(m => String(getTxnId(m)) === lId)) merged.push(localTxn);
                });

                const sortedTxns = merged.sort((a, b) => (getTxnId(b) ? Number(getTxnId(b)) : 0) - (getTxnId(a) ? Number(getTxnId(a)) : 0));
                window.firebaseBridge.bills = sortedTxns;
                sortedTxns.forEach(b => idbStorage.saveBill(b, false));
                return sortedTxns;
              });
            }
          }
          document.getElementById(callbackName)?.remove();
          delete window[callbackName];
        };

        const script = document.createElement("script");
        script.id = callbackName;
        script.src = `${activeScriptUrl}?action=getData&callback=${callbackName}`;
        document.body.appendChild(script);

          if (bleDevice && !bleCharacteristic) reconnectBLEPrinterQuietly();

      }, [bleDevice, bleCharacteristic, activeScriptUrl]);

      useEffect(() => {

      const formatInvoiceDateTime = (dateStr) => {

        baseDate.setHours(currentRealTime.getHours(), currentRealTime.getMinutes());
        
        const datePart = formatDDMM(baseDate);
        const timePart = `${String(baseDate.getHours()).padStart(2, '0')}:${String(baseDate.getMinutes()).padStart(2, '0')}`;

        if (printSettings.showDate && printSettings.showTime) return `${datePart} ${timePart}`;

        if (printSettings.showTime) return timePart;
        return "";

      const handleCustomerSearchAndSelect = (nameVal) => {

        if (match) {

      const handleResetAll = () => {

        const loadedCity = historicalBillObj.customerCity || historicalBillObj.city || "";

        setCustomerName(loadedCustName);
        setCustomerCity(loadedCity && String(loadedCity).toLowerCase() !== "local" ? loadedCity : "");
        setBillDate(getTxnDate(historicalBillObj) ? String(getTxnDate(historicalBillObj)).split(' ')[0] : new Date().toISOString().split('T')[0]);
        
        const rawItems = parseItemsSafely(getTxnItems(historicalBillObj));
        const normalized = rawItems.map((i, idx) => {

          const deduct = (lessVal !== "—" && !isNaN(parseFloat(lessVal))) ? parseFloat(lessVal) : 0;
          const finalPrice = Math.max(0, priceVal - deduct);

          return {

        setBaggedItems(normalized);
        setEditingBillId(String(getTxnId(historicalBillObj)) || null);

        triggerNotification(`✓ Loaded bill with ${normalized.length} item(s)!`);
        if (loadedCustName) fetchLastBalanceInBackground(loadedCustName, false);

      const calculateRateForToken = (codeStr, rawX) => {
        const cleanCode = String(codeStr || "").toLowerCase().trim();
        const discountRate = parseFloat(rawX) || 0;
        if (cleanCode.endsWith('n')) {
          const val = parseFloat(cleanCode.slice(0, -1));
          return !isNaN(val) ? val * 5 : 0;
        }
        if (cleanCode.endsWith('no') || cleanCode.endsWith('nu')) {
          const val = parseFloat(cleanCode.replace(/(no|nu)$/, ''));
          if (!isNaN(val)) {
            const baseMultiplierPrice = val * 5;
            return baseMultiplierPrice - (baseMultiplierPrice * (discountRate / 100));
          }
          return 0;
        }
        return !isNaN(parseFloat(cleanCode)) ? parseFloat(cleanCode) : 0;
      };

      const mostTypedProducts = useMemo(() => {
        if (!cloudProducts || !Array.isArray(cloudProducts)) return [];
        const deletedKeys = getDeletedProductKeys();
        const counts = {};
        cloudBills.forEach(b => {
          parseItemsSafely(getTxnItems(b)).forEach(i => {
            if (i && i.name) {
              const k = getNormalizedKey(i.name);
              counts[k] = (counts[k] || 0) + (parseFloat(i.qty) || 1);
            }
          });
        });

        return [...cloudProducts]
          .filter(p => p && p.name && !deletedKeys.includes(getNormalizedKey(p.name)))
          .sort((a, b) => (counts[getNormalizedKey(b.name)] || 0) - (counts[getNormalizedKey(a.name)] || 0));

      const autocompleteSuggestion = useMemo(() => {
        if (!printSettings.enableInlineAutocomplete || !parserInput.trim()) return "";
        const trimmed = parserInput.trimStart();
        const match = trimmed.match(/^(\d+(?:\.\d+)?)\s+(.*)$/);
        const typedText = match ? match[2].trim() : trimmed;
        if (!typedText) return "";

        const candidate = mostTypedProducts.find(p => p.name.toLowerCase().startsWith(typedText.toLowerCase()));
        if (candidate && candidate.name.toLowerCase() !== typedText.toLowerCase()) {
          return candidate.name.slice(typedText.length);

        return "";
      }, [parserInput, mostTypedProducts, printSettings.enableInlineAutocomplete]);

      const handleParserSubmit = (e) => {
        e.preventDefault();
        let rawInput = parserInput.trim();

        if (autocompleteSuggestion) rawInput = rawInput + autocompleteSuggestion;

        const isSuffixCode = (str) => {

        if (match) {
          parsedQty = parseFloat(match[1]);
          const tokens = match[2].trim().split(/\s+/);
          const lastToken = tokens[tokens.length - 1];

          if (isSuffixCode(lastToken)) {
            codeValue = lastToken;
            unitPrice = calculateRateForToken(codeValue, discountX);
            tokens.pop();
          } else if (!isNaN(parseFloat(lastToken)) && isFinite(lastToken)) {
            codeValue = "—";
            unitPrice = parseFloat(lastToken);
            tokens.pop();
          }
          rawProdName = tokens.join(" ").trim();
        } else {
          parsedQty = 1;
          const tokens = rawInput.split(/\s+/);
          const lastToken = tokens[tokens.length - 1];

          if (isSuffixCode(lastToken)) {
            codeValue = lastToken;
            unitPrice = calculateRateForToken(codeValue, discountX);
            tokens.pop();
            rawProdName = tokens.join(" ").trim();
          } else if (!isNaN(parseFloat(lastToken)) && isFinite(lastToken)) {
            codeValue = "—";
            unitPrice = parseFloat(lastToken);
            tokens.pop();
            rawProdName = tokens.join(" ").trim();
          } else {
            rawProdName = rawInput;
            unitPrice = 0;
          }
        }

        if (!rawProdName) rawProdName = lastProductName || "Item";
        else setLastProductName(rawProdName);

        const displayCasing = toTitleCase(rawProdName);

          const updatedProds = [...cloudProducts, { id: Date.now(), name: displayCasing }];
          setCloudProducts(updatedProds);
          idbStorage.cacheProducts(updatedProds);
        }

        const newItem = {
          id: 'item_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7), 
          qty: parsedQty, name: displayCasing, code: codeValue,
          basePrice: unitPrice, less: "0", finalUnitPrice: unitPrice, totalAmount: parsedQty * unitPrice
        };

        setBaggedItems(prev => [newItem, ...prev]);
        setParserInput(""); 

        if (baggedListRef.current) baggedListRef.current.scrollTop = 0;
        if (parserRef.current) parserRef.current.focus();

      const handleEditBaggedItem = (id, field, value) => {

          if (String(item.id) === String(id)) {
            const updated = { ...item };
            if (field === 'qty') updated.qty = parseFloat(value) || 0;
            if (field === 'name') updated.name = value;
            if (field === 'code') updated.code = value;
            if (field === 'basePrice') updated.basePrice = parseFloat(value) || 0;
            if (field === 'less') updated.less = value;

            if (updated.code !== "—" && String(updated.code) !== "" && field === 'code') {
              updated.basePrice = calculateRateForToken(updated.code, discountX);

            let deduction = 0;
            const cleanLess = String(updated.less || "").trim();
            if (cleanLess !== "" && cleanLess !== "—") deduction = parseFloat(cleanLess) || 0;

            updated.finalUnitPrice = Math.max(0, updated.basePrice - deduction);

      const connectBluetoothPrinter = async () => {
        if (!navigator.bluetooth) {
          triggerNotification("Web BLE unsupported on this browser.");
          return;
        }
        setBleStatus("Scanning...");
        try {
          const device = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: ["000018f0-0000-1000-8000-00805f9b34fb", "0000e7e1-0000-1000-8000-00805f9b34fb"]
          });
          setBleStatus("Connecting...");
          const server = await device.gatt.connect();
          let service;
          try { service = await server.getPrimaryService("000018f0-0000-1000-8000-00805f9b34fb"); }
          catch(e) { service = await server.getPrimaryService("0000e7e1-0000-1000-8000-00805f9b34fb"); }
          const characteristics = await service.getCharacteristics();
          const writer = characteristics.find(c => c.properties.write || c.properties.writeWithoutResponse);
          setBleDevice(device); setBleCharacteristic(writer); setBleStatus("Connected");
          triggerNotification("BLE Printer Connected!");
        } catch (err) {
          setBleStatus("Disconnected");
        }
      };

      const printBLEThermalDirectly = async (itemsList, custName, cityVal, activeDate) => {
        if (!bleCharacteristic) return;
        const encoder = new TextEncoder();
        let esc = [];

        esc.push(0x1B, 0x40, 0x1B, 0x61, 0x01);
        esc.push(...encoder.encode("ESTIMATE RECEIPT\n"));
        
        const nameStr = formatCustomerNameJI(custName);
        const cityStr = (printSettings?.showCity && cityVal && String(cityVal).toLowerCase() !== "local") ? `(${getCityCode(cityVal)})` : "";
        esc.push(...encoder.encode(`${nameStr} ${cityStr}\n`));
        if (activeDate) esc.push(...encoder.encode(`${activeDate}\n`));
        if (lastBilledInfo?.display) esc.push(...encoder.encode(`LAST BILL: ${lastBilledInfo.display}\n`));
        esc.push(...encoder.encode("--------------------------------\n"));
        
        esc.push(0x1B, 0x61, 0x00);
        let sumTotal = 0;
        itemsList.forEach((item, index) => {
          const itemAmt = getItemTotalAmount(item);
          sumTotal += itemAmt;
          const sNoPrefix = printSettings?.showSNo ? `${index + 1}. ` : "";
          const nStr = (sNoPrefix + String(item.name || "")).trim().toUpperCase().slice(0, 15).padEnd(15);
          const qStr = String(Math.round(item.qty || 1)).padEnd(3);
          const pStr = String(Math.round(item.finalUnitPrice || 0)).padStart(4);
          const totalStr = String(Math.round(itemAmt)).padStart(6);
          
          esc.push(...encoder.encode(`${qStr} ${nStr} ${pStr} ${totalStr}\n`));
        });

        esc.push(...encoder.encode("--------------------------------\n"));
        let finalGrandTotal = sumTotal;
        if (includeLastBalance) {
          esc.push(...encoder.encode(`BILL TOTAL:              ${Math.round(sumTotal)}\n`));
          esc.push(...encoder.encode(`LAST BAL:                ${Math.round(lastBalanceAmount)}\n`));
          finalGrandTotal += lastBalanceAmount;
        }
        esc.push(...encoder.encode(`TOTAL:                   ${Math.round(finalGrandTotal)}\n\n`));

        const footerLines = String(printSettings?.footerMessage || "Thank You For Your Visit\nPlease Visit Again").split('\n');
        esc.push(0x1B, 0x61, 0x01);
        footerLines.forEach(line => { if (line.trim()) esc.push(...encoder.encode(`${line.trim()}\n`)); });
        esc.push(...encoder.encode("\n\n\n"));

        const bytes = new Uint8Array(esc);
        for (let i = 0; i < bytes.length; i += 20) {
          await bleCharacteristic.writeValue(bytes.slice(i, i + 20));
        }
      };

            {/* HISTORIC TAB WITH PROMINENT WHATSAPP SHARE OPTION */}
            {currentTab === "logs" && (
              <div className="flex-grow p-1 bg-stone-50 overflow-y-auto custom-scroll space-y-2.5 flex flex-col min-h-0">
                
                <div className="bg-white border rounded-xl p-2.5 space-y-2 shadow-xs flex-shrink-0">
                  <div className="flex justify-between items-center border-b pb-1">
                    <span className="text-[10px] font-black uppercase text-stone-700 tracking-wider">Ledger Summary</span>
                    <button type="button" onClick={handlePrintDateRangeReport} className="px-3 py-1.5 bg-amber-500 text-stone-950 font-black rounded-lg text-[10px] uppercase active:scale-95"><i className="fa-solid fa-print"></i> Print Report</button>
                  </div>

                  <div className="grid grid-cols-4 gap-1 text-[10px] font-bold">
                    {[{ key: "2days", label: "2 Days" }, { key: "today", label: "Today" }, { key: "last7", label: "7 Days" }, { key: "custom", label: "Custom" }].map(preset => (
                      <button key={preset.key} type="button" onClick={() => setReportPreset(preset.key)} className={`py-1.5 rounded-lg text-center uppercase border transition-colors ${reportPreset === preset.key ? 'bg-stone-900 text-white font-black' : 'bg-stone-50 text-stone-700'}`}>{preset.label}</button>
                    ))}
                  </div>

                  <div className="mt-2 max-h-36 overflow-y-auto custom-scroll border rounded-xl bg-stone-50 p-2 text-xs font-mono">
                    <table className="w-full text-left">
                      <thead>
                        <tr className="border-b text-[9px] text-stone-500 uppercase font-sans font-bold">
                          <th className="pb-1">Date</th>
                          <th className="pb-1">Customer</th>
                          <th className="pb-1 text-right">Amount</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-stone-200">
                        {filteredReportBills.map((b, i) => (
                          <tr key={i} className="text-[10px]">
                            <td className="py-1 text-stone-500">{formatDDMM(getTxnDate(b))}</td>
                            <td className="py-1 font-bold uppercase text-stone-900 truncate max-w-[120px]">{formatCustomerNameJI(getTxnName(b))}</td>
                            <td className="py-1 text-right font-black tracking-wide">₹{Math.round(getTxnAmount(b))}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

                <div className="flex-grow overflow-y-auto custom-scroll space-y-2 min-h-0 flex-1">
                  <div className="flex justify-between items-center border-b pb-1">
                    <span className="text-[10px] font-black uppercase text-stone-400 tracking-wider">
                      Historic Bills (Last 7 Days - {isVerified ? 'All' : 'Showing 3'})
                    </span>
                    <input 
                      type="password" 
                      placeholder="..." 
                      value={passInput}
                      onChange={handlePasscodeUnlockInput}
                      className="w-12 text-center p-1 border rounded-lg text-xs font-mono font-bold bg-white focus:outline-none"
                    />
                  </div>

                  <div className="space-y-1.5">
                    {visibleHistoricBills.map(b => {
                      const bId = getTxnId(b);
                      const bName = formatCustomerNameJI(getTxnName(b));
                      const bCity = b.customerCity || b.city;
                      const bAmt = getTxnAmount(b);
                      const bDate = formatDDMM(getTxnDate(b));

                      return (
                        <div key={bId} className="border bg-white rounded-xl p-2.5 text-xs space-y-1 animate-slide-up shadow-xs">
                          <div className="flex justify-between font-bold">
                            <span className="uppercase text-stone-950 truncate max-w-[180px]">{bName} ({bCity ? getCityCode(bCity) : "LOCA"})</span>
                            <span className="font-mono text-stone-800 font-black">₹{Math.round(bAmt)}</span>
                          </div>
                          <div className="flex justify-between items-center text-[9px] text-stone-400 font-mono border-t pt-1.5 mt-1">
                            <span>{bDate}</span>
                            <div className="flex items-center gap-1 flex-wrap">
                              <button type="button" onClick={() => toggleLogItemPreview(bId)} className="px-2 py-1 bg-amber-100 border border-amber-200 rounded-lg text-[9px] font-black text-amber-900 active:scale-95">
                                {visibleLogPreviews[bId] ? '- Close' : '+ Preview'}
                              </button>
                              
                              {/* Direct WhatsApp One-Click Share Option */}
                              <button 
                                type="button" 
                                onClick={() => handleWhatsAppShare(b)} 
                                title="Share Bill via WhatsApp"
                                className="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-[9px] font-black uppercase flex items-center gap-1 active:scale-95 shadow-xs"
                              >
                                <i className="fa-brands fa-whatsapp text-xs"></i> WhatsApp
                              </button>

                              <button type="button" onClick={() => handleLogsItemPrint(b)} className="px-2 py-1 bg-stone-100 border rounded-lg text-[9px] font-bold uppercase active:scale-95">Print</button>
                              <button type="button" onClick={() => shareBillImage(getTxnItems(b), bName, bCity, bDate)} className="px-2 py-1 bg-sky-50 text-sky-800 border rounded-lg text-[9px] font-bold uppercase active:scale-95">Image</button>
                              <button type="button" onClick={() => handleLoadHistoricalBill(b)} className="px-2 py-1 bg-stone-900 text-white rounded-lg text-[9px] font-bold uppercase active:scale-95">Load</button>
                              <button type="button" onClick={() => setBillToDelete(b)} className="px-2 py-1 bg-rose-100 text-rose-700 border rounded-lg text-[9px] active:scale-95"><i className="fa-solid fa-trash-can"></i></button>
                            </div>
                          </div>

                          {visibleLogPreviews[bId] && (
                            <div className="mt-2 p-2 bg-stone-50 border rounded-lg font-mono text-[10px] leading-tight animate-slide-up">
                              <div className="text-center border-b pb-1 mb-1 font-bold">RECEIPT PREVIEW</div>
                              <table className="w-full text-left text-[9px]">
                                <thead>
                                  <tr className="border-b text-stone-500"><th className="w-5">QT</th><th>ITEM</th><th className="text-right">P</th><th className="text-right">AMT</th></tr>
                                </thead>
                                <tbody>
                                  {parseItemsSafely(getTxnItems(b)).map((item, index) => (
                                    <tr key={index} className="border-b border-stone-200/50">
                                      <td className="text-center font-bold">{Math.round(item.qty || 1)}</td>
                                      <td className="uppercase font-bold">{item.name || "Item"}</td>
                                      <td className="text-right">{Math.round(item.finalUnitPrice || item.rate || 0)}</td>
                                      <td className="text-right font-bold">{Math.round(getItemTotalAmount(item))}</td>
                                    </tr>
                                  ))}
                                </tbody>
                              </table>
                            </div>
                          )}

                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* SETTINGS TAB */}
            {currentTab === "settings" && (
              <div className="flex-grow p-2 bg-stone-50 overflow-y-auto custom-scroll space-y-3">
                <div className="bg-white p-3 border rounded-2xl shadow-xs space-y-3">
                  <h3 className="text-xs font-black uppercase text-stone-800 border-b pb-1.5 flex items-center gap-1.5">
                    <i className="fa-solid fa-sliders text-amber-500"></i> Printer & Receipt Settings
                  </h3>

                  <div className="space-y-1">
                    <span className="block text-[9px] font-black text-stone-400 uppercase tracking-wider">Primary Sheet Script URL</span>
                    <input 
                      type="url" 
                      placeholder="https://script.google.com/macros/s/.../exec"
                      value={printSettings.primarySheetUrl || DEFAULT_SCRIPT_URL}
                      onChange={(e) => setPrintSettings({ ...printSettings, primarySheetUrl: e.target.value })}
                      className="w-full text-xs p-2.5 border rounded-xl font-mono font-bold bg-stone-50 focus:outline-none"
                    />
                    <div className="flex justify-between text-[8px] text-stone-400">
                      <span>Google Apps Script web app endpoint.</span>
                      <button type="button" onClick={() => setPrintSettings({ ...printSettings, primarySheetUrl: DEFAULT_SCRIPT_URL })} className="text-amber-700 underline font-bold">Reset Default</button>
                    </div>
                  </div>

                  <div className="space-y-1 border-t pt-2">
                    <span className="block text-[9px] font-black text-stone-400 uppercase tracking-wider">Last Balance Fetch Sheet URL</span>
                    <input 
                      type="url" 
                      placeholder="https://script.google.com/macros/s/.../exec"
                      value={printSettings.lastBalanceSheetUrl || DEFAULT_LAST_BAL_SCRIPT_URL}
                      onChange={(e) => setPrintSettings({ ...printSettings, lastBalanceSheetUrl: e.target.value })}
                      className="w-full text-xs p-2.5 border rounded-xl font-mono font-bold bg-stone-50 focus:outline-none"
                    />
                  </div>

                  <div className="space-y-1 border-t pt-2">
                    <span className="block text-[9px] font-black text-stone-400 uppercase tracking-wider">Custom Receipt Thank You Message</span>
                    <textarea 
                      rows="2"
                      value={printSettings.footerMessage}
                      onChange={(e) => setPrintSettings({ ...printSettings, footerMessage: e.target.value })}
                      className="w-full text-xs p-2.5 border rounded-xl font-mono font-bold bg-stone-50 focus:outline-none"
                    ></textarea>
                  </div>

                  <div className="space-y-1 border-t pt-2">
                    <span className="block text-[9px] font-black text-stone-400 uppercase tracking-wider">Draft Typing Controls</span>
                    <label className="flex items-center justify-between p-2.5 border rounded-xl bg-stone-50 cursor-pointer text-xs font-bold">
                      <span>Inline Ghost Autocomplete Suffix</span>
                      <input 
                        type="checkbox" 
                        checked={printSettings.enableInlineAutocomplete} 
                        onChange={(e) => setPrintSettings({ ...printSettings, enableInlineAutocomplete: e.target.checked })} 
                        className="h-4 w-4 rounded text-stone-900" 
                      />
                    </label>
                  </div>

                  <div className="space-y-2 border-t pt-2">
                    <span className="block text-[9px] font-black text-stone-400 uppercase tracking-wider">Header & Table Field Visibility</span>
                    <div className="grid grid-cols-2 gap-2 text-xs font-bold">
                      <label className="flex items-center gap-2 p-2 border rounded-xl bg-stone-50 cursor-pointer">
                        <input type="checkbox" checked={printSettings.showName} onChange={e => setPrintSettings({ ...printSettings, showName: e.target.checked })} className="h-4 w-4 rounded text-stone-900" />
                        <span>Print Name</span>
                      </label>
                      <label className="flex items-center gap-2 p-2 border rounded-xl bg-stone-50 cursor-pointer">
                        <input type="checkbox" checked={printSettings.showCity} onChange={e => setPrintSettings({ ...printSettings, showCity: e.target.checked })} className="h-4 w-4 rounded text-stone-900" />
                        <span>Print City</span>
                      </label>
                      <label className="flex items-center gap-2 p-2 border rounded-xl bg-stone-50 cursor-pointer">
                        <input type="checkbox" checked={printSettings.showDate} onChange={e => setPrintSettings({ ...printSettings, showDate: e.target.checked })} className="h-4 w-4 rounded text-stone-900" />
                        <span>Print Date</span>
                      </label>
                      <label className="flex items-center gap-2 p-2 border rounded-xl bg-stone-50 cursor-pointer">
                        <input type="checkbox" checked={printSettings.showTime} onChange={e => setPrintSettings({ ...printSettings, showTime: e.target.checked })} className="h-4 w-4 rounded text-stone-900" />
                        <span>Print Time</span>
                      </label>
                      <label className="flex items-center gap-2 p-2 border rounded-xl bg-stone-50 cursor-pointer col-span-2">
                        <input type="checkbox" checked={printSettings.showSNo} onChange={e => setPrintSettings({ ...printSettings, showSNo: e.target.checked })} className="h-4 w-4 rounded text-stone-900" />
                        <span>Print Item Serial Numbers (# / S.No.)</span>
                      </label>
                    </div>
                  </div>

                  <div className="space-y-2 border-t pt-2">
                    <span className="block text-[9px] font-black text-stone-400 uppercase tracking-wider">Typography Settings</span>
                    <div className="grid grid-cols-2 gap-2 text-xs">
                      <div>
                        <span className="block text-[9px] font-bold text-stone-600 mb-0.5">Font Family</span>
                        <select 
                          value={printSettings.fontFamily} 
                          onChange={e => setPrintSettings({ ...printSettings, fontFamily: e.target.value })} 
                          className="w-full p-2 border rounded-xl font-bold bg-stone-50 h-10"
                        >
                          <option value="Courier Prime">Courier Prime</option>
                          <option value="Roboto Mono">Roboto Mono</option>
                        </select>
                      </div>

                      <div>
                        <span className="block text-[9px] font-bold text-stone-600 mb-0.5">Base Font Size (px)</span>
                        <input 
                          type="number" 
                          inputMode="decimal"
                          value={printSettings.fontSize} 
                          onChange={e => setPrintSettings({ ...printSettings, fontSize: e.target.value })} 
                          className="w-full p-2 border rounded-xl font-bold bg-stone-50 h-10" 
                        />
                      </div>
                    </div>
                  </div>

                  <button type="button" onClick={() => triggerNotification("✓ Print settings saved!")} className="w-full min-h-[44px] bg-stone-900 text-white font-bold rounded-xl text-xs uppercase tracking-wider shadow-xs active:scale-95">Save Settings</button>
                </div>
              </div>
            )}

          </main>

          <footer className="bg-stone-900 border-t py-2 px-3 no-print flex-shrink-0 z-40 shadow-lg">
            <div className="max-w-md mx-auto flex justify-around items-center">
              <button type="button" onClick={() => setCurrentTab("bill")} className={`flex flex-col items-center gap-1 py-1.5 px-3 rounded-xl relative min-w-[64px] min-h-[48px] justify-center transition-all ${currentTab === "bill" ? "text-amber-400 bg-stone-800" : "text-stone-400"}`}>
                <i className="fa-solid fa-receipt text-lg"></i>
                <span className="text-[10px] font-black uppercase tracking-wider">Fast Draft</span>
                {baggedItems.length > 0 && <span className="absolute -top-1 right-2 bg-rose-600 text-white text-[8px] font-black h-4 w-4 rounded-full flex items-center justify-center animate-bounce">{baggedItems.length}</span>}
              </button>

              <button type="button" onClick={() => setCurrentTab("products")} className={`flex flex-col items-center gap-1 py-1.5 px-3 rounded-xl min-w-[64px] min-h-[48px] justify-center transition-all ${currentTab === "products" ? "text-amber-400 bg-stone-800" : "text-stone-400"}`}>
                <i className="fa-solid fa-box-open text-lg"></i>
                <span className="text-[10px] font-black uppercase tracking-wider">Products</span>
              </button>

              <button type="button" onClick={() => setCurrentTab("logs")} className={`flex flex-col items-center gap-1 py-1.5 px-3 rounded-xl min-w-[64px] min-h-[48px] justify-center transition-all ${currentTab === "logs" ? "text-amber-400 bg-stone-800" : "text-stone-400"}`}>
                <i className="fa-solid fa-clock-rotate-left text-lg"></i>
                <span className="text-[10px] font-black uppercase tracking-wider">Historic</span>
              </button>

              <button type="button" onClick={() => setCurrentTab("settings")} className={`flex flex-col items-center gap-1 py-1.5 px-3 rounded-xl min-w-[64px] min-h-[48px] justify-center transition-all ${currentTab === "settings" ? "text-amber-400 bg-stone-800" : "text-stone-400"}`}>
                <i className="fa-solid fa-gear text-lg"></i>
                <span className="text-[10px] font-black uppercase tracking-wider">Settings</span>
              </button>
            </div>
          </footer>

          <div id="printable-bill-invoice"></div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
